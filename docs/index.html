sión y diabetes: motor puro (brazo posterior de la cápsula o base del puente), sensitivo puro (tálamo), hemiparesia atáxica y disartria-mano torpe.","Hemorragia hipertensiva: putamen y cápsula (la más frecuente), tálamo, puente y cerebelo.","Esclerosis múltiple: placas periventriculares perpendiculares a los ventrículos; el brote se trata con metilprednisolona."]]],"pearl":"Hemiparesia motora pura sin signos corticales = infarto lacunar en la cápsula interna.","quiz":[{"q":"Hipertenso con hemiparesia derecha pura de cara, brazo y pierna, sin afasia ni déficit sensitivo:","a":["Infarto lacunar en el brazo posterior de la cápsula interna","Infarto cortical de la cerebral media","Infarto de la cerebral posterior","Lesión medular"],"ok":0,"why":"La falta de afasia, negligencia o déficit visual descarta la corteza."}]},"basales":{"name":"Ganglios basales","level":"Caudado + putamen = estriado · putamen + globo pálido = lenticular","sections":[["Función",["Modulan el movimiento: la vía directa lo facilita y la indirecta lo frena; la dopamina de la sustancia negra favorece el movimiento."]],["Correlación clínica ENARM",["Enfermedad de Parkinson: pérdida de neuronas dopaminérgicas de la sustancia negra; bradicinesia más temblor de reposo o rigidez; levodopa con carbidopa.","Enfermedad de Huntington: atrofia del caudado, repeticiones CAG, herencia autosómica dominante; corea y demencia.","Hemibalismo: lesión del núcleo subtalámico contralateral.","Enfermedad de Wilson: degeneración hepatolenticular y anillo de Kayser-Fleischer.","Kernícterus: bilirrubina depositada en los ganglios basales."]]],"pearl":"Movimientos amplios y violentos de medio cuerpo = núcleo subtalámico del lado contrario.","quiz":[{"q":"Hombre de 40 años con corea y demencia; su padre tuvo lo mismo. Estructura atrofiada:","a":["Núcleo caudado","Sustancia negra","Núcleo subtalámico","Cerebelo"],"ok":0,"why":"Enfermedad de Huntington: la atrofia del caudado agranda las astas frontales de los ventrículos laterales."}]},"talamo":{"name":"Tálamo e hipotálamo","level":"A los lados del tercer ventrículo","sections":[["Función",["Tálamo: relevo de todas las vías sensitivas menos el olfato. VPL (cuerpo), VPM (cara), geniculado lateral (visión) y medial (audición).","Hipotálamo: temperatura, hambre, sed, ritmo circadiano y control de la hipófisis; produce ADH y oxitocina."]],["Correlación clínica ENARM",["Síndrome talámico: pérdida de la sensibilidad contralateral y después dolor.","Diabetes insípida central: poliuria hipotónica que responde a la desmopresina.","Secreción inadecuada de ADH: hiponatremia con volumen normal.","Encefalopatía de Wernicke: oftalmoplejía, ataxia y confusión; tiamina antes que glucosa."]]],"pearl":"Todo lo sensitivo pasa por el tálamo, menos el olfato.","quiz":[{"q":"Alcohólico con confusión, ataxia y oftalmoplejía. Antes de la solución glucosada debe recibir:","a":["Tiamina","Ácido fólico","Vitamina B12","Naloxona"],"ok":0,"why":"La glucosa sin tiamina puede precipitar o agravar la encefalopatía de Wernicke."}]},"ventriculos":{"name":"Sistema ventricular y líquido cefalorraquídeo","level":"150 mL en total · se producen unos 500 mL al día","sections":[["Circulación",["Plexos coroideos → ventrículos laterales → agujeros de Monro → tercer ventrículo → acueducto de Silvio → cuarto ventrículo → agujeros de Luschka y Magendie → espacio subaracnoideo → granulaciones aracnoideas."]],["Correlación clínica ENARM",["Hidrocefalia obstructiva: estenosis del acueducto o tumores. Comunicante: tras meningitis o hemorragia subaracnoidea.","Hidrocefalia normotensa: alteración de la marcha, demencia e incontinencia.","Punción lumbar en L3–L4 o L4–L5; antes, descartar datos de masa o herniación.","Líquido bacteriano: polimorfonucleares, glucosa baja y proteínas altas. Viral: linfocitos y glucosa normal.","Meningitis bacteriana del adulto: ceftriaxona y vancomicina, con dexametasona; añadir ampicilina después de los 50 años o con inmunocompromiso."]]],"pearl":"Marcha magnética, demencia e incontinencia = hidrocefalia normotensa.","quiz":[{"q":"Líquido cefalorraquídeo turbio con 2 000 leucocitos (90 % polimorfonucleares), glucosa de 18 mg/dL y proteínas de 250 mg/dL:","a":["Meningitis bacteriana","Meningitis viral","Meningitis tuberculosa","Síndrome de Guillain-Barré"],"ok":0,"why":"Predominio de neutrófilos con glucosa baja y proteínas altas."},{"q":"Anciano con marcha de pasos cortos, deterioro cognitivo e incontinencia urinaria; ventrículos dilatados:","a":["Hidrocefalia normotensa","Enfermedad de Parkinson","Enfermedad de Alzheimer","Demencia vascular"],"ok":0,"why":"La punción evacuadora que mejora la marcha apoya el diagnóstico y predice la respuesta a la derivación."}]},"cerebelo":{"name":"Cerebelo","level":"Fosa posterior · arterias cerebelosas superior, anteroinferior y posteroinferior","sections":[["Función",["Coordina el movimiento del mismo lado, el equilibrio y el tono. Vermis: tronco y marcha. Hemisferios: extremidades."]],["Correlación clínica ENARM",["Síndrome cerebeloso: ataxia, dismetría, disdiadococinesia, temblor de intención y nistagmo, del mismo lado de la lesión.","Alcoholismo crónico: atrofia del vermis con ataxia de la marcha.","Infarto o hemorragia cerebelosa: puede comprimir el tronco y causar hidrocefalia; valorar descompresión.","Tumores de fosa posterior en el niño: meduloblastoma (vermis) y astrocitoma pilocítico."]]],"pearl":"El cerebelo falla del mismo lado: lesión derecha, dismetría derecha.","quiz":[{"q":"Lesión del hemisferio cerebeloso derecho. Se espera:","a":["Dismetría y temblor de intención en las extremidades derechas","Hemiparesia izquierda","Dismetría izquierda","Afasia"],"ok":0,"why":"Las vías cerebelosas se cruzan dos veces, así que el déficit es ipsilateral."}]},"tronco":{"name":"Tronco encefálico","level":"Mesencéfalo (III, IV) · puente (V–VIII) · bulbo (IX–XII)","sections":[["Anatomía",["Los pares craneales III y IV salen del mesencéfalo; del V al VIII, del puente; del IX al XII, del bulbo.","En el bulbo están los centros respiratorio y cardiovascular y se cruzan las pirámides."]],["Correlación clínica ENARM",["Síndromes alternos: par craneal de un lado y hemiparesia del otro.","Weber (mesencéfalo): parálisis del III par y hemiparesia contralateral.","Wallenberg (arteria cerebelosa posteroinferior, bulbo lateral): pérdida de dolor y temperatura en la cara del mismo lado y en el cuerpo del contrario, disfagia, ronquera, Horner y ataxia; sin debilidad.","Hemorragia del puente: coma con pupilas puntiformes.","Síndrome de enclaustramiento: base del puente, arteria basilar."]]],"pearl":"Par craneal de un lado y hemiparesia del otro = la lesión está en el tronco.","quiz":[{"q":"Vértigo, disfagia, ronquera, Horner derecho y pérdida de dolor y temperatura en la hemicara derecha y el hemicuerpo izquierdo:","a":["Síndrome de Wallenberg","Síndrome de Weber","Infarto de la cerebral media","Síndrome de enclaustramiento"],"ok":0,"why":"Infarto bulbar lateral por oclusión de la arteria vertebral o de la cerebelosa posteroinferior."}]},"hipofisis":{"name":"Hipófisis","level":"Silla turca del esfenoides, bajo el quiasma óptico","sections":[["Anatomía",["Adenohipófisis: GH, prolactina, ACTH, TSH, FSH y LH.","Neurohipófisis: almacena la ADH y la oxitocina que produce el hipotálamo."]],["Correlación clínica ENARM",["Prolactinoma: el adenoma más frecuente; amenorrea y galactorrea; se trata con cabergolina.","Macroadenoma: hemianopsia bitemporal por compresión del quiasma.","Acromegalia: IGF-1 elevado y GH que no se suprime con glucosa.","Síndrome de Sheehan: necrosis hipofisaria posparto; falta de lactancia y amenorrea.","Apoplejía hipofisaria: cefalea súbita con oftalmoplejía; hidrocortisona urgente."]]],"pearl":"Hemianopsia bitemporal = quiasma comprimido, casi siempre por un adenoma de hipófisis.","quiz":[{"q":"Mujer con amenorrea, galactorrea y pérdida de la visión periférica de ambos lados. Tratamiento inicial:","a":["Agonista dopaminérgico (cabergolina)","Cirugía transesfenoidal inmediata","Radioterapia","Anticonceptivos orales"],"ok":0,"why":"El prolactinoma responde al tratamiento médico incluso cuando es macroadenoma."},{"q":"Tras una hemorragia obstétrica grave, la paciente no logra lactar y no recupera la menstruación:","a":["Síndrome de Sheehan","Síndrome de Asherman","Prolactinoma","Síndrome de ovario poliquístico"],"ok":0,"why":"La hipófisis crecida del embarazo es vulnerable a la hipoperfusión."}]},"optica":{"name":"Vía óptica y ojo","level":"Nervio → quiasma → cintilla → cuerpo geniculado lateral → radiaciones → cisura calcarina","sections":[["Defectos del campo visual",["Nervio óptico: ceguera de un ojo.","Quiasma: hemianopsia bitemporal.","Cintilla óptica: hemianopsia homónima contralateral.","Asa de Meyer (temporal): cuadrantanopsia superior. Radiación parietal: cuadrantanopsia inferior.","Occipital: hemianopsia homónima con respeto macular."]],["Correlación clínica ENARM",["Reflejo fotomotor: entra por el II par y sale por el III.","Defecto pupilar aferente: neuritis óptica (esclerosis múltiple).","Glaucoma agudo de ángulo cerrado: ojo rojo y doloroso, pupila en midriasis media fija y córnea turbia.","Oclusión de la arteria central de la retina: pérdida súbita e indolora, mancha rojo cereza.","Desprendimiento de retina: destellos, moscas volantes y una cortina."]]],"pearl":"Detrás del quiasma los defectos son homónimos y del lado contrario a la lesión.","quiz":[{"q":"Pérdida súbita e indolora de la visión de un ojo con mancha rojo cereza en la mácula:","a":["Oclusión de la arteria central de la retina","Desprendimiento de retina","Glaucoma agudo","Neuritis óptica"],"ok":0,"why":"La fóvea conserva su color por la coroides mientras el resto de la retina palidece."}]},"pared-abdominal":{"name":"Pared abdominal y conducto inguinal","level":"Ligamento inguinal: de la espina ilíaca anterosuperior al tubérculo del pubis","sections":[["Anatomía",["Recto abdominal en su vaina; oblicuos externo e interno y transverso por fuera. La línea alba une las vainas en la línea media.","Triángulo de Hesselbach: borde del recto, vasos epigástricos inferiores y ligamento inguinal."]],["Correlación clínica ENARM",["Hernia inguinal indirecta: sale lateral a los vasos epigástricos, por el anillo profundo; es la más frecuente en ambos sexos y en niños (conducto peritoneovaginal permeable).","Hernia directa: medial a los vasos epigástricos, por el triángulo de Hesselbach; debilidad de la pared en el adulto mayor.","Hernia femoral: bajo el ligamento inguinal, medial a la vena femoral; más frecuente en mujeres y la que más se estrangula.","Hernia estrangulada: dolor, irreductible, datos de oclusión: cirugía urgente."]]],"pearl":"Indirecta = lateral a los vasos epigástricos. Directa = medial, por el triángulo de Hesselbach.","quiz":[{"q":"Hernia que protruye medial a los vasos epigástricos inferiores:","a":["Inguinal directa","Inguinal indirecta","Femoral","Umbilical"],"ok":0,"why":"Atraviesa el triángulo de Hesselbach por debilidad de la fascia transversalis."},{"q":"Hernia de la región inguinal con mayor riesgo de estrangulación:","a":["Femoral","Inguinal directa","Inguinal indirecta","Epigástrica"],"ok":0,"why":"El anillo femoral es estrecho y rígido; predomina en mujeres."}]},"cara":{"name":"Músculos de la cara y nervio facial","level":"Músculos de la expresión: VII par · masticadores: V3","sections":[["Anatomía",["Músculos de la expresión (orbicular de los ojos y de la boca, frontal, cigomáticos, buccinador, platisma): nervio facial.","Músculos de la masticación (masetero, temporal, pterigoideos): rama mandibular del trigémino."]],["Correlación clínica ENARM",["Parálisis facial periférica (Bell): afecta toda la hemicara, incluida la frente; prednisona en las primeras 72 h.","Parálisis facial central (EVC): respeta la frente porque la parte superior del núcleo recibe corteza de ambos lados.","Ramsay Hunt: parálisis facial con vesículas en el conducto auditivo; aciclovir o valaciclovir más esteroide."]]],"pearl":"Si la frente se arruga, la lesión es central.","quiz":[{"q":"Parálisis facial derecha que respeta la frente, con hemiparesia derecha:","a":["Lesión central del hemisferio izquierdo","Parálisis de Bell derecha","Lesión del nervio facial derecho en el foramen estilomastoideo","Síndrome de Ramsay Hunt"],"ok":0,"why":"La porción superior del núcleo facial recibe fibras de ambos hemisferios."}]},"suelo-pelvico":{"name":"Suelo pélvico","level":"Elevador del ano: pubococcígeo, puborrectal e iliococcígeo","sections":[["Anatomía",["El diafragma pélvico (elevador del ano y coccígeo) sostiene vejiga, útero y recto; lo inerva el pudendo y ramas de S3–S4.","El puborrectal forma un cabestrillo alrededor del recto: el ángulo anorrectal mantiene la continencia."]],["Correlación clínica ENARM",["Incontinencia de esfuerzo: pérdida con la tos; hipermovilidad uretral tras partos vaginales; ejercicios de Kegel y cinta suburetral.","Incontinencia de urgencia: hiperactividad del detrusor; antimuscarínicos o mirabegrón.","Prolapso de órganos pélvicos: cistocele, rectocele, histerocele; clasificación POP-Q.","Desgarros perineales de tercer y cuarto grado: afectan el esfínter anal; reparación inmediata."]]],"pearl":"Esfuerzo = sale con la tos. Urgencia = no llega al baño.","quiz":[{"q":"Multípara de 52 años que pierde orina al toser y estornudar, sin urgencia:","a":["Incontinencia urinaria de esfuerzo","Incontinencia de urgencia","Incontinencia por rebosamiento","Fístula vesicovaginal"],"ok":0,"why":"Se debe a la falta de soporte uretral; primero rehabilitación del suelo pélvico."}]},"espalda":{"name":"Músculos de la espalda","level":"Trapecio y dorsal ancho por fuera · erectores de la columna por dentro","sections":[["Anatomía",["Trapecio: nervio accesorio (XI); eleva y retrae la escápula. Dorsal ancho: nervio toracodorsal; extiende y rota hacia dentro el brazo.","Erectores de la columna (iliocostal, longísimo, espinoso) y transversoespinosos mantienen la postura."]],["Correlación clínica ENARM",["Lumbalgia mecánica aguda: sin datos de alarma no requiere imagen; analgesia y mantenerse activo.","Datos de alarma: fiebre, pérdida de peso, cáncer previo, déficit neurológico, retención urinaria o anestesia en silla de montar, trauma, edad mayor de 50 años.","Lesión del nervio accesorio (cirugía del triángulo posterior del cuello): hombro caído y dificultad para elevar el brazo por encima de la cabeza."]]],"pearl":"Lumbalgia sin banderas rojas: no pidas imagen en las primeras 6 semanas.","quiz":[{"q":"Lumbalgia de 5 días tras cargar peso, sin fiebre ni déficit neurológico. Conducta:","a":["Analgesia, mantenerse activo y vigilar; sin imagen","Resonancia magnética de inmediato","Reposo absoluto por dos semanas","Radiografía y tomografía"],"ok":0,"why":"La mayoría se resuelve en semanas; la imagen se reserva para datos de alarma."}]},"pared-toracica":{"name":"Pared torácica, pectorales y paquete intercostal","level":"Paquete intercostal: vena, arteria y nervio en el borde inferior de cada costilla","sections":[["Anatomía",["Pectoral mayor (nervios pectorales lateral y medial), pectoral menor y serrato anterior (nervio torácico largo).","Arteria mamaria interna a 1–2 cm del borde esternal; es el injerto de elección en la revascularización coronaria.","Intercostales externos (inspiración), internos e íntimos (espiración forzada)."]],["Correlación clínica ENARM",["Lesión del nervio torácico largo (mastectomía, disección axilar): escápula alada.","Herpes zóster: dolor y vesículas siguiendo un dermatoma intercostal sin cruzar la línea media.","Bloqueo intercostal y toracocentesis: siempre por el borde superior de la costilla."]]],"pearl":"Disección axilar + escápula alada = nervio torácico largo.","quiz":[{"q":"Tras una disección axilar, la paciente presenta escápula alada. Nervio lesionado:","a":["Torácico largo","Toracodorsal","Axilar","Supraescapular"],"ok":0,"why":"Inerva el serrato anterior, que fija la escápula a la pared torácica."}]},"utero":{"name":"Útero, cuello uterino y vagina","level":"Entre la vejiga y el recto · anteversoflexión","sections":[["Anatomía",["Fondo, cuerpo, istmo y cuello. Mide unos 7.5 × 5 × 2.5 cm en la mujer adulta; endometrio, miometrio y perimetrio.","Arteria uterina (rama de la ilíaca interna): cruza por encima del uréter a 1.5–2 cm del cuello, «el agua pasa bajo el puente».","Fondo de saco de Douglas (rectouterino): el punto más declive del peritoneo en la mujer."]],["Correlación clínica ENARM",["Miomatosis: tumor benigno más frecuente del útero; sangrado uterino anormal y anemia.","Cáncer cervicouterino: VPH 16 y 18; tamizaje con citología o prueba de VPH; zona de transformación.","Cáncer de endometrio: sangrado posmenopáusico; obesidad y estrógenos sin oposición; biopsia endometrial.","Hemorragia posparto: atonía uterina la primera causa; masaje uterino y oxitocina."]]],"pearl":"El uréter pasa bajo la arteria uterina: es el riesgo de la histerectomía.","quiz":[{"q":"Durante una histerectomía se liga la arteria uterina. Estructura en riesgo que pasa por debajo:","a":["Uréter","Nervio obturador","Vena ilíaca externa","Ligamento redondo"],"ok":0,"why":"La arteria cruza por encima del uréter cerca del cuello uterino."},{"q":"Posmenopáusica obesa con sangrado vaginal. Estudio inicial:","a":["Ultrasonido transvaginal y biopsia de endometrio","Citología cervical sola","Tomografía abdominal","Colposcopia"],"ok":0,"why":"Grosor endometrial mayor de 4 mm obliga a biopsia para descartar cáncer de endometrio."}]},"ovarios":{"name":"Ovarios y trompas uterinas","level":"Ovario en la fosa ovárica de la pared pélvica · trompa de 10–12 cm","sections":[["Anatomía",["Trompa: intersticial, istmo, ampolla e infundíbulo con fimbrias. La fecundación ocurre en la ampolla.","Arteria ovárica: rama de la aorta abdominal, viaja en el ligamento suspensorio (infundibulopélvico). La vena ovárica derecha drena a la cava; la izquierda, a la renal izquierda."]],["Correlación clínica ENARM",["Embarazo ectópico: 95 % en la trompa, sobre todo en la ampolla. Amenorrea, dolor y sangrado; hCG positiva sin saco intrauterino. Roto e inestable: cirugía; estable y pequeño: metotrexato.","Torsión anexial: dolor súbito con náusea, ovario aumentado; laparoscopia urgente para destorcer.","Síndrome de ovario poliquístico: oligoovulación, hiperandrogenismo y ovarios poliquísticos (2 de 3, Rotterdam).","Cáncer de ovario: el ginecológico más letal; CA-125; BRCA1/2."]]],"pearl":"Mujer en edad fértil con dolor abdominal: primero la prueba de embarazo.","quiz":[{"q":"Amenorrea de 7 semanas, dolor en fosa ilíaca derecha, hipotensión y líquido libre. hCG positiva sin saco intrauterino:","a":["Embarazo ectópico roto: cirugía urgente","Aborto incompleto: legrado","Quiste ovárico funcional: vigilancia","Apendicitis: antibiótico"],"ok":0,"why":"La inestabilidad hemodinámica contraindica el metotrexato."},{"q":"Criterios de Rotterdam para síndrome de ovario poliquístico:","a":["Dos de tres: oligoanovulación, hiperandrogenismo y ovarios poliquísticos en el ultrasonido","Obesidad, acné e hirsutismo","Los tres criterios obligatorios","Testosterona alta y LH baja"],"ok":0,"why":"Se excluyen antes otras causas de hiperandrogenismo."}]},"mama":{"name":"Glándula mamaria","level":"Sobre el pectoral mayor, de la 2.ª a la 6.ª costilla · cuadrante superoexterno con cola axilar","sections":[["Anatomía",["15 a 20 lóbulos con sus conductos galactóforos que desembocan en el pezón; ligamentos de Cooper.","Drenaje linfático: 75 % a la axila (niveles I, II y III según el pectoral menor); el resto a la cadena mamaria interna."]],["Correlación clínica ENARM",["Cáncer de mama: el cuadrante superoexterno es el más afectado; carcinoma ductal el más frecuente.","Tamizaje con mastografía (en México, cada dos años de los 40 a los 69).","Retracción de la piel o del pezón: tracción de los ligamentos de Cooper por el tumor.","Fibroadenoma: nódulo móvil, bien delimitado, en mujeres jóvenes.","Mastitis puerperal: S. aureus; seguir amamantando y dar antibiótico; absceso: drenaje."]]],"pearl":"Piel de naranja = obstrucción linfática por cáncer.","quiz":[{"q":"Cuadrante donde se presenta con mayor frecuencia el cáncer de mama:","a":["Superoexterno","Superointerno","Inferoexterno","Retroareolar"],"ok":0,"why":"Tiene más tejido glandular, incluida la cola axilar de Spence."}]},"tiroides":{"name":"Tiroides y paratiroides","level":"Istmo sobre los anillos traqueales 2–4 · lóbulos a los lados de la laringe","sections":[["Anatomía",["Irrigación: tiroideas superiores (carótida externa) e inferiores (tronco tirocervical).","Nervio laríngeo recurrente en el surco traqueoesofágico, junto a la arteria tiroidea inferior. Cuatro paratiroides en la cara posterior."]],["Correlación clínica ENARM",["Hipotiroidismo primario: TSH alta y T4 libre baja; levotiroxina. La causa más frecuente en zonas con yodo suficiente es la tiroiditis de Hashimoto.","Enfermedad de Graves: hipertiroidismo, bocio difuso, oftalmopatía y mixedema pretibial; anticuerpos contra el receptor de TSH.","Nódulo tiroideo: TSH y ultrasonido; biopsia por aspiración según el riesgo ecográfico. El cáncer papilar es el más frecuente.","Tras tiroidectomía: hipocalcemia (Chvostek, Trousseau) por daño paratiroideo y disfonía por lesión del recurrente."]]],"pearl":"Ronquera tras tiroidectomía = laríngeo recurrente. Hormigueo peribucal = hipocalcemia.","quiz":[{"q":"Primer estudio ante un nódulo tiroideo palpable:","a":["TSH y ultrasonido de tiroides","Gammagrama con yodo radiactivo a todos","Tomografía de cuello","Tiroglobulina"],"ok":0,"why":"Si la TSH está baja se hace gammagrama; si no, el ultrasonido decide la biopsia."}]},"salivales":{"name":"Glándulas salivales","level":"Parótida delante de la oreja · submandibular bajo la mandíbula · sublingual en el piso de la boca","sections":[["Anatomía",["El nervio facial atraviesa la parótida y se divide dentro de ella. El conducto de Stenon (parótida) desemboca frente al segundo molar superior; el de Wharton (submandibular), junto al frenillo lingual."]],["Correlación clínica ENARM",["Parotiditis epidémica (paperas): inflamación bilateral; complicaciones: orquitis, meningitis, pancreatitis.","Sialolitiasis: más en la submandibular (saliva más espesa y conducto ascendente); dolor que aumenta al comer.","Adenoma pleomorfo: tumor benigno más frecuente de la parótida; parotidectomía cuidando el facial.","Síndrome de Sjögren: ojo y boca secos, crecimiento parotídeo; anti-Ro y anti-La."]]],"pearl":"Los cálculos prefieren la submandibular; los tumores, la parótida.","quiz":[{"q":"Glándula salival más afectada por litiasis:","a":["Submandibular","Parótida","Sublingual","Glándulas salivales menores"],"ok":0,"why":"Su saliva es más mucosa y alcalina, y el conducto de Wharton asciende contra la gravedad."}]},"linfaticos":{"name":"Ganglios linfáticos","level":"Cadenas cervicales, axilares, inguinales, mediastinales y abdominales","sections":[["Anatomía",["La linfa de la mitad izquierda del cuerpo y de ambas piernas va al conducto torácico, que desemboca en el ángulo venoso yugulosubclavio izquierdo.","Ganglios axilares: niveles I (lateral al pectoral menor), II (detrás) y III (medial)."]],["Correlación clínica ENARM",["Ganglio de Virchow (supraclavicular izquierdo): metástasis de cáncer gástrico u otro abdominal.","Adenopatía de alarma: mayor de 2 cm, dura, fija, indolora, supraclavicular o con síntomas B; biopsia excisional.","Linfoma de Hodgkin: células de Reed-Sternberg; adenopatía cervical en adulto joven.","Ganglio centinela: el primero que recibe la linfa del tumor; guía la estadificación en cáncer de mama y melanoma."]]],"pearl":"Supraclavicular izquierdo palpable: busca un cáncer abdominal.","quiz":[{"q":"Adenopatía supraclavicular izquierda dura en un hombre con pérdida de peso y saciedad temprana:","a":["Ganglio de Virchow por cáncer gástrico","Linfadenitis reactiva","Tuberculosis ganglionar primaria","Quiste branquial"],"ok":0,"why":"El conducto torácico drena el abdomen hacia el ángulo venoso izquierdo."}]},"art-cerebrales":{"name":"Arterias cerebrales y polígono de Willis","level":"Carótidas internas y vertebrales → polígono de Willis en la base del cerebro","sections":[["Anatomía",["Circulación anterior: carótida interna → cerebral anterior y media. Posterior: vertebrales → basilar → cerebrales posteriores.","Comunicantes anterior y posteriores cierran el polígono.","La cerebral media pasa por la cisura de Silvio: segmentos M1 (lenticuloestriadas) y M2 (ramas corticales)."]],["Correlación clínica ENARM",["Aneurismas saculares: en la comunicante anterior el más frecuente; su rotura causa hemorragia subaracnoidea («el peor dolor de cabeza de mi vida»).","Comunicante posterior: aneurisma que comprime el III par con midriasis.","Hemorragia subaracnoidea: tomografía simple; si es negativa, punción lumbar (xantocromía). Nimodipino para el vasoespasmo.","Territorios: cerebral media (cara y brazo, afasia o negligencia), anterior (pierna), posterior (hemianopsia)."]]],"pearl":"Cefalea en estallido + III par con midriasis = aneurisma de la comunicante posterior.","quiz":[{"q":"Cefalea súbita «la peor de mi vida» con rigidez de nuca y tomografía con sangre en las cisternas. Fármaco para prevenir el vasoespasmo:","a":["Nimodipino","Nitroprusiato","Ácido acetilsalicílico","Heparina"],"ok":0,"why":"El vasoespasmo aparece entre los días 3 y 14 y causa isquemia tardía."}]},"venas-cabeza":{"name":"Venas de la cabeza y senos durales","level":"Seno sagital superior → confluencia → transversos → sigmoides → yugular interna","sections":[["Anatomía",["La vena facial comunica con el seno cavernoso a través de la oftálmica, sin válvulas: el «triángulo peligroso» de la cara.","Dentro del seno cavernoso: carótida interna y VI par; en su pared: III, IV, V1 y V2."]],["Correlación clínica ENARM",["Trombosis del seno cavernoso: infección de la cara o los senos paranasales; proptosis, quemosis y oftalmoplejía.","Trombosis venosa cerebral: cefalea, papiledema y crisis en mujeres con anticonceptivos, embarazo o puerperio; angiorresonancia venosa; anticoagular.","Hematoma subdural: rotura de las venas puente hacia el seno sagital."]]],"pearl":"El VI par va dentro del seno cavernoso: es el primero en fallar.","quiz":[{"q":"Puérpera con cefalea progresiva, papiledema y crisis convulsivas:","a":["Trombosis venosa cerebral","Migraña con aura","Eclampsia sin hipertensión","Hemorragia subaracnoidea"],"ok":0,"why":"El puerperio es protrombótico; se confirma con angiorresonancia o angiotomografía venosa."}]},"arterias-miembros":{"name":"Arterias de los miembros","level":"Subclavia → axilar → humeral → radial y cubital · ilíaca externa → femoral → poplítea → tibiales","sections":[["Anatomía",["Pulsos: radial, humeral en el pliegue del codo, femoral bajo el ligamento inguinal, poplíteo, tibial posterior detrás del maléolo medial y pedio.","La arteria femoral en el triángulo femoral: de lateral a medial nervio, arteria, vena (NAV)."]],["Correlación clínica ENARM",["Isquemia arterial aguda: las 6 P (dolor, palidez, ausencia de pulso, poiquilotermia, parestesias, parálisis); embolia por fibrilación auricular; heparina y revascularización urgente.","Enfermedad arterial periférica: claudicación intermitente; índice tobillo-brazo menor de 0.9.","Fractura supracondílea: riesgo de lesión de la arteria humeral. Luxación de rodilla: lesión de la poplítea."]]],"pearl":"Índice tobillo-brazo \u003c 0.9 = enfermedad arterial periférica.","quiz":[{"q":"Paciente con fibrilación auricular, dolor súbito, palidez, frialdad y ausencia de pulso en la pierna izquierda:","a":["Isquemia arterial aguda por embolia: heparina y embolectomía urgente","Trombosis venosa profunda: anticoagulación oral","Claudicación: cilostazol","Celulitis: antibiótico"],"ok":0,"why":"Es una urgencia vascular: la parálisis y la anestesia indican amenaza inmediata del miembro."}]},"venas-miembros":{"name":"Venas de los miembros","level":"Safena mayor: delante del maléolo medial → cayado en la vena femoral","sections":[["Anatomía",["Sistema superficial (safenas, cefálica, basílica), profundo (acompaña a las arterias) y perforantes con válvulas que llevan la sangre de fuera hacia dentro.","La safena mayor es el injerto venoso más usado en la revascularización coronaria."]],["Correlación clínica ENARM",["Trombosis venosa profunda: pierna aumentada de volumen y dolorosa; escala de Wells, dímero D y ultrasonido Doppler; anticoagulación.","Insuficiencia venosa crónica: várices, edema, hiperpigmentación y úlcera en el maléolo medial; compresión.","Venopunción: vena cubital media en el pliegue del codo."]]],"pearl":"Úlcera en el maléolo medial = venosa. En la punta de los dedos = arterial.","quiz":[{"q":"Estudio de imagen inicial ante sospecha de trombosis venosa profunda:","a":["Ultrasonido Doppler con compresión","Flebografía","Tomografía de abdomen","Radiografía de la pierna"],"ok":0,"why":"Es accesible, no invasivo y sensible para las venas proximales."}]},"pares-craneales":{"name":"Pares craneales","level":"I y II del encéfalo · III–IV mesencéfalo · V–VIII puente · IX–XII bulbo","sections":[["Anatomía",["III: motor ocular común (músculos extraoculares y pupila). IV: oblicuo superior. VI: recto lateral.","V: sensibilidad de la cara y masticación. VII: expresión facial, gusto anterior y lagrimeo. VIII: audición y equilibrio.","IX: gusto posterior y reflejo nauseoso. X: paladar, laringe y vísceras. XI: esternocleidomastoideo y trapecio. XII: lengua."]],["Correlación clínica ENARM",["III par por compresión (aneurisma): pupila dilatada primero. Isquémico (diabetes): respeta la pupila.","IV par: diplopía al bajar escaleras; inclina la cabeza al lado contrario.","VI par: el primero en afectarse con hipertensión intracraneal.","Neuralgia del trigémino: dolor lancinante en V2–V3; carbamazepina.","XII par: la lengua se desvía hacia el lado de la lesión."]]],"pearl":"III par con pupila dilatada = compresión hasta demostrar lo contrario.","quiz":[{"q":"Diabético con ptosis y ojo desviado hacia abajo y afuera, pupila normal:","a":["Mononeuropatía isquémica del III par","Aneurisma de la comunicante posterior","Miastenia gravis","Lesión del IV par"],"ok":0,"why":"Las fibras pupilares van por fuera del nervio y se salvan en la isquemia."}]},"facial":{"name":"Nervio facial (VII)","level":"Sale por el foramen estilomastoideo · se divide dentro de la parótida","sections":[["Anatomía",["Ramas: temporal, cigomática, bucal, mandibular marginal y cervical.","Además lleva el gusto de los dos tercios anteriores de la lengua (cuerda del tímpano), lagrimeo, salivación y el músculo del estribo."]],["Correlación clínica ENARM",["Parálisis de Bell: periférica e idiopática; toda la hemicara, hiperacusia y pérdida del gusto; prednisona y protección del ojo.","Parálisis central: respeta la frente.","Parotidectomía: riesgo de lesión del facial."]]],"pearl":"Bell: proteger la córnea, porque el ojo no cierra.","quiz":[{"q":"Tratamiento de la parálisis de Bell en las primeras 72 horas:","a":["Prednisona y cuidado ocular","Solo aciclovir","Descompresión quirúrgica inmediata","Antiagregante plaquetario"],"ok":0,"why":"El esteroide mejora la recuperación; el antiviral solo se agrega en casos graves."}]},"vago":{"name":"Nervio vago (X) y nervios laríngeos","level":"Sale por el agujero yugular · recurrente izquierdo bajo el cayado, derecho bajo la subclavia","sections":[["Anatomía",["Inerva paladar, faringe y laringe, y da el parasimpático de corazón, pulmones y tubo digestivo hasta el ángulo esplénico del colon.","El laríngeo recurrente inerva todos los músculos intrínsecos de la laringe menos el cricotiroideo (laríngeo superior)."]],["Correlación clínica ENARM",["Lesión unilateral del recurrente: disfonía; bilateral: estridor y obstrucción de la vía aérea.","Síncope vasovagal: bradicardia y vasodilatación por descarga vagal.","Maniobra vagal en la taquicardia supraventricular estable."]]],"pearl":"Aneurisma del cayado o cáncer de pulmón izquierdo pueden causar ronquera por el recurrente izquierdo.","quiz":[{"q":"Tras una tiroidectomía total la paciente tiene estridor y dificultad respiratoria inmediata. Causa probable:","a":["Lesión bilateral de los nervios laríngeos recurrentes","Hipocalcemia tardía","Lesión del laríngeo superior","Lesión del nervio frénico"],"ok":0,"why":"Ambas cuerdas vocales quedan en posición paramediana y cierran la glotis."}]},"plexo-braquial":{"name":"Plexo braquial","level":"Raíces C5–T1 → troncos → divisiones → fascículos → nervios terminales","sections":[["Anatomía",["Troncos superior (C5–C6), medio (C7) e inferior (C8–T1). Fascículos lateral, posterior y medial alrededor de la arteria axilar.","Nervios: musculocutáneo, axilar, radial, mediano y cubital; además torácico largo, supraescapular y toracodorsal."]],["Correlación clínica ENARM",["Parálisis de Erb-Duchenne (C5–C6): distocia de hombros; brazo en aducción y rotación interna, «propina del mesero».","Parálisis de Klumpke (C8–T1): mano en garra; puede asociarse a síndrome de Horner.","Tumor de Pancoast: dolor del hombro, atrofia de la mano y Horner.","Nervio axilar (luxación del hombro): debilidad del deltoides y anestesia sobre él."]]],"pearl":"Erb = arriba (C5–C6). Klumpke = abajo (C8–T1), garra y Horner.","quiz":[{"q":"Recién nacido macrosómico con distocia de hombros; el brazo cuelga en aducción y rotación interna:","a":["Parálisis de Erb-Duchenne (C5–C6)","Parálisis de Klumpke","Fractura de húmero","Lesión del nervio radial"],"ok":0,"why":"La tracción lateral del cuello lesiona el tronco superior."}]},"n-radial":{"name":"Nervio radial","level":"Rodea el húmero por el surco radial · se divide en el codo","sections":[["Anatomía",["Extiende el codo (tríceps), la muñeca y los dedos, y supina. Sensibilidad del dorso de la mano del lado del pulgar."]],["Correlación clínica ENARM",["Fractura de la diáfisis humeral: mano caída.","Parálisis del sábado por la noche o por muletas: compresión en la axila o el brazo.","Nervio interóseo posterior: no puede extender los dedos pero sí la muñeca."]]],"pearl":"Mano caída = radial.","quiz":[{"q":"Tras dormir con el brazo sobre el respaldo de una silla no puede extender la muñeca ni los dedos:","a":["Compresión del nervio radial","Síndrome del túnel del carpo","Lesión del cubital en el codo","Radiculopatía C8"],"ok":0,"why":"La compresión en el surco radial produce mano caída con sensibilidad del dorso alterada."}]},"n-mediano":{"name":"Nervio mediano","level":"Pasa por el túnel del carpo con los tendones flexores","sections":[["Anatomía",["Flexores del antebrazo (salvo el cubital anterior y la mitad del flexor profundo), músculos tenares y lumbricales 1 y 2. Sensibilidad palmar del pulgar al anular radial."]],["Correlación clínica ENARM",["Síndrome del túnel del carpo: parestesias nocturnas, Tinel y Phalen, atrofia tenar; asociado a embarazo, hipotiroidismo, diabetes y artritis reumatoide.","Lesión alta: mano del predicador al intentar cerrar el puño.","Fractura supracondílea: nervio interóseo anterior (no hace el «OK»)."]]],"pearl":"Embarazada con manos dormidas en la noche: túnel del carpo.","quiz":[{"q":"Prueba que reproduce las parestesias al flexionar las muñecas un minuto:","a":["Phalen","Tinel","Finkelstein","Allen"],"ok":0,"why":"Tinel es la percusión sobre el túnel; Finkelstein evalúa la tenosinovitis de De Quervain."}]},"n-cubital":{"name":"Nervio cubital (ulnar)","level":"Detrás del epicóndilo medial · canal de Guyon en la muñeca","sections":[["Anatomía",["Músculos intrínsecos de la mano (interóseos, lumbricales 3 y 4, hipotenares, aductor del pulgar). Sensibilidad del meñique y la mitad cubital del anular."]],["Correlación clínica ENARM",["Lesión en el codo (fractura del epicóndilo medial, «hueso de la risa»): garra cubital.","Signo de Froment: flexiona el pulgar para sujetar un papel porque falla el aductor.","Compresión en el canal de Guyon: ciclistas."]]],"pearl":"Garra cubital: anular y meñique en garra.","quiz":[{"q":"Debilidad para separar los dedos y anestesia del meñique tras fractura del epicóndilo medial:","a":["Lesión del nervio cubital","Lesión del mediano","Lesión del radial","Radiculopatía C6"],"ok":0,"why":"El cubital inerva los interóseos, que abducen y aducen los dedos."}]},"nervios-mi":{"name":"Nervios del miembro inferior","level":"Plexo lumbar (L1–L4): femoral y obturador · plexo sacro (L4–S3): ciático","sections":[["Anatomía",["Femoral: extiende la rodilla (cuádriceps) y da el safeno. Obturador: aductores.","Ciático: sale bajo el piriforme y se divide en tibial (flexión plantar) y peroneo común (dorsiflexión y eversión).","Pudendo: perineo y esfínter externo; bloqueo pudendo en el parto."]],["Correlación clínica ENARM",["Lesión del peroneo común (fractura del cuello del peroné, yeso apretado): pie caído y marcha en estepaje.","Inyección intramuscular glútea: cuadrante superoexterno para no lesionar el ciático.","Meralgia parestésica: compresión del cutáneo femoral lateral bajo el ligamento inguinal (obesidad, ropa ajustada).","Lesión del nervio glúteo superior: signo de Trendelenburg."]]],"pearl":"Inyecciones glúteas siempre en el cuadrante superoexterno.","quiz":[{"q":"Tras un yeso apretado bajo la rodilla el paciente no puede dorsiflexionar el pie:","a":["Lesión del nervio peroneo común","Lesión del tibial","Lesión del femoral","Radiculopatía S1"],"ok":0,"why":"El peroneo común rodea el cuello del peroné, donde es muy superficial."}]},"autonomo":{"name":"Sistema nervioso autónomo","level":"Simpático toracolumbar (T1–L2) · parasimpático craneosacro","sections":[["Anatomía",["Cadena simpática a los lados de la columna; el ganglio estrellado (cervicotorácico) inerva la cabeza y el miembro superior.","Parasimpático: pares III, VII, IX y X, y nervios esplácnicos pélvicos S2–S4."]],["Correlación clínica ENARM",["Síndrome de Horner: ptosis, miosis y anhidrosis por interrupción simpática (tumor de Pancoast, disección carotídea, Wallenberg).","Intoxicación por organofosforados: crisis colinérgica (miosis, sialorrea, broncorrea, bradicardia); atropina y pralidoxima.","Disreflexia autonómica en lesión medular por encima de T6: hipertensión súbita por un estímulo como una vejiga llena."]]],"pearl":"Ptosis + miosis + anhidrosis = Horner.","quiz":[{"q":"Agricultor con miosis, sialorrea, broncorrea y bradicardia tras fumigar:","a":["Intoxicación por organofosforados: atropina","Intoxicación por opioides: naloxona","Golpe de calor","Intoxicación anticolinérgica"],"ok":0,"why":"La inhibición de la acetilcolinesterasa produce exceso muscarínico y nicotínico."}]}},"processes":[{"id":"ciclo","title":"Ciclo cardiaco","blurb":"Un latido en cámara lenta, fase por fase.","hue":"#e5484d","glyph":"heart","monitor":true,"vitals":{"hr":72},"base":{"only":["corazon","valvulas","cor-izq","cor-da","cor-cx","cor-der","venas-cardiacas","aorta","vcs","vci"],"focus":"corazon","zoom":7.3,"turn":-0.3},"steps":[{"title":"Llenado ventricular","phase":"llenado","chart":true,"slow":0.3,"text":"Las válvulas mitral y tricúspide están abiertas y la sangre cae de las aurículas a los ventrículos. \u003cb>Tres cuartas partes del llenado son pasivas\u003c/b>: ocurren antes de que la aurícula se contraiga. Fíjate en el plano de las válvulas: sube mientras los ventrículos se relajan.","facts":[["70–80 %","del llenado es pasivo"],["120 mL","volumen al final de la diástole"]],"scene":{"pins":[{"at":"@av","text":"Plano de las válvulas"}]}},{"title":"Sístole auricular","phase":"auricular","chart":true,"slow":0.3,"text":"La onda P dispara las aurículas, que empujan el último 20–30 %. Ese aporte se pierde en la fibrilación auricular. Si el ventrículo es rígido, ese golpe de sangre se oye como \u003cb>S4\u003c/b>. La pared del corazón está translúcida para que veas las válvulas abiertas.","facts":[["20–30 %","aporta la aurícula"],["Onda P","en el ECG"]],"scene":{"ghost":{"corazon":0.34},"pins":[{"at":"valvulas#mitral valve","text":"Mitral"},{"at":"valvulas#tricuspid valve","tex ","text":"Reciben la quinta parte del gasto cardiaco y filtran unos 125 mL de plasma por minuto: 180 litros al día, de los que se orina menos de 1 %.","facts":[["20–25 %","del gasto cardiaco"],["125 mL/min","filtrado glomerular"],["180 L al día","filtrado"]],"scene":{"fx":{"art-renales":{"streak":[200,0.7]},"ven-renales":{"streak":[-150,0.6]}},"pins":[{"at":"art-renales","text":"Arterias renales"}]}},{"title":"La nefrona, tramo por tramo","text":"\u003cb>Glomérulo:\u003c/b> filtra por presión. \u003cb>Túbulo proximal:\u003c/b> recupera dos tercios del sodio y el agua y toda la glucosa. \u003cb>Asa de Henle:\u003c/b> concentra la médula; ahí actúa la furosemida. \u003cb>Túbulo distal:\u003c/b> sitio de las tiazidas. \u003cb>Colector:\u003c/b> la aldosterona ahorra sodio y la ADH abre canales de agua.","facts":[["1 millón","de nefronas por riñón"],["180 mg/dL","umbral renal de la glucosa"]],"scene":{"focus":"rinon-izq","zoom":7.5,"select":"rinon-izq"}},{"title":"Uréteres","anim":"orina","text":"La orina baja por ondas peristálticas, no por gravedad. Hay tres sitios estrechos donde se atoran los cálculos: la unión con la pelvis renal, el cruce sobre los vasos ilíacos y la entrada a la vejiga, que es el más estrecho.","facts":[["25–30 cm","longitud"],["1–5 por minuto","ondas peristálticas"]],"scene":{"fx":{"ureteres":{"tint":["orina",0.4]}},"pins":[{"at":"ureteres@0.04/left ureter","text":"Unión pieloureteral"},{"at":"ureteres@0.62/left ureter","text":"Cruce ilíaco"},{"at":"ureteres@0.97/left ureter","text":"Entrada a la vejiga"}]}},{"title":"Vejiga y micción","text":"La vejiga se llena a baja presión hasta unos 400 mL. Para vaciarla, el parasimpático sacro contrae el detrusor y los esfínteres se relajan. El simpático hace lo contrario: guarda.","facts":[["400–500 mL","capacidad"],["S2–S4","reflejo de la micción"]],"scene":{"focus":"vejiga","zoom":6.8,"fx":{"vejiga":{"swell":4.5,"tint":["orina",0.35]}},"pins":[{"at":"vejiga","text":"Detrusor"}]}},{"title":"Quién regula","text":"Si baja la perfusión renal, la renina activa a la angiotensina II, que cierra la arteriola de salida, y a la aldosterona. Las prostaglandinas mantienen abierta la de entrada. Por eso un antiinflamatorio junto con un IECA y un diurético puede desplomar el filtrado.","facts":[["Renina","la libera el aparato yuxtaglomerular"],["Aldosterona","corteza suprarrenal"]],"scene":{"fx":{"suprarrenales":{"tint":["electrico",0.55]}},"pins":[{"at":"suprarrenales","text":"Aldosterona"}]}}]},{"id":"ciclo-menstrual","model":"mujer","title":"Ciclo menstrual","blurb":"Ovario, endometrio y hormonas en 28 días.","hue":"#d6409f","glyph":"flow","monitor":false,"base":{"only":["utero","ovarios","trompas","vagina","vejiga","recto","pelvis","sacro","vasos-gonadales","art-iliacas","ven-iliacas"],"ghost":{"pelvis":0.18,"sacro":0.18,"vejiga":0.5,"recto":0.5},"focus":"utero","zoom":9,"turn":-0.35,"pitch":0.3},"steps":[{"title":"Menstruación (días 1–5)","text":"Al caer la progesterona, la capa funcional del endometrio se descama y sangra. Al mismo tiempo sube la \u003cb>FSH\u003c/b> y recluta una cohorte de folículos en los ovarios.","facts":[["28 ± 7 días","duración normal del ciclo"],["2–7 días","sangrado normal"]],"scene":{"fx":{"utero":{"tint":["sangre",0.42]},"vagina":{"tint":["sangre",0.3]}},"pins":[{"at":"utero#body of uterus","text":"Endometrio que se descama"}]}},{"title":"Fase folicular (días 6–13)","text":"Un folículo se vuelve dominante y fabrica \u003cb>estradiol\u003c/b>. El estrógeno hace crecer el endometrio (fase proliferativa) y vuelve el moco cervical claro y elástico, fácil de atravesar.","facts":[["Estradiol","lo produce el folículo dominante"],["Proliferativo","endometrio en esta fase"]],"scene":{"fx":{"ovarios":{"spot":["ovarios#right ovary",11,"alimento",0.95]},"utero":{"swell":1.2}},"pins":[{"at":"ovarios#right ovary","text":"Folículo dominante"}]}},{"title":"Ovulación (día 14)","text":"El estradiol alto dispara el \u003cb>pico de LH\u003c/b>; 24 a 36 horas después el folículo se rompe. Las fimbrias barren el ovocito hacia la trompa, y la fecundación ocurre en la \u003cb>ampolla\u003c/b>.","facts":[["Pico de LH","24–36 h antes"],["Ampolla","sitio de la fecundación"]],"scene":{"fx":{"ovarios":{"spot":["ovarios#right ovary",14,"electrico",1]},"trompas":{"tint":["electrico",0.12]}},"pins":[{"at":"ovarios#right ovary","text":"Ovocito liberado","side":"left"},{"at":"trompas#left uterine tube","text":"Ampolla de la trompa"}]}},{"title":"Fase lútea (días 15–28)","text":"Lo que queda del folículo se vuelve \u003cb>cuerpo lúteo\u003c/b> y produce progesterona: el endometrio se vuelve secretor, listo para recibir un embrión, y la temperatura basal sube medio grado.","facts":[["14 días","fase lútea casi fija"],["Progesterona","endometrio secretor"]],"scene":{"fx":{"ovarios":{"spot":["ovarios#right ovary",12,"calculo",0.95]},"utero":{"swell":2,"tint":["inflamado",0.12]}},"pins":[{"at":"ovarios#right ovary","text":"Cuerpo lúteo"}]}},{"title":"Si hay embarazo","text":"El blastocisto se implanta 6 a 7 días después de la fecundación, casi siempre en el fondo uterino. La \u003cb>hCG\u003c/b> del trofoblasto mantiene vivo al cuerpo lúteo hasta que la placenta toma el relevo, hacia las 10 semanas.","facts":[["Día 6–7","implantación"],["hCG","se duplica cada 48 h al inicio"]],"scene":{"fx":{"utero":{"swell":2,"spot":["utero#body of uterus",12,"alimento",0.8]}},"pins":[{"at":"utero#body of uterus","text":"Implantación"}]}},{"title":"Para el examen","text":"Sin ovulación no hay cuerpo lúteo ni progesterona: el estrógeno sin oposición engruesa el endometrio y sangra de forma irregular (síndrome de ovario poliquístico). Los anticonceptivos combinados evitan el pico de LH. El sangrado uterino anormal se clasifica con PALM-COEIN.","facts":[["PALM-COEIN","causas de sangrado anormal"],["Sin progesterona","riesgo de hiperplasia endometrial"]]}]}],"cases":[{"id":"iam","title":"Dolor torácico opresivo","area":"Cardiología","hue":"#e5484d","glyph":"heart","level":2,"organs":["coronarias","corazon"],"patient":"Hombre de 58 años · diabético, hipertenso y fumador","base":{"only":["corazon","cor-izq","cor-da","cor-cx","cor-der","venas-cardiacas","aorta","vcs","vci"],"focus":"corazon","zoom":7.1,"turn":-0.6},"intro":{"text":"Llega a urgencias con dolor retroesternal opresivo de 40 minutos, irradiado a la mandíbula, con sudoración fría y náusea. El electrocardiograma muestra elevación del ST en DII, DIII y aVF.","exam":["Pálido y diaforético","Ruidos cardiacos rítmicos, sin soplos","Campos pulmonares limpios"],"vitals":{"hr":54,"sys":98,"dia":60,"rr":20,"spo2":95,"st":0.34}},"nodes":[{"q":"¿Qué arteria está ocluida con mayor probabilidad?","options":["Coronaria derecha","Descendente anterior","Circunfleja","Tronco coronario izquierdo"],"ok":0,"why":"La cara inferior depende de la coronaria derecha en más de 80 % de las personas. Esa arteria también irriga los nodos sinusal y AV: por eso está bradicárdico."},{"title":"Qué está pasando","text":"Una placa de ateroma se rompió dentro de la coronaria derecha y sobre ella se formó un trombo que \u003cb>tapó la arteria\u003c/b>. Más allá del trombo ya no hay flujo: la pared inferior del ventrículo deja de contraerse en segundos y empieza a morir en unos 20 minutos. La mancha oscura es el músculo en isquemia.","facts":[["20 min","empieza la necrosis"],["Tiempo = músculo","cada minuto cuenta"]],"scene":{"fx":{"cor-der":{"cut":"cor-der@0.45/trunk of right coronary artery"},"corazon":{"spot":["@inferior",54,"isquemia",0.9]}},"pins":[{"at":"cor-der@0.45/trunk of right coronary artery","text":"Trombo","tone":"bad"},{"at":"@inferior","text":"Músculo en isquemia","side":"left"}],"contract":0.75}},{"q":"El hospital tiene sala de hemodinamia disponible. ¿Cómo lo reperfundes?","options":["Fibrinólisis inmediata aunque la sala esté libre","Intervención coronaria percutánea primaria, con meta puerta-balón de 90 minutos o menos","Esperar las troponinas para confirmar","Prueba de esfuerzo cuando ceda el dolor"],"ok":1,"why":"Con elevación del ST el diagnóstico es electrocardiográfico: no se esperan biomarcadores. La angioplastia primaria es la mejor reperfusión si puede hacerse a tiempo; la fibrinólisis queda para cuando no se alcanza en 120 minutos."},{"q":"Tiene presión de 98/60, ingurgitación yugular y pulmones limpios. Antes de dar nitroglicerina, ¿qué haces?","options":["Nitroglicerina sublingual: es parte del manejo habitual","Furosemida, por la ingurgitación yugular","Tomo derivaciones derechas (V4R): si hay infarto del ventrículo derecho evito los nitratos y doy líquidos","Morfina y betabloqueador intravenoso"],"ok":2,"why":"El infarto inferior alcanza al ventrículo derecho en un tercio de los casos. Ese ventrículo depende de la precarga: los nitratos, los diuréticos y la morfina pueden hundir la presión."},{"title":"Reperfusión","text":"El balón abre la arteria y se coloca un stent. La sangre vuelve a pasar, el ST baja y el dolor cede. El músculo que estaba aturdido pero vivo recupera su movimiento en días.","facts":[["Aspirina + inhibidor P2Y12","doble antiagregación"],["Estatina de alta intensidad","desde el ingreso"]],"scene":{"fx":{"corazon":{"spot":["@inferior",24,"isquemia",0.3]}},"pins":[{"at":"cor-der@0.45/trunk of right coronary artery","text":"Stent","tone":"good"}]},"vitals":{"hr":70,"sys":116,"dia":72,"st":0.03,"spo2":97}}],"pearls":["DII, DIII y aVF: coronaria derecha. V1–V4: descendente anterior. DI, aVL, V5–V6: circunfleja.","Con elevación del ST se reperfunde sin esperar troponinas.","Infarto inferior con hipotensión y pulmones limpios: piensa en el ventrículo derecho y evita los nitratos."]},{"id":"neumotorax","title":"Motociclista que no puede respirar","area":"Urgencias","hue":"#22a8c9","glyph":"body","level":1,"organs":["pulmon-izq","pulmon-der","costillas"],"patient":"Hombre de 24 años · accidente en motocicleta","base":{"only":["pulmon-der-sup","pulmon-der-med","pulmon-der-inf","pulmon-izq-sup","pulmon-izq-inf","traquea","corazon","aorta","vcs","vci","diafragma","costillas","cartilagos","esternon"],"ghost":{"costillas":0.2,"cartilagos":0.2,"esternon":0.2},"focus":[0,0,1265],"zoom":4.2,"turn":-0.1},"intro":{"text":"Lo trae la ambulancia con dificultad respiratoria intensa y dolor en el lado derecho del tórax. Está agitado y cada vez respira peor.","exam":["Ingurgitación yugular","Tráquea desviada hacia la izquierda","Hemitórax derecho hiperresonante y sin ruidos respiratorios"],"vitals":{"hr":132,"sys":82,"dia":50,"rr":34,"spo2":84,"depth":0.6,"perf":0.6},"scene":{"lungs":{"der":0.5}}},"nodes":[{"q":"¿Cuál es el diagnóstico?","options":["Taponamiento cardiaco","Hemotórax masivo derecho","Neumotórax a tensión derecho","Tórax inestable"],"ok":2,"why":"Hiperresonancia sin ruidos respiratorios, tráquea desviada al lado contrario e ingurgitación yugular. El hemotórax es mate a la percusión; en el taponamiento los ruidos respiratorios se conservan."},{"title":"Qué está pasando","text":"La pleura rota funciona como una válvula: en cada inspiración entra aire al espacio pleural y no puede salir. La presión \u003cb>colapsa el pulmón derecho\u003c/b> y empuja el corazón y la tráquea hacia la izquierda. Las venas cavas se acodan, la sangre no regresa al corazón y la presión se desploma: es un choque obstructivo.","facts":[["Choque obstructivo","no llega sangre al corazón"],["Clínico","el diagnóstico no espera imagen"]],"scene":{"lungs":{"der":0.92},"fx":{"corazon":{"push":[24,0,0]},"aorta":{"push":[24,0,0]},"vcs":{"push":[24,0,0]},"vci":{"push":[24,0,0]},"traquea":{"push":[15,0,0]}},"pins":[{"at":"pulmon-der-med","text":"Pulmón colapsado","tone":"bad","side":"left"},{"at":"traquea","text":"Tráquea desviada"},{"at":"vci@0.08","text":"Cava acodada"}]},"vitals":{"hr":142,"sys":70,"dia":44,"spo2":80,"perf":0.45}},{"q":"¿Qué sigue?","options":["Radiografía portátil de tórax para confirmar","Descompresión inmediata, sin esperar estudios","Tomografía de tórax","Intubación y ventilación con presión posit 03c/b>.","facts":[["≥ 5 cm","la masa que más se tuerce"],["Venas primero","luego la arteria"]],"scene":{"fx":{"ovarios":{"spot":["ovarios#left ovary",20,"isquemia",0.9]},"ven-gonadales":{"spot":["ovarios#left ovary",34,"isquemia",0.7]},"vasos-gonadales":{"spot":["ovarios#left ovary",26,"isquemia",0.5]}},"pins":[{"at":"ovarios#left ovary","text":"Ovario congestivo","tone":"bad"},{"at":"ven-gonadales#left ovarian vein","text":"Pedículo torcido","side":"left"}]}},{"q":"El Doppler muestra flujo arterial en el ovario. ¿Qué concluyes?","options":["Se descarta la torsión","La sospecha sigue: el flujo puede persistir por la doble irrigación; la decisión es clínica","Hay que esperar 24 horas y repetir el estudio","Es una apendicitis"],"ok":1,"why":"El ovario recibe sangre de la arteria ovárica y de la rama ovárica de la uterina, y la torsión puede ser parcial o intermitente. Un Doppler normal no descarta la torsión."},{"q":"¿Cuál es el tratamiento?","options":["Ooforectomía en todos los casos","Laparoscopia urgente para destorcer el anexo y conservar el ovario","Analgésico y observación","Antibióticos intravenosos"],"ok":1,"why":"Se destuerce y se conserva el ovario aunque se vea oscuro: la mayoría recupera su función. El quiste se trata en el mismo acto o después, según su tipo.","after":{"scene":{"fx":{"ovarios":{"spot":["ovarios#left ovary",20,"sano",0.35]}},"pins":[{"at":"ovarios#left ovary","text":"Ovario destorcido","tone":"good"}]},"vitals":{"hr":84,"sys":118,"dia":74}}}],"pearls":["Dolor súbito, náusea y masa anexial: torsión hasta demostrar lo contrario.","Un Doppler normal no descarta la torsión.","Destorcer y conservar el ovario, sobre todo en mujeres jóvenes."]}],"rhythms":[{"id":"sinusal","name":"Ritmo sinusal","rate":"72 lpm","text":"Onda P antes de cada QRS, PR de 120 a 200 ms, QRS menor de 120 ms, frecuencia de 60 a 100."},{"id":"taqui","name":"Taquicardia sinusal","rate":"125 lpm","text":"Sinusal a más de 100. Se trata la causa: fiebre, dolor, hipovolemia, a       gl.uniform1f(u.uTime, time);
      gl.uniform4f(u.uHA, heart.base[0], heart.base[1], heart.base[2], heart.length);
      gl.uniform4fv(u.uBeats, beats.age);
      gl.uniform4fv(u.uBeatQ, beats.q);
      // Nerves and the fine vessel networks cast hairline shadows that cost a full draw each: skip them.
      for (const s of solid) if (!THIN.test(s.id) && s.kind !== "nerve") drawStructure(u, s, true);
      for (const part of stand) if (part.name !== "floor") drawStand(u, part, true, time);
      gl.disable(gl.POLYGON_OFFSET_FILL);
      gl.colorMask(true, true, true, true);
    }

    gl.viewport(0, 0, T.w, T.h);
    // 2. Depth of the selected structure, for the cutaway.
    const sel = look.selected && S[look.selected];
    const cutting = ready && sel && look.lens > 0.01 && sel.alpha > 0.5 && sel.id !== "piel";
    const u = P.main.u;
    gl.useProgram(P.main.program);
    setCommon(u, time);
    setLights(u);
    gl.uniform2f(u.uPx, 1 / T.w, 1 / T.h);
    gl.uniform1i(u.uSelTex, 2);
    gl.uniform1i(u.uShadow, 3);
    gl.uniform1f(u.uShadowOn, quality.shadows ? 1 : 0);
    gl.uniform1f(u.uPre, 0);
    gl.uniform1f(u.uBlend, 0);
    gl.uniform4f(u.uLens, 0, 0, 0, 0);
    gl.uniform4f(u.uGlass, 0, 0, 1, 0);
    gl.uniform4f(u.uTheme, look.dark ? 1 : 0, 1, 0, 0);
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, T.shadowTex);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, null);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
    gl.disable(gl.CULL_FACE);
    if (cutting) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, T.selFbo);
      gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.uniform1f(u.uPre, 1);
      drawStructure(u, sel, false);
      gl.uniform1f(u.uPre, 0);
    }

    // 3. Backdrop, then the opaque world into HDR colour + info.
    gl.bindFramebuffer(gl.FRAMEBUFFER, T.fbo);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
    gl.clearBufferfv(gl.COLOR, 1, [0, 0, 0, 0]);
    gl.clearDepth(1);
    gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.disable(gl.DEPTH_TEST);
    gl.useProgram(P.bg.program);
    gl.uniformMatrix4fv(P.bg.u.uInvViewProj, false, cam.inv);
    gl.uniform3fv(P.bg.u.uEye, cam.eye);
    gl.uniform3fv(P.bg.u.uBgA, studio.bgA);
    gl.uniform3fv(P.bg.u.uBgB, studio.bgB);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.NONE]);
    fullscreen();
    gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
    gl.enable(gl.DEPTH_TEST);
    gl.useProgram(P.main.program);
    for (const part of stand) drawStand(u, part, false, time);
    gl.uniform4f(u.uTheme, look.dark ? 1 : 0, 1, 0, 0);
    if (cutting) {
      gl.activeTexture(gl.TEXTURE2);
      gl.bindTexture(gl.TEXTURE_2D, T.sel);
      gl.uniform4f(u.uLens, look.lens, 14 * view.ratio, 0, 0);
    }
    drawn = 0;
    for (const s of solid) { drawStructure(u, s, false); drawn++; }

    // 4. Ambient occlusion from the opaque depth.
    if (quality.ssao) {
      gl.disable(gl.DEPTH_TEST);
      gl.bindFramebuffer(gl.FRAMEBUFFER, T.aoFbo0);
      gl.viewport(0, 0, T.aw, T.ah);
      gl.useProgram(P.ssao.program);
      const a = P.ssao.u;
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T.depth);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, T.info);
      gl.uniform1i(a.uDepth, 0); gl.uniform1i(a.uInfo, 1);
      gl.uniformMatrix4fv(a.uProj, false, cam.proj);
      gl.uniformMatrix4fv(a.uInvProj, false, cam.invProj);
      gl.uniformMatrix4fv(a.uView, false, cam.view);
      gl.uniform1f(a.uRadius, 26 + cam.dist * 0.012);
      fullscreen();
      gl.useProgram(P.blur.program);
      gl.uniform1i(P.blur.u.uTex, 0);
      gl.bindFramebuffer(gl.FRAMEBUFFER, T.aoFbo1);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T.ao0);
      gl.uniform2f(P.blur.u.uDir, 1 / T.aw, 0);
      fullscreen();
      gl.bindFramebuffer(gl.FRAMEBUFFER, T.aoFbo0);
      gl.bindTexture(gl.TEXTURE_2D, T.ao1);
      gl.uniform2f(P.blur.u.uDir, 0, 1 / T.ah);
      fullscreen();
      gl.viewport(0, 0, T.w, T.h);
      gl.enable(gl.DEPTH_TEST);
    }

    // 5. Translucent structures and the glass skin, nearest surface only.
    gl.bindFramebuffer(gl.FRAMEBUFFER, T.fbo);
    gl.useProgram(P.main.program);
    const blendPass = (list, glassOn) => {
      if (!list.length) return;
      gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.NONE]);
      gl.uniform1f(u.uBlend, 1);
      gl.uniform4f(u.uGlass, look.dark ? 0.03 : 0.02, look.dark ? 0.55 : 0.38, 2.4, glassOn ? 1 : 0);
      if (glassOn) { gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK); }
      gl.colorMask(false, false, false, false);
      for (const s of list) drawStructure(u, s, false);
      gl.colorMask(true, true, true, true);
      gl.depthMask(false);
      gl.depthFunc(gl.EQUAL);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      for (const s of list) drawStructure(u, s, false);
      gl.disable(gl.BLEND);
      gl.disable(gl.CULL_FACE);
      gl.depthFunc(gl.LEQUAL);
      gl.depthMask(true);
      gl.uniform1f(u.uBlend, 0);
      gl.uniform4f(u.uGlass, 0, 0, 1, 0);
      gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
    };
    blendPass(soft, false);
    drawn += soft.length;
    if (ready && skin && skin.alpha > 0.004 && glass) {
      gl.uniform4f(u.uLens, 0, 0, 0, 0);
      blendPass([skin], true);
    }
    gl.disable(gl.DEPTH_TEST);

    // 6. Bloom.
    if (quality.bloom) {
      gl.useProgram(P.down.program);
      gl.uniform1i(P.down.u.uTex, 0);
      gl.activeTexture(gl.TEXTURE0);
      let src = T.hdr, sw = T.w, sh = T.h;
      T.bloom.forEach((b, i) => {
        gl.bindFramebuffer(gl.FRAMEBUFFER, b.fbo);
        gl.viewport(0, 0, b.w, b.h);
        gl.bindTexture(gl.TEXTURE_2D, src);
        gl.uniform2f(P.down.u.uPx, 1 / sw, 1 / sh);
        gl.uniform1f(P.down.u.uFirst, i === 0 ? 1 : 0);
        fullscreen();
        src = b.tex; sw = b.w; sh = b.h;
      });
      gl.useProgram(P.up.program);
      gl.uniform1i(P.up.u.uTex, 0);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE);
      for (let i = T.bloom.length - 1; i > 0; i--) {
        const from = T.bloom[i], to = T.bloom[i - 1];
        gl.bindFramebuffer(gl.FRAMEBUFFER, to.fbo);
        gl.viewport(0, 0, to.w, to.h);
        gl.bindTexture(gl.TEXTURE_2D, from.tex);
        gl.uniform2f(P.up.u.uPx, 1 / from.w, 1 / from.h);
        fullscreen();
      }
      gl.disable(gl.BLEND);
    }

    // 7. Tone map and grade into LDR, then FXAA to the canvas.
    gl.bindFramebuffer(gl.FRAMEBUFFER, T.ldrFbo);
    gl.viewport(0, 0, T.w, T.h);
    gl.useProgram(P.compose.program);
    const c = P.compose.u;
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T.hdr);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, T.ao0);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, T.bloom[0].tex);
    gl.uniform1i(c.uHdr, 0); gl.uniform1i(c.uAO, 1); gl.uniform1i(c.uBloom, 2);
    gl.uniform1f(c.uAOOn, quality.ssao ? 1 : 0);
    gl.uniform1f(c.uBloomOn, quality.bloom ? 1 : 0);
    gl.uniform1f(c.uExposure, studio.exposure);
    gl.uniform1f(c.uDark, look.dark ? 1 : 0);
    fullscreen();
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(P.fxaa.program);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T.ldr);
    gl.uniform1i(P.fxaa.u.uTex, 0);
    gl.uniform2f(P.fxaa.u.uPx, 1 / T.w, 1 / T.h);
    fullscreen();
    gl.bindVertexArray(null);
    adapt(performance.now() - t0, dt);
  }

  // Resolution follows the frame time, so a busy phone stays smooth.
  let slowFrames = 0, fastFrames = 0;
  function adapt(cpuMs, dt) {
    quality.frameMs += (dt * 1000 - quality.frameMs) * 0.05;
    if (quality.frameMs > 26) { slowFrames++; fastFrames = 0; } else if (quality.frameMs < 15) { fastFrames++; slowFrames = 0; } else { slowFrames = fastFrames = 0; }
    // Too slow: fewer pixels first, then the occlusion pass, then the shadow pass (a whole extra
    // draw of the body), then fewer pixels again. Fast again: undo in the opposite order.
    if (slowFrames > 90) {
      slowFrames = 0;
      if (quality.scale > 0.75) quality.scale = Math.max(0.75, quality.scale - 0.1);
      else if (quality.ssao) quality.ssao = false;
      else if (quality.shadows) quality.shadows = false;
      else if (quality.scale > 0.6) quality.scale = Math.max(0.6, quality.scale - 0.05);
    }
    if (fastFrames > 240) {
      fastFrames = 0;
      if (quality.scale < 0.75) quality.scale = 0.75;
      else if (!quality.shadows) quality.shadows = true;
      else if (!quality.ssao) quality.ssao = true;
      else if (quality.scale < 1) quality.scale = Math.min(1, quality.scale + 0.1);
    }
  }

  /** The structure under a point in CSS pixels: the commonest id in a small disc around it. */
  function pick(x, y, reach = 7) {
    if (!ready || !T.fbo) return null;
    const r = Math.max(1, Math.round(reach * view.ratio));
    const cx = Math.round(x * view.ratio), cy = Math.round((view.height - y) * view.ratio);
    const x0 = Math.max(0, cx - r), y0 = Math.max(0, cy - r);
    const w = Math.min(T.w - x0, 2 * r + 1), h = Math.min(T.h - y0, 2 * r + 1);
    if (w <= 0 || h <= 0) return null;
    const px = new Uint8Array(w * h * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, T.fbo);
    gl.readBuffer(gl.COLOR_ATTACHMENT1);
    gl.readPixels(x0, y0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const votes = new Map();
    let best = null;
    for (let j = 0; j < h; j++) {
      for (let i = 0; i < w; i++) {
        const id = px[(j * w + i) * 4 + 2];
        if (!id || id >= 254) continue;
        const d2 = (i + x0 - cx) ** 2 + (j + y0 - cy) ** 2;
        if (d2 > r * r) continue;
        const key = id * 256 + px[(j * w + i) * 4 + 3];
        const score = (votes.get(key) || 0) + 1 / (1 + d2 / (r * r * 0.25));
        votes.set(key, score);
        if (!best || score > best.score) best = { key, score };
      }
    }
    if (!best) return null;
    const s = LIST[(best.key >> 8) - 1];
    return s ? { id: s.id, part: best.key & 255 } : null;
  }

  /** The middle of a structure's cross-section at a fraction of its flow range (0 = where flow enters). */
  function along(id, fraction, part = -1) {
    const s = S[id];
    if (!cpu || !s) return s ? s.meta.c : [0, 0, 1000];
    const [lo, hi] = part >= 0 ? s.meta.parts[part].flow : s.meta.flow;
    const want = (lo + (hi - lo) * fraction) * 8;
    let reach = Math.max(24, (hi - lo) * 8 * 0.02);
    for (let attempt = 0; attempt < 6; attempt++, reach *= 2.2) {
      let n = 0, x = 0, y = 0, z = 0;
      for (let i = 0; i < s.meta.v[2]; i++) {
        const at = (s.vBase + i) * 16;
        if (Math.abs(cpu.getUint16(at + 6, true) - want) > reach || (part >= 0 && cpu.getUint8(at + 11) !== part)) continue;
        x += cpu.getUint16(at, true); y += cpu.getUint16(at + 2, true); z += cpu.getUint16(at + 4, true);
        n++;
      }
      if (n > 2) return [M.lo[0] + (x / n / 65535) * M.size[0], M.lo[1] + (y / n / 65535) * M.size[1], M.lo[2] + (z / n / 65535) * M.size[2]];
    }
    return s.meta.c;
  }

  /** Run the easing to rest at once (tests and reduced motion). */
  function settle() { for (let i = 0; i < 80; i++) { place(0.05); ease(0.05); } }

  return {
    S, LIST, view, look, heart, beats, quality, init, load, render, pick, toScreen, along, settle, setStudio, rot,
    get ready() { return ready; }, get failed() { return failed; }, get drawn() { return drawn; }, get gl() { return gl; }, get cam() { return cam; },
  };
})();

// ── Physio: one model drives the trace, the numbers and the motion of the body ──
// The ECG is a train of events (P, QRS, T…) scheduled by the rhythm; the heart's mechanics,
// the pulse wave and the pleth follow each QRS; breathing has its own rate, depth and pattern.
const Physio = (() => {
  const g = (x, mu, s) => Math.exp(-((x - mu) * (x - mu)) / (2 * s * s));
  const bump = (t, dur) => (t < 0 || t > dur ? 0 : Math.pow(Math.sin((Math.PI * t) / dur), 2));
  const TPL = {
    P: (t) => 0.13 * g(t, 0.05, 0.022),
    N: (t) => -0.1 * g(t, -0.02, 0.007) + 1.0 * g(t, 0, 0.01) - 0.24 * g(t, 0.022, 0.008),
    T: (t) => 0.3 * g(t, 0, 0.055),
    W: (t) => 0.95 * g(t, 0, 0.032) - 0.55 * g(t, 0.07, 0.03),
    U: (t) => -0.32 * g(t, 0, 0.07),
    // ST segment lifted off the baseline, merging into the T wave.
    S: (t) => smooth(0.025, 0.07, t) * (1 - smooth(0.2, 0.34, t)),
  };

  const NORMAL = { rhythm: "sinusal", hr: 72, rr: 14, spo2: 98, sys: 118, dia: 76, temp: 36.6, st: 0, depth: 1, pattern: "normal", perf: 1 };
  const now = { ...NORMAL };
  const to = { ...NORMAL };
  const ecg = { events: [], next: 0, nextP: 0, nextV: 0, seed: 7 };
  let clock = 0;
  let breathPhase = 0;
  let breath = 0;
  const rnd = () => ((ecg.seed = (ecg.seed * 16807) % 2147483647) / 2147483647);

  function sinus(t, hr, p = true) {
    const rr = 60 / hr;
    if (p) ecg.events.push({ t, k: "P" });
    ecg.events.push({ t: t + 0.16, k: "N", q: 1 });
    if (now.st > 0.01) ecg.events.push({ t: t + 0.16, k: "S", amp: now.st });
    ecg.events.push({ t: t + 0.16 + 0.27 * Math.sqrt(Math.min(rr, 1.2)), k: "T", amp: 1 + now.st * 1.4 });
    return rr;
  }
  function schedule(until) {
    const r = now.rhythm;
    if (r === "bav3") {
      while (ecg.nextP < until) { ecg.events.push({ t: ecg.nextP, k: "P" }); ecg.nextP += 0.75; }
      while (ecg.nextV < until) { ecg.events.push({ t: ecg.nextV, k: "W", q: 1 }, { t: ecg.nextV + 0.36, k: "U" }); ecg.nextV += 60 / clamp(now.hr, 25, 50); }
      return;
    }
    while (ecg.next < until) {
      const t = ecg.next;
      const hr = clamp(now.hr, 20, 240);
      if (r === "sinusal") ecg.next += sinus(t, hr);
      else if (r === "tsv") ecg.next += sinus(t, clamp(hr, 150, 240), false);
      else if (r === "fa") {
        const rr = (60 / hr) * (0.62 + rnd() * 0.76);
        ecg.events.push({ t, k: "N", q: clamp(0.45 + rr * 0.9, 0.4, 1) }, { t: t + 0.26, k: "T" });
        ecg.next += rr;
      } else if (r === "flutter") { ecg.events.push({ t, k: "N", q: 1 }, { t: t + 0.23, k: "T" }); ecg.next += 0.4; }
      else if (r === "tv") { ecg.events.push({ t, k: "W", q: 0.5 }, { t: t + 0.17, k: "U" }); ecg.next += 60 / clamp(hr, 140, 240); }
      else ecg.next += 0.5;
    }
  }
  function baseline(t) {
    const r = now.rhythm;
    if (r === "fa") return 0.035 * Math.sin(2 * Math.PI * 5.7 * t) + 0.025 * Math.sin(2 * Math.PI * 8.3 * t + 1.3) + 0.018 * Math.sin(2 * Math.PI * 11.1 * t + 0.4);
    if (r === "flutter") { const f = (t * 5) % 1; return -0.17 * (f < 0.78 ? f / 0.78 : 1 - (f - 0.78) / 0.22) + 0.085; }
    if (r === "fv") return 0.42 * Math.sin(2 * Math.PI * 5.1 * t + 0.9 * Math.sin(0.7 * t)) * (0.6 + 0.4 * Math.sin(2 * Math.PI * 0.43 * t)) + 0.2 * Math.sin(2 * Math.PI * 7.3 * t + 2 * Math.sin(1.1 * t));
    if (r === "asistolia") return 0.01 * Math.sin(2 * Math.PI * 0.4 * t);
    return 0.006 * Math.sin(2 * Math.PI * 0.3 * t);
  }
  function ecgAt(t) {
    let v = baseline(t);
    for (const e of ecg.events) {
      const d = t - e.t;
      if (d > -0.15 && d < 0.4) v += TPL[e.k](d) * (e.amp ?? 1);
    }
    return v;
  }
  function mechanics(t) {
    let sys = 0, atr = 0, pleth = 0;
    for (const e of ecg.events) {
      const d = t - e.t;
      if (d < -0.1 || d > 1.6) continue;
      if (e.k === "P") atr += bump(d - 0.06, 0.12);
      else if (e.q) {
        sys = Math.max(sys, bump(d - 0.03, now.rhythm === "tv" ? 0.24 : 0.34) * e.q);
        const pd = d - 0.22;
        if (pd > 0) pleth += e.q * ((pd / 0.11) * Math.exp(1 - pd / 0.11) + 0.16 * g(pd, 0.36, 0.04));
      }
    }
    if (now.rhythm === "fv") sys = 0;
    return { sys, atr: Math.min(1, atr), pleth: Math.min(1.3, pleth) * now.perf };
  }
  const pulseless = () => now.rhythm === "fv" || now.rhythm === "asistolia";

  /** Seconds since each of the last four beats reached the aortic root, and their strength. */
  function beats(t, age, q) {
    let n = 0;
    for (let i = ecg.events.length - 1; i >= 0 && n < 4; i--) {
      const e = ecg.events[i];
      if (!e.q || e.t + 0.06 > t) continue;
      age[n] = t - e.t - 0.06;
      q[n] = e.q * now.perf;
      n++;
    }
    for (; n < 4; n++) { age[n] = 99; q[n] = 0; }
  }
  function measuredRate(t) {
    const qs = ecg.events.filter((e) => e.q && e.t <= t).slice(-4);
    if (pulseless() || qs.length < 2) return null;
    return Math.round((60 * (qs.length - 1)) / (qs[qs.length - 1].t - qs[0].t));
  }

  /** Where the current beat is: seconds since its P wave began, the beat's start time and length. */
  function cycle(t) {
    let start = null, next = null;
    for (let i = ecg.events.length - 1; i >= 0; i--) {
      const e = ecg.events[i];
      if (!e.q) continue;
      if (e.t - 0.16 <= t) { start = e.t - 0.16; break; }
      next = e.t - 0.16;
    }
    if (start === null) return { pos: 0, start: t, rr: 60 / Math.max(30, now.hr) };
    return { pos: t - start, start, rr: next !== null ? next - start : 60 / Math.max(30, now.hr) };
  }

  const BREATH = {
    normal: (ph) => (ph < 0.4 ? smooth(0, 0.4, ph) : 1 - smooth(0.4, 1, ph)),
    // Obstructed airway: a quick breath in and a long way out.
    obstructivo: (ph) => (ph < 0.26 ? smooth(0, 0.26, ph) : 1 - smooth(0.26, 1, ph) ** 0.8),
    kussmaul: (ph) => (ph < 0.46 ? smooth(0, 0.46, ph) : 1 - smooth(0.46, 0.96, ph)),
  };

  function set(values, { instant = false } = {}) {
    const changed = values.rhythm && values.rhythm !== now.rhythm;
    Object.assign(to, values);
    if (values.rhythm) now.rhythm = values.rhythm;
    if (values.pattern) now.pattern = values.pattern;
    if (instant) for (const key of Object.keys(to)) now[key] = to[key];
    if (changed) {
      ecg.events = ecg.events.filter((e) => e.t < clock);
      const lastQ = ecg.events.filter((e) => e.q).reduce((m, e) => Math.max(m, e.t), -9);
      ecg.next = ecg.nextP = ecg.nextV = Math.max(clock + 0.05, lastQ + 0.4);
    }
    bus.emit("vitals");
  }
  const reset = (options) => set({ ...NORMAL }, options);

  function tick(dt) {
    clock += dt;
    const k = 1 - Math.exp(-dt / 1.1);
    for (const key of ["hr", "rr", "spo2", "sys", "dia", "temp", "st", "depth", "perf"]) now[key] += (to[key] - now[key]) * k;
    schedule(clock + 2);
    if (ecg.events.length > 500) ecg.events = ecg.events.filter((e) => e.t > clock - 6);
    const arrest = pulseless();
    const rate = arrest ? 0 : now.rr;
    breathPhase = (breathPhase + (dt * rate) / 60) % 1;
    const shape = (BREATH[now.pattern] || BREATH.normal)(breathPhase);
    const target = arrest ? 0 : shape * now.depth;
    breath += (target - breath) * (1 - Math.exp(-dt / 0.08));
    return clock;
  }

  return {
    now, to, NORMAL, set, reset, tick, ecgAt, mechanics, beats, measuredRate, pulseless, cycle, speed: 1,
    get clock() { return clock; },
    get breath() { return breath; },
  };
})();

// ── Monitor: the bedside strip (ECG and pleth drawn by a shader) and its numbers ──
const Monitor = (() => {
  const N = 512;
  const SWEEP = 4;
  const ecgBuf = new Float32Array(N).fill(0.316);
  const plBuf = new Float32Array(N).fill(0);
  const bytes = new Uint8Array(N * 4);
  let root, canvas, gl = null, prog = null, tex = null, ctx2d = null;
  const uni = {};
  let lastIdx = -1, shown = false, vitalsAt = 0, soundOn = false, audio = null, lastBeat = -1;
  const el = {};

  const FRAG = `precision highp float;
uniform sampler2D uTex;uniform vec2 uRes;uniform float uHead;uniform float uDpr;uniform vec3 uTrace;
const float N=${N}.0;
vec2 sampleAt(float i){vec4 c=texture2D(uTex,vec2((mod(i,N)+.5)/N,.5));return vec2((c.r*65280.+c.g*255.)/65535.,c.b);}
float seg(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/max(dot(ba,ba),1e-4),0.,1.);return length(pa-ba*h);}
void main(){
  vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y);
  float u=p.x/uRes.x;
  float fi=u*N;
  float y0=uRes.y*.20,y1=uRes.y*.70,q0=uRes.y*.76,q1=uRes.y*.95;
  float dE=1e4,dP=1e4;
  for(int k=-3;k<=3;k++){
    float i=floor(fi)+float(k);
    vec2 s0=sampleAt(i),s1=sampleAt(i+1.);
    vec2 a=vec2(i/N*uRes.x,mix(y1,y0,s0.x)),b=vec2((i+1.)/N*uRes.x,mix(y1,y0,s1.x));
    dE=min(dE,seg(p,a,b));
    vec2 c=vec2(i/N*uRes.x,mix(q1,q0,s0.y)),d=vec2((i+1.)/N*uRes.x,mix(q1,q0,s1.y));
    dP=min(dP,seg(p,c,d));
  }
  float age=fract(uHead-u);
  float alive=1.-smoothstep(.955,.985,age);
  float persist=mix(1.,.42,smoothstep(0.,.9,age))*alive;
  float w=.85*uDpr;
  float eC=exp(-(dE*dE)/(w*w))+.42*exp(-dE/(3.2*uDpr));
  float pC=exp(-(dP*dP)/(w*w*.8))+.3*exp(-dP/(3.*uDpr));
  vec3 bg=vec3(.027,.066,.047);
  float gx=abs(fract(u*20.)-.5)*uRes.x/20.;
  float gy=abs(fract(p.y/(uRes.y/5.))-.5)*uRes.y/5.;
  float grid=(1.-smoothstep(0.,.7*uDpr,gx))*.05+(1.-smoothstep(0.,.7*uDpr,gy))*.035;
  vec3 col=bg+vec3(.06,.18,.11)*grid;
  col+=uTrace*eC*persist*1.05;
  col+=vec3(.35,.84,1.)*pC*persist*.8;
  float head=exp(-pow(length(p-vec2(uHead*uRes.x,mix(y1,y0,sampleAt(floor(uHead*N)-1.).x)))/(2.2*uDpr),2.));
  col+=vec3(.75,1.,.85)*head*.9;
  col=1.-exp(-col*1.25);
  float n=(fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453)-.5)/255.;
  gl_FragColor=vec4(col+n,1.);
}`;

  function initGL() {
    try {
      gl = canvas.getContext("webgl", { antialias: false, premultipliedAlpha: false, alpha: false });
    } catch {
      gl = null;
    }
    if (!gl) return false;
    const sh = (type, src) => {
      const s = gl.createShader(type);

      gl.compileShader(s);

    } catch (error) {
      console.error(error);
      gl = null;
      return false;
    }

    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

  const norm01 = (v) => clamp((v + 0.6) / 1.9);
  function fit() {
    const dpr = Math.min(2.5, window.devicePixelRatio || 1);
    const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
    if (w && h && (canvas.width !== w || canvas.height !== h)) { canvas.width = w; canvas.height = h; }

  }
  function sweep(t) {
    const head = Math.floor(((t / SWEEP) % 1) * N);
    if (lastIdx < 0) lastIdx = (head - 1 + N) % N;
    let i = lastIdx, guard = 0;
    while (i !== head && guard++ < N) {

      const back = ((head - i + N) % N) * (SWEEP / N);
      ecgBuf[i] = norm01(Physio.ecgAt(t - back));
      plBuf[i] = Math.min(1, Physio.mechanics(t - back).pleth / 1.2);
    }
    lastIdx = head;
    return (t / SWEEP) % 1;
  }
  function draw(headU) {
    const dpr = fit();
    const danger = Physio.pulseless() || Physio.now.rhythm === "tv";
    if (gl) {
      for (let i = 0; i < N; i++) {
        const q = Math.round(ecgBuf[i] * 65535);
        bytes[i * 4] = q >> 8; bytes[i * 4 + 1] = q & 255; bytes[i * 4 + 2] = Math.round(plBuf[i] * 255); bytes[i * 4 + 3] = 255;
      }
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, N, 1, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
      gl.uniform2f(uni.uRes, canvas.width, canvas.height);
      gl.uniform1f(uni.uHead, headU);
      gl.uniform1f(uni.uDpr, dpr);

      gl.drawArrays(gl.TRIANGLES, 0, 3);
      return;
    }

    c.fillStyle = "#07110c"; c.fillRect(0, 0, W, H);
    const line = (buf, y0, y1, color) => {
      c.strokeStyle = color; c.lineWidth = 1.4 * dpr; c.beginPath();
      let started = false;
      for (let i = 0; i < N; i++) {
        if ((headU - i / N + 1) % 1 > 0.96) { started = false; continue; }
        const x = (i / N) * W, y = y1 + (y0 - y1) * buf[i];

    };
    line(ecgBuf, H * 0.2, H * 0.7, danger ? "#ff7a66" : "#5cff9a");
