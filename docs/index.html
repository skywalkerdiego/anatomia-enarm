sos","short":"Vasos"},{"id":"nervio","name":"Encéfalo","short":"SNC"}],"systems":[{"id":"cardio","name":"Corazón y vasos"},{"id":"resp","name":"Respiratorio"},{"id":"digest","name":"Digestivo"},{"id":"uro","name":"Urinario y genital"},{"id":"neuro","name":"Sistema nervioso"},{"id":"osteo","name":"Esqueleto"}],"cards":{"corazon":{"name":"Corazón","level":"T5–T8 · ápex en 5.º EIC LMC izq.","sections":[["Anatomía",["Cara anterior (esternocostal): sobre todo ventrículo derecho. Borde derecho: aurícula derecha. Borde izquierdo y ápex: ventrículo izquierdo.","La aurícula izquierda es la cámara más posterior y se apoya sobre el esófago: el ecocardiograma transesofágico la ve mejor.","El tronco pulmonar (azul en el modelo: lleva sangre desoxigenada) sale del VD por delante y a la izquierda de la aorta."]],["Irrigación coronaria",["Coronaria derecha: AD, VD, cara inferior del VI y 1/3 posterior del septum. Irriga el nodo SA (~60%) y el nodo AV (~80–90%, dominancia derecha).","Descendente anterior (en el surco interventricular anterior): 2/3 anteriores del septum, cara anterior y ápex. Es la más ocluida en el IAM.","Circunfleja (en el surco auriculoventricular izquierdo): cara lateral y posterior del VI."]],["Inervación",["Plexo cardiaco: simpático T1–T4 (↑ FC y contractilidad) y parasimpático vagal (↓ FC).","El dolor isquémico se refiere por T1–T4: brazo izquierdo, cuello, mandíbula."]],["Correlación clínica ENARM",["IAM inferior (DII, DIII, aVF) → coronaria derecha; puede cursar con bradicardia o BAV.","IAM anterior (V1–V4) → descendente anterior. Lateral (DI, aVL, V5–V6) → circunfleja.","Taponamiento: tríada de Beck (hipotensión, ingurgitación yugular, ruidos velados) y pulso paradójico.","Índice cardiotorácico normal en Rx PA: \u003c 0.5."]]],"pearl":"Si el ST sube en DII, DIII y aVF, piensa en la coronaria derecha y vigila el nodo AV.","quiz":[{"q":"IAM con elevación del ST en DII, DIII y aVF con bradicardia. ¿Arteria más probablemente ocluida?","a":["Coronaria derecha","Descendente anterior","Circunfleja","Tronco coronario izquierdo"],"ok":0,"why":"La cara inferior depende de la coronaria derecha en ~80% (dominancia derecha), que también irriga el nodo AV: de ahí la bradicardia o el bloqueo."},{"q":"¿Cuál es la cámara cardiaca más posterior, en contacto con el esófago?","a":["Aurícula izquierda","Ventrículo derecho","Aurícula derecha","Ventrículo izquierdo"],"ok":0,"why":"La AI es posterior; su crecimiento (p. ej., estenosis mitral) puede comprimir el esófago y causar disfagia."},{"q":"¿Qué cámara forma la mayor parte de la cara anterior del corazón?","a":["Ventrículo derecho","Ventrículo izquierdo","Aurícula izquierda","Aurícula derecha"],"ok":0,"why":"La cara esternocostal es principalmente VD; por eso el VD es el más lesionado en heridas precordiales."}]},"pulmon-der":{"name":"Pulmón derecho","level":"Ápex sobre la clavícula · base en la cúpula derecha","sections":[["Anatomía",["3 lóbulos (superior, medio, inferior), 2 fisuras: oblicua y horizontal (en el modelo cada lóbulo se toca por separado). 10 segmentos broncopulmonares.","La fisura horizontal sigue la 4.ª costilla por delante.","Bronquio principal derecho: más corto, ancho y vertical que el izquierdo."]],["Irrigación",["Funcional: arterias pulmonares (sangre desoxigenada). Nutricia: arterias bronquiales (de la aorta).","Drenaje: venas pulmonares (dos por lado) a la aurícula izquierda."]],["Correlación clínica ENARM",["Cuerpos extraños y broncoaspiración van más a la derecha.","Aspiración en decúbito supino: segmento posterior del lóbulo superior y superior del lóbulo inferior derechos (absceso pulmonar en alcohólicos).","Toracocentesis: entrar por el borde superior de la costilla inferior; el paquete vena–arteria–nervio corre bajo cada costilla."]]],"pearl":"Derecho = más vertical: ahí caen los cacahuates y los tubos endotraqueales demasiado profundos.","quiz":[{"q":"Niño de 3 años aspira un cacahuate. ¿A dónde es más probable que llegue?","a":["Bronquio principal derecho","Bronquio principal izquierdo","Língula","Igual a ambos lados"],"ok":0,"why":"El bronquio derecho es más corto, ancho y vertical."},{"q":"¿Cuántos lóbulos y fisuras tiene el pulmón derecho?","a":["3 lóbulos y 2 fisuras","2 lóbulos y 1 fisura","3 lóbulos y 1 fisura","2 lóbulos y 2 fisuras"],"ok":0,"why":"Superior, medio e inferior, separados por las fisuras horizontal y oblicua."},{"q":"En una toracocentesis, la aguja debe pasar:","a":["Por el borde superior de la costilla inferior","Por el borde inferior de la costilla superior","Por cualquier punto del espacio intercostal","Por debajo de la 12.ª costilla"],"ok":0,"why":"El paquete intercostal (vena, arteria, nervio) corre por el surco del borde inferior de cada costilla."}]},"pulmon-izq":{"name":"Pulmón izquierdo","level":"Ápex sobre la clavícula · base en la cúpula izquierda","sections":[["Anatomía",["2 lóbulos (superior e inferior) y 1 fisura oblicua. La língula del lóbulo superior equivale al lóbulo medio derecho.","Escotadura cardiaca: el corazón ocupa su borde anterior.","Bronquio principal izquierdo: más largo, estrecho y horizontal; pasa bajo el cayado aórtico y por delante del esófago."]],["Hilio",["Izquierdo: la arteria pulmonar queda por encima del bronquio.","Derecho: el bronquio del lóbulo superior queda por encima de la arteria (eparterial)."]],["Correlación clínica ENARM",["Neumotórax a tensión: desviación traqueal contralateral, hipotensión e hiperresonancia. Es un diagnóstico clínico: descomprimir sin esperar la Rx.","ATLS 10.ª ed.: descompresión con aguja en el 4.º–5.º EIC por delante de la línea axilar media en adultos; 2.º EIC LMC en niños."]]],"pearl":"Língula = lóbulo medio del lado izquierdo.","quiz":[{"q":"¿Qué estructura del pulmón izquierdo equivale al lóbulo medio derecho?","a":["Língula","Segmento apicoposterior","Segmento superior del lóbulo inferior","Escotadura cardiaca"],"ok":0,"why":"La língula forma parte del lóbulo superior izquierdo y es su homóloga."},{"q":"Neumotórax a tensión en un adulto. Según ATLS 10.ª ed., la descompresión con aguja se hace en:","a":["4.º–5.º EIC anterior a la línea axilar media","2.º EIC línea axilar media","7.º EIC línea escapular","6.º EIC línea paraesternal"],"ok":0,"why":"La pared es más delgada en ese sitio, con mayor éxito que en el 2.º EIC en adultos."}]},"traquea":{"name":"Tráquea y bronquios","level":"C6 → carina en T4–T5","sections":[["Anatomía",["Inicia en C6 (cartílago cricoides) y se bifurca en T4–T5 (ángulo esternal de Louis) en la carina.","16–20 cartílagos en C, abiertos hacia atrás; detrás va el esófago.","El istmo tiroideo cubre los anillos 2–4."]],["Correlación clínica ENARM",["Intubación selectiva: un tubo demasiado profundo entra al bronquio derecho e hipoventila el pulmón izquierdo.","La punta del tubo endotraqueal debe quedar 2–5 cm por encima de la carina.","Vía aérea quirúrgica urgente en adultos: cricotiroidotomía en la membrana cricotiroidea."]]],"pearl":"Ángulo de Louis = T4–T5 = carina = inicio y fin del cayado aórtico.","quiz":[{"q":"¿A qué nivel vertebral se bifurca la tráquea?","a":["T4–T5","C6","T2","T7"],"ok":0,"why":"La carina está a la altura del ángulo esternal (T4–T5)."},{"q":"Tras intubar, hay hipoventilación izquierda y ruidos a la derecha. ¿Dónde quedó el tubo?","a":["Bronquio principal derecho","Esófago","Bronquio principal izquierdo","Laringe"],"ok":0,"why":"Por ser más vertical, el bronquio derecho recibe el tubo cuando se introduce de más; se retira hasta escuchar ambos campos."}]},"esofago":{"name":"Esófago","level":"C6 → hiato T10 → cardias T11","sections":[["Anatomía",["Mide ~25 cm; va detrás de la tráquea y de la aurícula izquierda, cruza el diafragma por el hiato esofágico en T10 con los troncos vagales.","Tres estrechamientos: cricofaríngeo (C6, el más estrecho), broncoaórtico (T4) y diafragmático (T10).","Músculo: tercio superior estriado, medio mixto, inferior liso."]],["Irrigación y drenaje",["Arterial: tiroidea inferior (superior), ramas de la aorta (medio), gástrica izquierda (inferior).","Las venas del tercio inferior unen la gástrica izquierda (porta) con la ácigos (sistémica): anastomosis portocava."]],["Correlación clínica ENARM",["Varices esofágicas en la hipertensión portal (cirrosis).","Divertículo de Zenker: triángulo de Killian, sobre el cricofaríngeo; halitosis y regurgitación.","Boerhaave: perforación distal posterolateral izquierda tras vómito intenso. Mallory-Weiss: desgarro de mucosa.","Acalasia: pérdida del plexo mientérico; imagen en pico de pájaro."]]],"pearl":"I 8 10 EGGs AT 12: cava T8, esófago (y vagos) T10, aorta (y conducto torácico, ácigos) T12.","quiz":[{"q":"Las varices esofágicas de la hipertensión portal se forman por la anastomosis entre:","a":["Vena gástrica izquierda y vena ácigos","Vena esplénica y vena renal izquierda","Vena mesentérica inferior y venas rectales","Vena porta y cava inferior de forma directa"],"ok":0,"why":"La gástrica izquierda drena a la porta y la ácigos a la cava superior; con hipertensión portal el flujo se invierte por la submucosa esofágica."},{"q":"El divertículo de Zenker se origina en:","a":["El triángulo de Killian, sobre el cricofaríngeo","El tercio medio por tracción","El esófago epifrénico","La unión gastroesofágica"],"ok":0,"why":"Es un falso divertículo por pulsión en la pared posterior de la hipofaringe."}]},"aorta":{"name":"Aorta y sus ramas","level":"Cayado T4 · hiato T12 · bifurcación L4","sections":[["Trayecto",["Ascendente → cayado (T4) con tronco braquiocefálico, carótida común izquierda y subclavia izquierda → descendente torácica → hiato aórtico (T12) → abdominal → bifurcación en ilíacas comunes (L4).","El nervio laríngeo recurrente izquierdo rodea el cayado bajo el ligamento arterioso: un aneurisma del cayado puede dar disfonía."]],["Ramas abdominales (de arriba abajo)",["Tronco celiaco (T12): gástrica izquierda, hepática común y esplénica.","Mesentérica superior (L1): pasa por delante de la 3.ª porción del duodeno.","Renales (L1–L2): la derecha pasa por detrás de la cava inferior.","Mesentérica inferior (L3), hacia el colon descendente y sigmoides."]],["Correlación clínica ENARM",["Disección: Stanford A (ascendente) → cirugía urgente; Stanford B (descendente) → manejo médico (control de FC y TA).","Aneurisma de aorta abdominal, casi siempre infrarrenal: reparar con ≥ 5.5 cm o crecimiento rápido.","Coartación: muescas costales (signo de Roesler) y signo del 3 en la Rx."]]],"pearl":"Celiaco T12 · AMS L1 · renales L1–L2 · AMI L3 · bifurcación L4.","quiz":[{"q":"Disección aórtica que involucra la aorta ascendente:","a":["Stanford A: cirugía urgente","Stanford B: manejo médico","DeBakey III: manejo médico","Stanford B: cirugía electiva"],"ok":0,"why":"Toda disección que afecta la ascendente es tipo A y su mortalidad sin cirugía es muy alta."},{"q":"La vena renal izquierda puede comprimirse entre:","a":["La aorta y la arteria mesentérica superior","La aorta y la columna","La cava y el duodeno","La AMS y el páncreas"],"ok":0,"why":"Síndrome del cascanueces: hematuria y varicocele izquierdo."},{"q":"¿A qué nivel vertebral se bifurca la aorta abdominal?","a":["L4","L1","T12","S1"],"ok":0,"why":"A la altura de L4, aproximadamente a nivel del ombligo y de las crestas ilíacas."}]},"cavas":{"name":"Venas cavas y venas renales","level":"VCI: L5 → hiato T8 · VCS: 1.er cartílago costal","sections":[["Anatomía",["Cava superior: une las dos braquiocefálicas (la izquierda cruza por delante de las ramas del cayado) y desemboca en la AD; recibe la ácigos.","Cava inferior: se forma en L5 a la derecha de la aorta, cruza el diafragma en T8 por el centro tendinoso y entra a la AD.","Vena renal izquierda: larga, cruza por delante de la aorta; recibe la gonadal y la suprarrenal izquierdas."]],["Correlación clínica ENARM",["Síndrome de vena cava superior (cáncer de pulmón de células pequeñas, linfoma): edema en esclavina, ingurgitación yugular y circulación colateral.","Varicocele izquierdo más frecuente: la gonadal izquierda drena en ángulo recto a la renal izquierda.","Varicocele derecho aislado o de inicio súbito: descartar masa retroperitoneal o renal."]]],"pearl":"Azul en el modelo = sangre desoxigenada, por eso el tronco pulmonar también es azul.","quiz":[{"q":"¿Por qué el varicocele es más frecuente del lado izquierdo?","a":["La gonadal izquierda drena en ángulo recto a la renal izquierda","La gonadal izquierda drena directo a la cava inferior","La arteria testicular izquierda es más larga","El testículo izquierdo está más alto"],"ok":0,"why":"Mayor presión hidrostática y columna más larga; la derecha drena en ángulo agudo a la cava."},{"q":"¿A nivel de qué vértebra atraviesa la cava inferior el diafragma?","a":["T8","T10","T12","L1"],"ok":0,"why":"Hiato de la cava en el centro tendinoso, T8 (junto con ramas del frénico derecho)."}]},"diafragma":{"name":"Diafragma","level":"Cúpula derecha más alta · hiatos T8, T10, T12","sections":[["Anatomía",["Dos cúpulas (la derecha más alta por el hígado) y un centro tendinoso donde se apoya el corazón.","Hiatos: cava T8 (centro tendinoso), esofágico T10 (pilar derecho), aórtico T12 (detrás de los pilares).","Inervación motora: nervio frénico C3–C5."]],["Correlación clínica ENARM",["Hernia de Bochdalek: posterolateral izquierda, congénita, con hipoplasia pulmonar. Morgagni: anterior, retroesternal.","Hernia hiatal por deslizamiento (tipo I): la más común en adultos.","Irritación diafragmática → dolor referido al hombro (signo de Kehr en la rotura esplénica).","Lesión del frénico: hemidiafragma elevado en la Rx."]]],"pearl":"C3, C4 y C5 mantienen vivo al diafragma.","quiz":[{"q":"La hernia diafragmática congénita más frecuente es:","a":["Bochdalek, posterolateral izquierda","Morgagni, anterior derecha","Hiatal por deslizamiento","Paraesofágica"],"ok":0,"why":"Bochdalek representa ~85–90% de las congénitas y se asocia a hipoplasia pulmonar."},{"q":"Inervación motora del diafragma:","a":["Nervio frénico (C3–C5)","Nervios intercostales T7–T11","Nervio vago","Plexo braquial C5–T1"],"ok":0,"why":"Los intercostales solo dan sensibilidad a la periferia del diafragma."}]},"higado":{"name":"Hígado","level":"Cuadrante superior derecho, bajo la cúpula derecha","sections":[["Anatomía",["El órgano sólido más grande. Lóbulos anatómicos derecho e izquierdo separados por el ligamento falciforme.","Couinaud: 8 segmentos funcionales; la línea de Cantlie (vesícula–cava) separa los hígados funcionales.","Tríada portal en el ligamento hepatoduodenal: colédoco (lateral), arteria hepática propia (medial) y vena porta (posterior)."]],["Irrigación",["Doble: vena porta (~75% del flujo) y arteria hepática (~25%).","Drenaje: venas hepáticas → cava inferior, justo bajo el diafragma."]],["Correlación clínica ENARM",["Espacio de Morison (hepatorrenal): primera ventana del FAST para buscar líquido libre en el cuadrante superior derecho.","Hipertensión portal: varices, ascitis, esplenomegalia y cabeza de medusa.","Absceso hepático amebiano: lóbulo derecho, contenido en pasta de anchoas; tratamiento con metronidazol.","Maniobra de Pringle: pinzar el ligamento hepatoduodenal para controlar el sangrado."]]],"pearl":"El hígado baja con la inspiración: por eso se palpa al pedir al paciente que inspire.","quiz":[{"q":"En el FAST, ¿qué espacio se explora en la ventana del cuadrante superior derecho?","a":["Espacio hepatorrenal de Morison","Fondo de saco de Douglas","Espacio esplenorrenal","Pericardio"],"ok":0,"why":"Es la zona más declive del abdomen superior en decúbito supino."},{"q":"En el ligamento hepatoduodenal, la estructura más posterior es:","a":["La vena porta","El colédoco","La arteria hepática propia","La vena cava inferior"],"ok":0,"why":"Colédoco lateral, arteria medial y porta por detrás de ambos."},{"q":"Tratamiento de elección del absceso hepático amebiano no complicado:","a":["Metronidazol","Drenaje quirúrgico inmediato","Albendazol","Ceftriaxona sola"],"ok":0,"why":"Responde a nitroimidazoles; el drenaje se reserva para riesgo de rotura o falta de respuesta."}]},"vesicula":{"name":"Vesícula biliar","level":"Fondo en el 9.º cartílago costal derecho","sections":[["Anatomía",["Fondo, cuerpo, infundíbulo (bolsa de Hartmann) y cuello. El cístico se une al hepático común para formar el colédoco.","Arteria cística: rama de la hepática derecha, dentro del triángulo de Calot (cístico, hepático común y borde hepático).","Punto de Murphy: reborde costal derecho en la línea medioclavicular."]],["Correlación clínica ENARM",["Colecistitis aguda: Murphy positivo; ultrasonido como estudio inicial; criterios de Tokio.","Colangitis: tríada de Charcot (fiebre, ictericia, dolor en hipocondrio derecho); péntada de Reynolds si se agregan hipotensión y alteración del estado de alerta.","Courvoisier-Terrier: vesícula palpable no dolorosa + ictericia → neoplasia periampular."]]],"pearl":"Charcot = colangitis. Reynolds = colangitis grave: drenaje biliar urgente.","quiz":[{"q":"Fiebre, ictericia y dolor en hipocondrio derecho corresponden a:","a":["Tríada de Charcot (colangitis)","Péntada de Reynolds","Signo de Murphy","Signo de Courvoisier"],"ok":0,"why":"La tríada de Charcot define clínicamente la colangitis aguda."},{"q":"El triángulo de Calot contiene habitualmente:","a":["La arteria cística","La vena porta","El colédoco distal","La arteria gastroduodenal"],"ok":0,"why":"Identificarla en el triángulo es clave en la colecistectomía (visión crítica de seguridad)."},{"q":"Estudio de imagen inicial ante sospecha de colecistitis aguda:","a":["Ultrasonido de hígado y vías biliares","TAC contrastada","CPRE","Gammagrama HIDA en todos los casos"],"ok":0,"why":"Accesible, sin radiación y con buena sensibilidad; el HIDA se reserva para casos dudosos."}]},"estomago":{"name":"Estómago","level":"Cardias T11 · píloro L1 (plano transpilórico)","sections":[["Anatomía",["Cardias, fondo (bajo la cúpula izquierda), cuerpo, antro y píloro.","Células parietales (HCl y factor intrínseco, fondo y cuerpo), principales (pepsinógeno) y G (gastrina, antro)."]],["Irrigación",["Curvatura menor: gástricas izquierda (tronco celiaco) y derecha.","Curvatura mayor: gastroepiploicas derecha (gastroduodenal) e izquierda (esplénica). Fondo: gástricas cortas."]],["Correlación clínica ENARM",["Úlcera duodenal posterior: puede erosionar la arteria gastroduodenal y sangrar masivamente.","H. pylori: principal causa de úlcera péptica; erradicar.","Gastrectomía o anemia perniciosa → déficit de B12 por falta de factor intrínseco."]]],"pearl":"Ácido = parietales. Sin factor intrínseco no hay B12.","quiz":[{"q":"Úlcera en la cara posterior del bulbo duodenal con sangrado masivo. Arteria afectada:","a":["Gastroduodenal","Gástrica izquierda","Esplénica","Mesentérica superior"],"ok":0,"why":"La gastroduodenal corre detrás de la primera porción del duodeno."},{"q":"Las células parietales secretan:","a":["HCl y factor intrínseco","Pepsinógeno","Gastrina","Somatostatina"],"ok":0,"why":"Están en el fondo y el cuerpo; las G (gastrina) en el antro."}]},"duodeno":{"name":"Duodeno","level":"L1–L3 · ángulo de Treitz","sections":[["Anatomía",["~25 cm en forma de C alrededor de la cabeza del páncreas. Retroperitoneal salvo el bulbo.","2.ª porción: ampolla de Vater (colédoco + Wirsung). 3.ª porción: cruza entre la aorta y la mesentérica superior.","4.ª porción → ángulo de Treitz (ligamento suspensorio)."]],["Correlación clínica ENARM",["El ligamento de Treitz separa la hemorragia digestiva alta de la baja.","Atresia duodenal: doble burbuja; asociada a síndrome de Down.","Síndrome de la AMS (Wilkie): compresión de la 3.ª porción tras pérdida de peso."]]],"pearl":"Doble burbuja + Down = atresia duodenal.","quiz":[{"q":"Recién nacido con síndrome de Down, vómitos biliares y Rx con doble burbuja:","a":["Atresia duodenal","Estenosis hipertrófica de píloro","Enfermedad de Hirschsprung","Atresia esofágica"],"ok":0,"why":"La doble burbuja son el estómago y el duodeno proximal dilatados, sin aire distal."},{"q":"¿Qué estructura separa la hemorragia digestiva alta de la baja?","a":["Ligamento de Treitz","Píloro","Válvula ileocecal","Ampolla de Vater"],"ok":0,"why":"Proximal a Treitz = alta; distal = baja."}]},"pancreas":{"name":"Páncreas","level":"L1–L2 · retroperitoneal salvo la cola","sections":[["Anatomía",["Cabeza en el marco duodenal, cuello sobre la confluencia de la porta, cuerpo sobre la aorta y cola hacia el hilio esplénico.","Conducto de Wirsung → ampolla de Vater con el colédoco; Santorini → papila menor.","Irrigación: pancreatoduodenales (gastroduodenal y AMS) y ramas de la esplénica."]],["Correlación clínica ENARM",["Pancreatitis aguda: la litiasis biliar es la causa más frecuente; diagnóstico con 2 de 3 (dolor típico, lipasa o amilasa ≥ 3× el límite superior, imagen).","Signos de Cullen (periumbilical) y Grey Turner (flancos): hemorragia retroperitoneal.","Cáncer de cabeza de páncreas: ictericia indolora, pérdida de peso, vesícula palpable (Courvoisier)."]]],"pearl":"Dolor en cinturón + lipasa ≥ 3× = pancreatitis.","quiz":[{"q":"Causa más frecuente de pancreatitis aguda:","a":["Litiasis biliar","Hipercalcemia","Fármacos","Traumatismo"],"ok":0,"why":"Los cálculos que obstruyen la ampolla son la primera causa; el alcohol es la segunda."},{"q":"Ictericia indolora, pérdida de peso y vesícula palpable no dolorosa sugieren:","a":["Adenocarcinoma de cabeza de páncreas","Coledocolitiasis","Colecistitis aguda","Hepatitis viral"],"ok":0,"why":"Signo de Courvoisier-Terrier: obstrucción maligna y lenta del colédoco."}]},"bazo":{"name":"Bazo","level":"Cuadrante superior izquierdo · costillas 9–11","sections":[["Anatomía",["Intraperitoneal, bajo la cúpula izquierda y detrás del estómago, entre las costillas 9 y 11.","Ligamentos gastroesplénico (vasos gástricos cortos) y esplenorrenal (vasos esplénicos y cola del páncreas).","Arteria esplénica: rama del tronco celiaco, tortuosa, por el borde superior del páncreas."]],["Correlación clínica ENARM",["Órgano sólido más lesionado en trauma cerrado de abdomen; signo de Kehr (dolor en hombro izquierdo).","Tras esplenectomía: vacunar contra neumococo, meningococo y H. influenzae tipo b (riesgo de sepsis por encapsulados).","Mononucleosis con esplenomegalia: evitar deportes de contacto."]]],"pearl":"1, 3, 5, 7, 9, 11: 1 × 3 × 5 pulgadas, 7 onzas, entre las costillas 9 y 11.","quiz":[{"q":"Órgano sólido más frecuentemente lesionado en trauma abdominal cerrado:","a":["Bazo","Páncreas","Riñón","Vesícula"],"ok":0,"why":"Es friable y está protegido solo por las costillas inferiores."},{"q":"Tras una esplenectomía se debe vacunar contra:","a":["Neumococo, meningococo y H. influenzae b","Solo influenza","Hepatitis B y tétanos","VPH"],"ok":0,"why":"Sin bazo se pierde la defensa contra bacterias encapsuladas."}]},"intestino":{"name":"Intestino delgado","level":"Del ángulo de Treitz a la válvula ileocecal","sections":[["Anatomía",["~6 m. Yeyuno (proximal, pliegues circulares prominentes, vasos rectos largos) e íleon (distal, placas de Peyer, más arcadas).","Irrigado por la mesentérica superior.","Íleon terminal: absorbe B12 y sales biliares."]],["Correlación clínica ENARM",["Isquemia mesentérica aguda: dolor desproporcionado a la exploración; embolia de la AMS en fibrilación auricular.","Divertículo de Meckel: regla de los 2; persistencia del conducto onfalomesentérico; sangrado indoloro; gammagrama con pertecnetato Tc-99m.","Adherencias (bridas): primera causa de oclusión intestinal en adultos operados.","Enfermedad de Crohn: íleon terminal."]]],"pearl":"Meckel: 2%, a 2 pies de la válvula, 2 pulgadas, 2 tipos de mucosa ectópica, antes de los 2 años.","quiz":[{"q":"Dolor abdominal intenso desproporcionado a la exploración en un paciente con fibrilación auricular:","a":["Isquemia mesentérica aguda por embolia de la AMS","Pancreatitis aguda","Apendicitis","Diverticulitis"],"ok":0,"why":"El émbolo suele alojarse en la AMS, distal al origen de la cólica media."},{"q":"El divertículo de Meckel deriva de:","a":["Conducto onfalomesentérico (vitelino)","Uraco","Conducto de Wolff","Seno urogenital"],"ok":0,"why":"Es un divertículo verdadero por persistencia del conducto vitelino."},{"q":"La resección del íleon terminal produce deficiencia de:","a":["Vitamina B12","Hierro","Ácido fólico","Vitamina C"],"ok":0,"why":"El complejo B12-factor intrínseco se absorbe en el íleon terminal."}]},"colon":{"name":"Colon, ciego y apéndice","level":"Ciego en fosa ilíaca derecha · sigmoides en la izquierda","sections":[["Anatomía",["Haustras, tenias y apéndices epiploicos. Ascendente y descendente retroperitoneales; transverso y sigmoides con meso.","Apéndice: base en la confluencia de las tenias del ciego.","AMS irriga hasta los 2/3 proximales del transverso; AMI el resto hasta el recto superior."]],["Correlación clínica ENARM",["Apendicitis: dolor periumbilical que migra a la fosa ilíaca derecha; McBurney, Rovsing, psoas y obturador; escala de Alvarado.","Colitis isquémica en zonas limítrofes: ángulo esplénico (Griffiths) y unión rectosigmoidea (Sudeck).","Vólvulo de sigmoides: adulto mayor estreñido, imagen en grano de café.","Cáncer colorrectal: derecho → anemia ferropénica; izquierdo → cambio de hábito y obstrucción."]]],"pearl":"McBurney: unión del tercio externo con los dos tercios internos de la línea EIAS–ombligo.","quiz":[{"q":"El punto de McBurney se localiza:","a":["En la unión del tercio externo con los 2/3 internos de la línea EIAS derecha–ombligo","En el punto medio entre la EIAS y el ombligo","Bajo el reborde costal derecho en la línea medioclavicular","En la fosa ilíaca izquierda"],"ok":0,"why":"Corresponde a la proyección habitual de la base apendicular."},{"q":"Zona del colon más vulnerable a la colitis isquémica por ser territorio limítrofe:","a":["Ángulo esplénico","Ciego","Colon ascendente","Recto inferior"],"ok":0,"why":"Es la frontera entre la AMS y la AMI (punto de Griffiths)."},{"q":"Adulto mayor con distensión abdominal y Rx con imagen en grano de café:","a":["Vólvulo de sigmoides","Íleo biliar","Apendicitis","Megacolon tóxico"],"ok":0,"why":"Manejo inicial: devolvulación endoscópica si no hay datos de isquemia."}]},"rinones":{"name":"Riñones, suprarrenales y uréteres","level":"T12–L3 · el derecho más bajo","sections":[["Anatomía",["Retroperitoneales; el derecho más bajo por el hígado. Hilio de anterior a posterior: vena, arteria, pelvis.","Suprarrenales (sobre los polos superiores): corteza glomerular (aldosterona), fascicular (cortisol), reticular (andrógenos); médula (catecolaminas).","Uréteres: cruzan por delante de la bifurcación de la ilíaca común; en la mujer pasan bajo la arteria uterina."]],["Correlación clínica ENARM",["Estrechamientos ureterales: unión pieloureteral, cruce con los ilíacos y unión ureterovesical (sitio más común de impactación).","Litiasis en adultos: TAC simple de abdomen y pelvis; en embarazadas y niños, ultrasonido.","Riñón en herradura: su ascenso queda atrapado bajo la mesentérica inferior.","Feocromocitoma: crisis de cefalea, sudoración y palpitaciones con hipertensión."]]],"pearl":"Sal, azúcar y sexo: glomerular, fascicular y reticular, de fuera hacia dentro.","quiz":[{"q":"Sitio más frecuente de impactación de un lito ureteral:","a":["Unión ureterovesical","Unión pieloureteral","Cruce con vasos ilíacos","Cáliz menor"],"ok":0,"why":"Es el punto más estrecho del uréter."},{"q":"El riñón en herradura queda atrapado en su ascenso por:","a":["Arteria mesentérica inferior","Arteria mesentérica superior","Tronco celiaco","Arteria renal"],"ok":0,"why":"El istmo que une los polos inferiores choca con la AMI."},{"q":"Estudio de elección para confirmar litiasis urinaria en un adulto no embarazado:","a":["TAC simple de abdomen y pelvis","Urografía excretora","Rx simple de abdomen","Gammagrama renal"],"ok":0,"why":"Máxima sensibilidad y especificidad, sin contraste."}]},"vejiga":{"name":"Vejiga","level":"Pelvis, detrás del pubis","sections":[["Anatomía",["Detrás de la sínfisis del pubis; trígono entre los orificios ureterales y uretral. Capacidad ~400–500 mL.","Parasimpático S2–S4 (contrae el detrusor), simpático T10–L2 (relaja el detrusor y cierra el cuello), pudendo S2–S4 (esfínter externo)."]],["Correlación clínica ENARM",["Rotura vesical extraperitoneal (con fractura pélvica): sonda. Intraperitoneal (golpe con vejiga llena): cirugía. Diagnóstico por cistografía retrógrada.","Hematuria macroscópica indolora en fumador: carcinoma urotelial hasta demostrar lo contrario."]]],"pearl":"Para orinar se necesita el parasimpático: \"pee = parasympathetic\".","quiz":[{"q":"La contracción del detrusor durante la micción depende de:","a":["Parasimpático S2–S4 (esplácnicos pélvicos)","Simpático T10–L2","Nervio pudendo","Nervio obturador"],"ok":0,"why":"El simpático favorece el llenado; el pudendo controla el esfínter externo voluntario."},{"q":"Hematuria macroscópica indolora en un fumador de 65 años. Sospecha principal:","a":["Carcinoma urotelial de vejiga","Litiasis","Cistitis bacteriana","Hiperplasia prostática"],"ok":0,"why":"El tabaquismo es su principal factor de riesgo; se estudia con cistoscopia y uro-TAC."}]},"pelvis":{"name":"Pelvis ósea","level":"Sacro, crestas ilíacas, estrecho superior","sections":[["Anatomía",["El estrecho superior (línea terminal) separa la pelvis mayor de la menor. Las espinas ilíacas anterosuperiores (EIAS) se palpan por delante.","La línea entre las crestas ilíacas (Tuffier) cruza L4."]],["Correlación clínica ENARM",["Fractura pélvica inestable: hemorragia retroperitoneal (plexo venoso presacro); colocar faja pélvica.","Sangre en el meato uretral: no sondear; hacer uretrografía retrógrada."]]],"pearl":"Crestas ilíacas = L4: guía para la punción lumbar.","quiz":[{"q":"Fractura pélvica con sangre en el meato uretral. Antes de colocar sonda Foley:","a":["Uretrografía retrógrada","Colocar la sonda de inmediato","Cistoscopia","TAC de cráneo"],"ok":0,"why":"Sondear una uretra lesionada puede convertir una rotura parcial en completa."}]},"columna":{"name":"Columna y niveles vertebrales","level":"7 C · 12 T · 5 L · sacro","sections":[["Niveles de referencia",["C6: cricoides, inicio de tráquea y esófago.","T4–T5: ángulo de Louis, carina, cayado aórtico.","T8 cava · T10 esófago · T12 aorta y tronco celiaco.","L1: AMS, píloro, fin de la médula (cono L1–L2 en adultos).","L4: bifurcación aórtica y crestas ilíacas → punción lumbar en L3–L4 o L4–L5."]],["Correlación clínica ENARM",["Hernia discal L4–L5 → raíz L5: debilidad para la dorsiflexión del primer dedo.","Hernia L5–S1 → raíz S1: reflejo aquíleo disminuido y debilidad de la flexión plantar.","Síndrome de cola de caballo: anestesia en silla de montar y retención urinaria → resonancia y cirugía urgente."]]],"pearl":"La raíz afectada suele ser la del número inferior del espacio: L5–S1 → S1.","quiz":[{"q":"La línea que une las crestas ilíacas (Tuffier) corresponde a:","a":["L4 o el espacio L4–L5","L1","T12","S1"],"ok":0,"why":"Por eso la punción lumbar se hace en L3–L4 o L4–L5, bajo el cono medular."},{"q":"Hernia discal posterolateral L5–S1. Raíz afectada:","a":["S1","L5","L4","S2"],"ok":0,"why":"La hernia posterolateral comprime la raíz que sale por el agujero inferior."},{"q":"Retención urinaria, anestesia en silla de montar y debilidad en piernas tras hernia masiva:","a":["Síndrome de cola de caballo: cirugía urgente","Lumbalgia mecánica","Estenosis foraminal","Espondilolistesis grado I"],"ok":0,"why":"Es una urgencia neuroquirúrgica."}]},"costillas":{"name":"Caja torácica","level":"12 pares · 7 verdaderas, 3 falsas, 2 flotantes","sections":[["Anatomía",["Verdaderas 1–7 (al esternón), falsas 8–10, flotantes 11–12.","Paquete intercostal en el surco costal: vena, arteria y nervio (VAN) de arriba abajo."]],["Correlación clínica ENARM",["Tórax inestable: fracturas en 2 o más sitios de 2 o más costillas consecutivas → movimiento paradójico.","Fractura de 1.ª o 2.ª costilla: trauma de alta energía; buscar lesión de grandes vasos.","Fracturas de costillas 9–11: sospechar lesión de hígado o bazo."]]],"pearl":"VAN: vena arriba, nervio abajo; la aguja siempre sobre la costilla.","quiz":[{"q":"Tórax inestable se define como:","a":["Fracturas en 2 o más sitios de 2 o más costillas consecutivas","Una sola costilla fracturada desplazada","Fractura esternal aislada","Fractura de la 1.ª costilla"],"ok":0,"why":"El segmento libre se mueve en sentido paradójico con la respiración."},{"q":"Fractura de costillas izquierdas 9–11 con hipotensión. Órgano más probablemente lesionado:","a":["Bazo","Riñón izquierdo","Páncreas","Corazón"],"ok":0,"why":"El bazo queda justo bajo esas costillas."}]},"cuello":{"name":"Cuello y laringe","level":"Hioides C3 · cartílago tiroides C4–C5 · cricoides C6","sections":[["Anatomía",["Hioides (C3), cartílago tiroides (C4–C5) y cricoides (C6): las referencias palpables de la vía aérea.","Membrana cricotiroidea, entre el tiroides y el cricoides: sitio de la cricotiroidotomía.","El istmo tiroideo cubre los anillos traqueales 2–4."]],["Correlación clínica ENARM",["Vaina carotídea: carótida común (medial), yugular interna (lateral) y nervio vago (posterior, entre ambas).","Nervio laríngeo recurrente en el surco traqueoesofágico: su lesión en la tiroidectomía causa disfonía.","El istmo tiroideo cubre los anillos traqueales 2–4."]]],"pearl":"Vaina carotídea: arteria por dentro, vena por fuera, vago atrás.","quiz":[{"q":"Contenido de la vaina carotídea:","a":["Carótida común, yugular interna y nervio vago","Carótida, yugular externa y frénico","Subclavia, vertebral e hipogloso","Tráquea, esófago y recurrente"],"ok":0,"why":"El vago va posterior, entre la arteria y la vena."},{"q":"Disfonía después de una tiroidectomía sugiere lesión del:","a":["Nervio laríngeo recurrente","Nervio frénico","Nervio hipogloso","Nervio accesorio"],"ok":0,"why":"Inerva todos los músculos intrínsecos de la laringe excepto el cricotiroideo."}]},"valvulas":{"name":"Válvulas cardiacas","level":"Focos: aórtico 2.º EIC der. · pulmonar 2.º EIC izq. · tricúspide 4.º–5.º EIC paraesternal izq. · mitral 5.º EIC LMC","sections":[["Anatomía",["Auriculoventriculares: tricúspide (derecha, 3 valvas) y mitral (izquierda, 2 valvas), sujetas por cuerdas tendinosas a los músculos papilares.","Semilunares: pulmonar y aórtica, de 3 valvas y sin cuerdas. En el modelo se ven la mitral, la tricúspide y la pulmonar."]],["Ruidos cardiacos",["S1: cierre de mitral y tricúspide, al inicio de la sístole.","S2: cierre de aórtica y pulmonar; se desdobla de forma fisiológica en la inspiración.","S3: llenado rápido (insuficiencia cardiaca; normal en jóvenes). S4: contracción auricular contra un ventrículo rígido (hipertrofia)."]],["Correlación clínica ENARM",["Estenosis aórtica: soplo sistólico eyectivo irradiado a carótidas; angina, síncope y disnea; pulso parvus et tardus.","Estenosis mitral: casi siempre reumática; chasquido de apertura y retumbo diastólico; fibrilación auricular y embolia.","Insuficiencia mitral: soplo holosistólico en el ápex irradiado a la axila.","Insuficiencia aórtica: soplo diastólico decreciente y presión de pulso amplia.","Endocarditis en usuarios de drogas intravenosas: válvula tricúspide, S. aureus."]]],"pearl":"Sistólicos: estenosis aórtica e insuficiencia mitral. Diastólicos: insuficiencia aórtica y estenosis mitral.","quiz":[{"q":"Soplo sistólico eyectivo en el 2.º espacio intercostal derecho irradiado a carótidas, con síncope de esfuerzo:","a":["Estenosis aórtica","Insuficiencia mitral","Estenosis mitral","Insuficiencia aórtica"],"ok":0,"why":"La tríada clásica es angina, síncope y disnea; el pulso es pequeño y tardío."},{"q":"El primer ruido cardiaco (S1) corresponde al cierre de:","a":["Las válvulas mitral y tricúspide","Las válvulas aórtica y pulmonar","La válvula aórtica sola","El foramen oval"],"ok":0,"why":"Marca el inicio de la sístole ventricular; S2 es el cierre de las semilunares."}]},"coronarias":{"name":"Arterias coronarias","level":"Nacen de los senos aórticos derecho e izquierdo","sections":[["Anatomía",["Tronco coronario izquierdo → descendente anterior (DA) y circunfleja (Cx).","Coronaria derecha (CD) → marginal aguda y, cuando domina (80–85 %), la descendente posterior.","El miocardio se perfunde en diástole: la taquicardia acorta la diástole y reduce el flujo coronario."]],["Territorios y derivaciones",["DA: septum anterior, cara anterior y ápex → V1–V4.","Cx: cara lateral → DI, aVL, V5–V6.","CD: cara inferior, ventrículo derecho y nodos sinusal y AV → DII, DIII, aVF.","Infarto del ventrículo derecho: pedir V4R; evitar nitratos y diuréticos, dar volumen."]],["Correlación clínica ENARM",["IAM con elevación del ST: reperfundir. ICP primaria si se logra en ≤ 120 min desde el primer contacto; si no, fibrinólisis en las primeras 12 h.","Metas: puerta-balón ≤ 90 min; puerta-aguja ≤ 30 min.","Complicaciones mecánicas (días 3–7): rotura de músculo papilar (insuficiencia mitral aguda), comunicación interventricular y rotura de pared libre (taponamiento)."]]],"pearl":"DII, DIII y aVF = coronaria derecha. V1–V4 = descendente anterior. DI, aVL, V5–V6 = circunfleja.","quiz":[{"q":"Elevación del ST de V1 a V4. Arteria más probablemente ocluida:","a":["Descendente anterior","Coronaria derecha","Circunfleja","Marginal aguda"],"ok":0,"why":"La DA irriga el septum anterior, la cara anterior y el ápex."},{"q":"IAM inferior con hipotensión, ingurgitación yugular y campos pulmonares limpios. Conducta:","a":["Sospechar infarto del ventrículo derecho: V4R, líquidos y evitar nitratos","Nitroglicerina intravenosa","Furosemida","Betabloqueador intravenoso"],"ok":0,"why":"El ventrículo derecho infartado depende de la precarga; los nitratos y los diuréticos la reducen."},{"q":"IAM con elevación del ST de 2 h de evolución; la sala de hemodinamia más cercana está a 4 h. Conducta:","a":["Fibrinólisis en los primeros 30 min y después traslado","Esperar el traslado para ICP primaria","Solo antiagregantes","Prueba de esfuerzo"],"ok":0,"why":"Si la ICP no es posible en ≤ 120 min, se fibrinoliza (estrategia farmacoinvasiva)."}]},"supraaorticos":{"name":"Troncos supraaórticos y carótidas","level":"Cayado T4 · bifurcación carotídea en C3–C4","sections":[["Anatomía",["Ramas del cayado: tronco braquiocefálico (subclavia y carótida común derechas), carótida común izquierda y subclavia izquierda.","La carótida común se bifurca a la altura del borde superior del cartílago tiroides. La interna no da ramas en el cuello; la externa irriga cara y cuello.","Seno carotídeo: barorreceptor (IX par). Cuerpo carotídeo: quimiorreceptor de O₂.","Subclavia: da la vertebral, la torácica interna y el tronco tirocervical."]],["Correlación clínica ENARM",["Estenosis carotídea sintomática de 70–99 %: endarterectomía.","Robo de la subclavia: estenosis proximal a la vertebral; flujo vertebral retrógrado y síntomas vertebrobasilares al usar el brazo; presión distinta entre brazos.","Disección carotídea: dolor cervical, síndrome de Horner y EVC en un joven.","Masaje del seno carotídeo en la taquicardia supraventricular: auscultar antes para descartar soplo."]]],"pearl":"La carótida interna no da ramas en el cuello; la externa sí.","quiz":[{"q":"Mareo y visión doble al ejercitar el brazo izquierdo, con presión arterial menor en ese brazo:","a":["Síndrome del robo de la subclavia","Disección aórtica","Estenosis carotídea","Síndrome del opérculo torácico"],"ok":0,"why":"La estenosis de la subclavia proximal a la vertebral invierte el flujo vertebral."}]},"pulmonar":{"name":"Circulación pulmonar","level":"El tronco pulmonar sale del ventrículo derecho y se divide bajo el cayado","sections":[["Anatomía",["Las arterias pulmonares llevan sangre desoxigenada (azules en el modelo) a baja presión: la media normal es menor de 20 mmHg.","Cuatro venas pulmonares (rojas) devuelven sangre oxigenada a la aurícula izquierda.","Ligamento arterioso: resto del conducto arterioso, entre la pulmonar izquierda y el cayado."]],["Correlación clínica ENARM",["Tromboembolia pulmonar: disnea súbita, dolor pleurítico y taquicardia. El hallazgo más frecuente en el ECG es la taquicardia sinusal; S1Q3T3 es clásico pero poco común.","Probabilidad baja: dímero D. Probabilidad alta: angiotomografía pulmonar.","Tratamiento: anticoagulación; trombólisis si hay hipotensión sostenida o choque.","Hipertensión pulmonar: presión media > 20 mmHg por cateterismo derecho.","Conducto arterioso persistente: soplo continuo «en maquinaria»; indometacina o ibuprofeno lo cierran en el prematuro, la prostaglandina E1 lo mantiene abierto."]]],"pearl":"TEP con choque: trombólisis. TEP estable: anticoagulación.","quiz":[{"q":"Estudio de elección ante alta probabilidad clínica de tromboembolia pulmonar en un paciente estable:","a":["Angiotomografía pulmonar","Dímero D","Radiografía de tórax","Gasometría arterial"],"ok":0,"why":"El dímero D solo sirve para descartar cuando la probabilidad es baja o intermedia."},{"q":"Hallazgo electrocardiográfico más frecuente en la tromboembolia pulmonar:","a":["Taquicardia sinusal","Patrón S1Q3T3","Bloqueo de rama izquierda","Elevación difusa del ST"],"ok":0,"why":"S1Q3T3 es específico de sobrecarga derecha pero aparece en una minoría."}]},"porta":{"name":"Sistema porta","level":"La porta se forma detrás del cuello del páncreas (L1–L2)","sections":[["Anatomía",["Vena porta = esplénica + mesentérica superior; la mesentérica inferior drena en la esplénica. En el modelo se ven la esplénica y la mesentérica superior.","Aporta alrededor de 75 % del flujo hepático: sangre rica en nutrientes y pobre en oxígeno."]],["Anastomosis portocavas",["Esófago: gástrica izquierda ↔ ácigos → várices esofágicas.","Ombligo: paraumbilicales ↔ epigástricas → cabeza de medusa.","Recto: rectal superior ↔ rectales media e inferior → várices rectales."]],["Correlación clínica ENARM",["Hipertensión portal clínicamente significativa: gradiente de presión venosa hepática ≥ 10 mmHg; la cirrosis es la causa más común.","Sangrado variceal: reanimación restrictiva, vasoconstrictor esplácnico (terlipresina u octreótido), ceftriaxona profiláctica y ligadura endoscópica.","Ascitis con gradiente albúmina sérica-ascitis ≥ 1.1 g/dL: hipertensión portal.","Peritonitis bacteriana espontánea: ≥ 250 polimorfonucleares/mm³; cefalosporina de tercera generación y albúmina."]]],"pearl":"Gradiente de albúmina ≥ 1.1 g/dL = la ascitis es por hipertensión portal.","quiz":[{"q":"Paciente cirrótico con ascitis, fiebre y 380 polimorfonucleares/mm³ en el líquido. Diagnóstico y manejo:","a":["Peritonitis bacteriana espontánea: cefalosporina de tercera generación y albúmina","Ascitis no complicada: solo diuréticos","Peritonitis secundaria: laparotomía","Carcinomatosis: citología"],"ok":0,"why":"Con ≥ 250 PMN/mm³ se trata sin esperar el cultivo; la albúmina previene el síndrome hepatorrenal."},{"q":"La vena porta se forma por la unión de:","a":["La vena esplénica y la mesentérica superior","Las venas mesentéricas superior e inferior","La esplénica y la gástrica izquierda","Las venas hepáticas"],"ok":0,"why":"Se unen detrás del cuello del páncreas; la mesentérica inferior suele drenar en la esplénica."}]},"timo":{"name":"Timo","level":"Mediastino anterosuperior, detrás del manubrio","sections":[["Anatomía y función",["Madura los linfocitos T. Es grande en la infancia e involuciona después de la pubertad.","Deriva de la tercera bolsa faríngea, igual que las paratiroides inferiores."]],["Correlación clínica ENARM",["Masas del mediastino anterior, las «4 T»: timoma, teratoma, tiroides y «terrible» linfoma.","Miastenia gravis: 10–15 % tienen timoma y la mayoría hiperplasia tímica; pedir tomografía de tórax.","Síndrome de DiGeorge (22q11): aplasia tímica, hipocalcemia y cardiopatía conotruncal.","Signo de la vela en la radiografía del lactante: timo normal."]]],"pearl":"Miastenia gravis → tomografía de tórax para buscar timoma.","quiz":[{"q":"Tumor más frecuente del mediastino anterior en el adulto, asociado a miastenia gravis:","a":["Timoma","Schwannoma","Quiste broncogénico","Linfoma de Hodgkin"],"ok":0,"why":"Los tumores neurogénicos son del mediastino posterior; los quistes broncogénicos, del medio."}]},"prostata":{"name":"Próstata y vesículas seminales","level":"Bajo la vejiga, delante del recto","sections":[["Anatomía",["Rodea la uretra prostática. Zona de transición (periuretral): asiento de la hiperplasia. Zona periférica: asiento del cáncer, palpable al tacto rectal.","La vesícula seminal y el conducto deferente forman el conducto eyaculador."]],["Correlación clínica ENARM",["Hiperplasia prostática: los alfabloqueadores (tamsulosina) alivian rápido; los inhibidores de la 5-alfa-reductasa (finasterida) reducen el volumen en meses.","Cáncer de próstata: adenocarcinoma de la zona periférica; antígeno prostático y tacto rectal; el diagnóstico es por biopsia. Metástasis óseas blásticas en la columna.","Prostatitis aguda: E. coli; evitar el masaje prostático."]]],"pearl":"Hiperplasia = zona de transición. Cáncer = zona periférica.","quiz":[{"q":"El adenocarcinoma de próstata se origina con mayor frecuencia en la zona:","a":["Periférica","De transición","Central","Periuretral"],"ok":0,"why":"Por eso puede palparse en el tacto rectal y da síntomas obstructivos tardíos."}]},"genitales":{"name":"Testículo y escroto","level":"Arteria testicular: rama de la aorta en L2","sections":[["Anatomía",["Vena testicular derecha → cava inferior; izquierda → vena renal izquierda.","Linfáticos del testículo → ganglios paraaórticos; los del escroto → inguinales superficiales.","Reflejo cremastérico: L1–L2 (nervio genitofemoral)."]],["Correlación clínica ENARM",["Torsión testicular: dolor súbito, testículo elevado y horizontal, reflejo cremastérico ausente; exploración quirúrgica urgente, idealmente antes de 6 h.","Epididimitis: el dolor mejora al elevar el testículo (Prehn positivo); en menores de 35 años, Chlamydia y gonococo.","Criptorquidia: orquidopexia entre los 6 y 12 meses (máximo 18); riesgo de infertilidad y cáncer.","Cáncer testicular: masa indolora en un joven; AFP, hCG y DHL; orquiectomía radical por vía inguinal, nunca biopsia transescrotal."]]],"pearl":"Dolor testicular súbito sin reflejo cremastérico = torsión hasta demostrar lo contrario.","quiz":[{"q":"Adolescente con dolor testicular súbito, testículo elevado y reflejo cremastérico ausente. Conducta:","a":["Exploración quirúrgica urgente","Antibiótico y control en 48 h","Ultrasonido Doppler programado","Analgésico y reposo"],"ok":0,"why":"El tiempo es testículo: la viabilidad cae después de 6 h; el Doppler no debe retrasar la cirugía."},{"q":"Los linfáticos del testículo drenan a los ganglios:","a":["Paraaórticos (lumbares)","Inguinales superficiales","Ilíacos internos","Obturadores"],"ok":0,"why":"El testículo desciende desde el retroperitoneo y conserva su drenaje; el escroto drena a los inguinales."}]},"craneo":{"name":"Cráneo","level":"Pterion: unión de frontal, parietal, temporal y esfenoides","sections":[["Anatomía",["Neurocráneo (8 huesos) y viscerocráneo (14). Suturas coronal, sagital y lambdoidea.","Fontanela anterior: cierra entre los 9 y 18 meses; la posterior, al mes o dos.","Bajo el pterion corre la arteria meníngea media.","Base: agujero oval (V3), redondo (V2), espinoso (meníngea media), yugular (IX, X, XI) y magno."]],["Correlación clínica ENARM",["Hematoma epidural: arteria meníngea media, fractura temporal, intervalo lúcido; imagen biconvexa que no cruza suturas.","Hematoma subdural: venas puente; imagen semilunar que sí cruza suturas; ancianos y alcohólicos.","Fractura de la base: ojos de mapache, signo de Battle, salida de líquido cefalorraquídeo por nariz u oído; no colocar sonda nasogástrica.","Glasgow ≤ 8: vía aérea definitiva.","Tríada de Cushing (hipertensión, bradicardia, respiración irregular): hipertensión intracraneal."]]],"pearl":"Biconvexo = epidural (arteria). Semilunar = subdural (venas puente).","quiz":[{"q":"Golpe en la región temporal, pérdida breve del estado de alerta, recuperación y deterioro una hora después. La tomografía mostrará:","a":["Imagen biconvexa que no cruza suturas","Imagen semilunar que cruza suturas","Sangre en las cisternas de la base","Hipodensidad en un territorio arterial"],"ok":0,"why":"Hematoma epidural por lesión de la arteria meníngea media, con intervalo lúcido."},{"q":"Paciente con ojos de mapache y salida de líquido claro por la nariz tras un traumatismo. Está contraindicado:","a":["Colocar una sonda nasogástrica","Colocar un collarín cervical","Hacer una tomografía de cráneo","Administrar oxígeno"],"ok":0,"why":"En la fractura de la base anterior la sonda puede entrar al cráneo; se usa la vía orogástrica."}]},"hombro":{"name":"Cintura escapular","level":"La clavícula es el primer hueso en osificarse","sections":[["Anatomía",["La clavícula une el esternón con el acromion: es la única unión ósea del miembro superior con el tronco.","Manguito rotador: supraespinoso (inicia la abducción), infraespinoso y redondo menor (rotación externa), subescapular (rotación interna)."]],["Correlación clínica ENARM",["Fractura de clavícula: tercio medio; cabestrillo. Es la fractura más frecuente del recién nacido.","Luxación glenohumeral anterior (95 %): signo de la charretera; explorar el nervio axilar (sensibilidad sobre el deltoides).","Luxación posterior: convulsiones o descarga eléctrica.","Escápula alada: lesión del nervio torácico largo (serrato anterior).","Parálisis de Erb-Duchenne (C5–C6): brazo en aducción y rotación interna, «propina del mesero»."]]],"pearl":"Luxación anterior de hombro → explora el nervio axilar antes y después de reducir.","quiz":[{"q":"Nervio que se lesiona con mayor frecuencia en la luxación anterior de hombro:","a":["Axilar","Radial","Musculocutáneo","Torácico largo"],"ok":0,"why":"Rodea el cuello quirúrgico del húmero; da sensibilidad a la piel sobre el deltoides."}]},"humero":{"name":"Húmero y codo","level":"Cuello quirúrgico · surco radial · epicóndilos","sections":[["Nervio en riesgo según el sitio",["Cuello quirúrgico: nervio axilar.","Diáfisis (surco radial): nervio radial → mano caída.","Supracondílea: arteria braquial y nervio mediano.","Epicóndilo medial: nervio cubital → garra cubital."]],["Correlación clínica ENARM",["Fractura supracondílea en extensión: la más frecuente del codo infantil; vigilar el pulso y el síndrome compartimental (contractura de Volkmann).","Codo de niñera: subluxación de la cabeza del radio por tracción; se reduce con supinación y flexión o con hiperpronación.","Epicondilitis lateral: codo de tenista, origen de los extensores."]]],"pearl":"Fractura de la diáfisis del húmero con mano caída = nervio radial.","quiz":[{"q":"Fractura de la diáfisis humeral con incapacidad para extender la muñeca y los dedos. Nervio lesionado:","a":["Radial","Mediano","Cubital","Axilar"],"ok":0,"why":"El radial corre por el surco radial, pegado a la diáfisis."}]},"antebrazo":{"name":"Antebrazo: radio y cúbito","level":"Radio del lado del pulgar · cúbito del lado del meñique","sections":[["Anatomía",["La pronación y la supinación ocurren en las articulaciones radiocubitales; la membrana interósea une ambos huesos.","Pulso radial: lateral al tendón del flexor radial del carpo. Prueba de Allen antes de puncionar la arteria."]],["Fracturas con nombre",["Colles: radio distal con desplazamiento dorsal, «dorso de tenedor»; caída sobre la mano extendida.","Smith: radio distal con desplazamiento palmar.","Monteggia: fractura del cúbito proximal con luxación de la cabeza del radio.","Galeazzi: fractura del radio distal con luxación radiocubital distal."]]],"pearl":"MUGR: Monteggia rompe el cúbito (ulna), Galeazzi rompe el radio.","quiz":[{"q":"Fractura del tercio proximal del cúbito con luxación de la cabeza del radio:","a":["Monteggia","Galeazzi","Colles","Smith"],"ok":0,"why":"Galeazzi es la inversa: radio fracturado y luxación radiocubital distal."}]},"mano":{"name":"Mano y muñeca","level":"8 huesos del carpo · 5 metacarpianos · 14 falanges","sections":[["Anatomía",["Fila proximal: escafoides, semilunar, piramidal y pisiforme. Fila distal: trapecio, trapezoide, grande y ganchoso.","Túnel del carpo: nervio mediano y nueve tendones flexores."]],["Correlación clínica ENARM",["Fractura de escafoides: dolor en la tabaquera anatómica; la radiografía inicial puede ser normal: inmovilizar con férula que incluya el pulgar y repetirla en 10–14 días. Riesgo de necrosis avascular del polo proximal.","Síndrome del túnel del carpo: parestesias nocturnas en los tres primeros dedos; Tinel y Phalen; atrofia tenar tardía.","Fractura del boxeador: cuello del quinto metacarpiano.","Radial: mano caída. Cubital: garra. Mediano: mano del predicador."]]],"pearl":"Dolor en la tabaquera anatómica = fractura de escafoides aunque la radiografía sea normal.","quiz":[{"q":"Caída sobre la mano extendida, dolor en la tabaquera anatómica y radiografía normal. Conducta:","a":["Inmovilizar con férula que incluya el pulgar y repetir la radiografía en 10–14 días","Alta con analgésico","Vendaje elástico y movilización","Cirugía inmediata"],"ok":0,"why":"La fractura puede no verse al inicio y su consolidación está en riesgo por la irrigación retrógrada."}]},"femur":{"name":"Fémur y cadera","level":"La cabeza se irriga por la circunfleja femoral medial","sections":[["Anatomía",["Las arterias retinaculares suben por el cuello hasta la cabeza: una fractura intracapsular puede dejarla sin riego (necrosis avascular)."]],["Correlación clínica ENARM",["Fractura de cadera del anciano: miembro acortado y en rotación externa. Intracapsular desplazada: artroplastia. Intertrocantérica: osteosíntesis. Operar en 24–48 h.","Luxación posterior de cadera (golpe contra el tablero): acortado, en aducción y rotación interna; explorar el nervio ciático.","Fractura de la diáfisis: puede perder más de un litro de sangre; embolia grasa (disnea, confusión, petequias).","En el niño: displasia del desarrollo (Ortolani y Barlow; ultrasonido antes de los 4–6 meses), Legg-Calvé-Perthes (4–8 años) y deslizamiento de la epífisis (adolescente con obesidad)."]]],"pearl":"Acortado y en rotación externa: fractura. Acortado y en rotación interna: luxación posterior.","quiz":[{"q":"Mujer de 82 años que cae de su altura; miembro pélvico acortado y en rotación externa:","a":["Fractura de cadera","Luxación posterior de cadera","Fractura de la diáfisis femoral","Esguince de rodilla"],"ok":0,"why":"La luxación posterior deja el miembro en aducción y rotación interna."},{"q":"Estudio de elección para la displasia del desarrollo de la cadera en un lactante de 2 meses:","a":["Ultrasonido de cadera","Radiografía de pelvis","Tomografía","Resonancia magnética"],"ok":0,"why":"Antes de los 4–6 meses la cabeza femoral aún no está osificada y la radiografía no la muestra."}]},"pierna":{"name":"Rodilla y pierna","level":"El nervio peroneo común rodea el cuello del peroné","sections":[["Anatomía",["Ligamento cruzado anterior: impide que la tibia se desplace hacia delante. El posterior, hacia atrás.","El menisco medial está fijo al ligamento colateral medial, por eso se lesiona más."]],["Correlación clínica ENARM",["Lesión del cruzado anterior: giro con chasquido y derrame inmediato; la prueba de Lachman es la más sensible.","Lesión del peroneo común: pie caído, sin dorsiflexión ni eversión.","Síndrome compartimental (fractura de tibia): dolor desproporcionado que aumenta al estirar de forma pasiva; fasciotomía. La falta de pulso es tardía.","Osgood-Schlatter: dolor en la tuberosidad tibial del adolescente deportista."]]],"pearl":"En el síndrome compartimental el dolor desproporcionado es lo primero; el pulso se pierde al final.","quiz":[{"q":"Fractura de tibia enyesada, dolor intenso que no cede y aumenta al extender de forma pasiva los dedos; pulsos presentes. Conducta:","a":["Retirar el yeso y hacer fasciotomía urgente","Aumentar los analgésicos","Elevar la extremidad y revalorar en 12 h","Solicitar ultrasonido Doppler"],"ok":0,"why":"Es un síndrome compartimental: el diagnóstico es clínico y el pulso presente no lo descarta."}]},"pie":{"name":"Tobillo y pie","level":"7 huesos del tarso · 5 metatarsianos · 14 falanges","sections":[["Anatomía",["El astrágalo no tiene inserciones musculares y su irrigación es precaria.","Pulso pedio: lateral al tendón del extensor largo del dedo gordo. Tibial posterior: detrás del maléolo medial."]],["Correlación clínica ENARM",["Esguince por inversión: ligamento peroneoastragalino anterior.","Reglas de Ottawa: radiografía si hay dolor óseo en el borde posterior o la punta de un maléolo, en la base del quinto metatarsiano o en el navicular, o si no puede dar cuatro pasos.","Fractura de calcáneo por caída de altura: buscar fractura de la columna lumbar.","Pie diabético: neuropatía (monofilamento) más isquemia.","Pie equinovaro congénito: método de Ponseti."]]],"pearl":"Caída de altura con fractura de calcáneo → revisa la columna lumbar.","quiz":[{"q":"Ligamento que se lesiona con mayor frecuencia en el esguince de tobillo por inversión:","a":["Peroneoastragalino anterior","Deltoideo","Peroneocalcáneo","Tibioperoneo posterior"],"ok":0,"why":"Es el más débil del complejo lateral."}]},"frontal":{"name":"Lóbulo frontal","level":"Delante del surco central · arterias cerebral anterior y media","sections":[["Funciones",["Corteza prefrontal: planeación, juicio y conducta.","Área de Broca (giro frontal inferior del hemisferio dominante): expresión del lenguaje. Ese giro no está en este modelo.","Campos oculares frontales: mirada conjugada hacia el lado contrario."]],["Correlación clínica ENARM",["Afasia de Broca: habla no fluente con comprensión conservada.","Lesión hemisférica: los ojos se desvían hacia el lado de la lesión.","Síndrome frontal: desinhibición o apatía y reflejos de liberación.","Infarto de la cerebral anterior: debilidad de la pierna contralateral, abulia e incontinencia."]]],"pearl":"Broca: habla rota pero entiende. En la lesión hemisférica, los ojos miran hacia la lesión.","quiz":[{"q":"Paciente que entiende órdenes pero habla con esfuerzo, con frases cortas y sin fluidez:","a":["Afasia de Broca","Afasia de Wernicke","Afasia de conducción","Disartria"],"ok":0,"why":"Lesión del giro frontal inferior dominante, territorio de la división superior de la cerebral media."}]},"motora":{"name":"Corteza motora y somatosensorial","level":"Giro precentral (área 4) y poscentral (áreas 3, 1, 2)","sections":[["Homúnculo",["Cara y mano en la convexidad lateral: arteria cerebral media.","Pierna y pie en la cara medial: arteria cerebral anterior.","La vía corticoespinal baja por el brazo posterior de la cápsula interna y se cruza en el bulbo."]],["Correlación clínica ENARM",["Infarto de la cerebral media: hemiparesia e hipoestesia contralaterales de predominio en cara y brazo; afasia si es el hemisferio dominante, negligencia si no lo es.","Motoneurona superior: espasticidad, hiperreflexia y Babinski. Inferior: flacidez, atrofia y fasciculaciones.","Crisis focal motora con marcha jacksoniana y parálisis de Todd posterior."]]],"pearl":"Cara y brazo = cerebral media. Pierna = cerebral anterior.","quiz":[{"q":"Hemiparesia derecha que predomina en la pierna, con abulia e incontinencia urinaria. Arteria afectada:","a":["Cerebral anterior izquierda","Cerebral media izquierda","Cerebral posterior izquierda","Basilar"],"ok":0,"why":"La pierna se representa en la cara medial del hemisferio."},{"q":"Hiperreflexia, espasticidad y signo de Babinski indican lesión de:","a":["Motoneurona superior","Motoneurona inferior","Unión neuromuscular","Músculo"],"ok":0,"why":"La motoneurona inferior produce flacidez, atrofia y fasciculaciones."}]},"parietal":{"name":"Lóbulo parietal","level":"Detrás del surco central","sections":[["Funciones",["Integra la sensibilidad y el esquema corporal. El no dominante dirige la atención al espacio; el dominante, el cálculo y la escritura."]],["Correlación clínica ENARM",["Negligencia del lado izquierdo: lesión parietal derecha.","Síndrome de Gerstmann (giro angular dominante): agrafia, acalculia, agnosia digital y confusión derecha-izquierda.","Cuadrantanopsia inferior contralateral: radiaciones ópticas superiores.","Astereognosia y apraxia."]]],"pearl":"El paciente que ignora su lado izquierdo tiene dañado el parietal derecho.","quiz":[{"q":"Agrafia, acalculia, agnosia digital y confusión derecha-izquierda:","a":["Síndrome de Gerstmann","Síndrome de Balint","Síndrome de Anton","Síndrome de Klüver-Bucy"],"ok":0,"why":"Lesión del giro angular del hemisferio dominante."}]},"temporal":{"name":"Lóbulo temporal y sistema límbico","level":"Bajo la cisura de Silvio","sections":[["Funciones",["Corteza auditiva primaria. Área de Wernicke (giro temporal superior posterior, dominante): comprensión del lenguaje.","Hipocampo: memoria reciente. Amígdala: miedo y emoción. Ínsula y cíngulo completan el sistema límbico."]],["Correlación clínica ENARM",["Afasia de Wernicke: habla fluida sin sentido y sin comprensión.","Epilepsia del lóbulo temporal: aura epigástrica, desconexión y automatismos.","Encefalitis herpética: afecta el temporal; aciclovir intravenoso sin esperar la PCR.","Herniación del uncus: midriasis del mismo lado por compresión del III par.","Cuadrantanopsia superior contralateral: asa de Meyer.","Enfermedad de Alzheimer: atrofia del hipocampo."]]],"pearl":"Wernicke: habla mucho, no dice nada y no entiende.","quiz":[{"q":"Fiebre, confusión y crisis convulsivas; la resonancia muestra lesión temporal. Tratamiento inmediato:","a":["Aciclovir intravenoso","Ceftriaxona sola","Esperar el resultado de la PCR","Esteroides"],"ok":0,"why":"La encefalitis por herpes simple tipo 1 se trata de forma empírica: el retraso empeora el pronóstico."},{"q":"Traumatismo craneal con midriasis derecha y deterioro del estado de alerta:","a":["Herniación del uncus derecho","Lesión del nervio óptico","Síndrome de Horner","Herniación de las amígdalas cerebelosas"],"ok":0,"why":"El uncus comprime el III par del mismo lado contra el borde del tentorio."}]},"occipital":{"name":"Lóbulo occipital","level":"Corteza visual primaria en la cisura calcarina · arteria cerebral posterior","sections":[["Correlación clínica ENARM",["Infarto de la cerebral posterior: hemianopsia homónima contralateral con respeto macular.","Ceguera cortical (lesión bilateral): no ve, pero los reflejos pupilares están conservados.","Síndrome de Anton: niega su ceguera.","Aura visual de la migraña."]]],"pearl":"Hemianopsia homónima con respeto macular = arteria cerebral posterior.","quiz":[{"q":"Paciente que no ve, con pupilas reactivas y fondo de ojo normal:","a":["Ceguera cortical por lesión occipital bilateral","Neuritis óptica bilateral","Glaucoma agudo","Compresión del quiasma"],"ok":0,"why":"El reflejo fotomotor no pasa por la corteza: va del nervio óptico al mesencéfalo."}]},"capsula":{"name":"Sustancia blanca y cápsula interna","level":"La cápsula interna pasa entre el tálamo y el núcleo lenticular","sections":[["Anatomía",["Brazo anterior, rodilla (fibras corticobulbares) y brazo posterior (corticoespinal y sensitivas). El modelo muestra el brazo anterior.","La irrigan las arterias lenticuloestriadas, ramas perforantes de la cerebral media.","El cuerpo calloso une los dos hemisferios."]],["Correlación clínica ENARM",["Infartos lacunares por hipertensión y diabetes: motor puro (brazo posterior de la cápsula o base del puente), sensitivo puro (tálamo), hemiparesia atáxica y disartria-mano torpe.","Hemorragia hipertensiva: putamen y cápsula (la más frecuente), tálamo, puente y cerebelo.","Esclerosis múltiple: placas periventriculares perpendiculares a los ventrículos; el brote se trata con metilprednisolona."]]],"pearl":"Hemiparesia motora pura sin signos corticales = infarto lacunar en la cápsula interna.","quiz":[{"q":"Hipertenso con hemiparesia derecha pura de cara, brazo y pierna, sin afasia ni déficit sensitivo:","a":["Infarto lacunar en el brazo posterior de la cápsula interna","Infarto cortical de la cerebral media","Infarto de la cerebral posterior","Lesión medular"],"ok":0,"why":"La falta de afasia, negligencia o déficit visual descarta la corteza."}]},"basales":{"name":"Ganglios basales","level":"Caudado + putamen = estriado · putamen + globo pálido = lenticular","sections":[["Función",["Modulan el movimiento: la vía directa lo facilita y la indirecta lo frena; la dopamina de la sustancia negra favorece el movimiento."]],["Correlación clínica ENARM",["Enfermedad de Parkinson: pérdida de neuronas dopaminérgicas de la sustancia negra; bradicinesia más temblor de reposo o rigidez; levodopa con carbidopa.","Enfermedad de Huntington: atrofia del caudado, repeticiones CAG, herencia autosómica dominante; corea y demencia.","Hemibalismo: lesión del núcleo subtalámico contralateral.","Enfermedad de Wilson: degeneración hepatolenticular y anillo de Kayser-Fleischer.","Kernícterus: bilirrubina depositada en los ganglios basales."]]],"pearl":"Movimientos amplios y violentos de medio cuerpo = núcleo subtalámico del lado contrario.","quiz":[{"q":"Hombre de 40 años con corea y demencia; su padre tuvo lo mismo. Estructura atrofiada:","a":["Núcleo caudado","Sustancia negra","Núcleo subtalámico","Cerebelo"],"ok":0,"why":"Enfermedad de Huntington: la atrofia del caudado agranda las astas frontales de los ventrículos laterales."}]},"talamo":{"name":"Tálamo e hipotálamo","level":"A los lados del tercer ventrículo","sections":[["Función",["Tálamo: relevo de todas las vías sensitivas menos el olfato. VPL (cuerpo), VPM (cara), geniculado lateral (visión) y medial (audición).","Hipotálamo: temperatura, hambre, sed, ritmo circadiano y control de la hipófisis; produce ADH y oxitocina."]],["Correlación clínica ENARM",["Síndrome talámico: pérdida de la sensibilidad contralateral y después dolor.","Diabetes insípida central: poliuria hipotónica que responde a la desmopresina.","Secreción inadecuada de ADH: hiponatremia con volumen normal.","Encefalopatía de Wernicke: oftalmoplejía, ataxia y confusión; tiamina antes que glucosa."]]],"pearl":"Todo lo sensitivo pasa por el tálamo, menos el olfato.","quiz":[{"q":"Alcohólico con confusión, ataxia y oftalmoplejía. Antes de la solución glucosada debe recibir:","a":["Tiamina","Ácido fólico","Vitamina B12","Naloxona"],"ok":0,"why":"La glucosa sin tiamina puede precipitar o agravar la encefalopatía de Wernicke."}]},"ventriculos":{"name":"Sistema ventricular y líquido cefalorraquídeo","level":"150 mL en total · se producen unos 500 mL al día","sections":[["Circulación",["Plexos coroideos → ventrículos laterales → agujeros de Monro → tercer ventrículo → acueducto de Silvio → cuarto ventrículo → agujeros de Luschka y Magendie → espacio subaracnoideo → granulaciones aracnoideas."]],["Correlación clínica ENARM",["Hidrocefalia obstructiva: estenosis del acueducto o tumores. Comunicante: tras meningitis o hemorragia subaracnoidea.","Hidrocefalia normotensa: alteración de la marcha, demencia e incontinencia.","Punción lumbar en L3–L4 o L4–L5; antes, descartar datos de masa o herniación.","Líquido bacteriano: polimorfonucleares, glucosa baja y proteínas altas. Viral: linfocitos y glucosa normal.","Meningitis bacteriana del adulto: ceftriaxona y vancomicina, con dexametasona; añadir ampicilina después de los 50 años o con inmunocompromiso."]]],"pearl":"Marcha magnética, demencia e incontinencia = hidrocefalia normotensa.","quiz":[{"q":"Líquido cefalorraquídeo turbio con 2 000 leucocitos (90 % polimorfonucleares), glucosa de 18 mg/dL y proteínas de 250 mg/dL:","a":["Meningitis bacteriana","Meningitis viral","Meningitis tuberculosa","Síndrome de Guillain-Barré"],"ok":0,"why":"Predominio de neutrófilos con glucosa baja y proteínas altas."},{"q":"Anciano con marcha de pasos cortos, deterioro cognitivo e incontinencia urinaria; ventrículos dilatados:","a":["Hidrocefalia normotensa","Enfermedad de Parkinson","Enfermedad de Alzheimer","Demencia vascular"],"ok":0,"why":"La punción evacuadora que mejora la marcha apoya el diagnóstico y predice la respuesta a la derivación."}]},"cerebelo":{"name":"Cerebelo","level":"Fosa posterior · arterias cerebelosas superior, anteroinferior y posteroinferior","sections":[["Función",["Coordina el movimiento del mismo lado, el equilibrio y el tono. Vermis: tronco y marcha. Hemisferios: extremidades."]],["Correlación clínica ENARM",["Síndrome cerebeloso: ataxia, dismetría, disdiadococinesia, temblor de intención y nistagmo, del mismo lado de la lesión.","Alcoholismo crónico: atrofia del vermis con ataxia de la marcha.","Infarto o hemorragia cerebelosa: puede comprimir el tronco y causar hidrocefalia; valorar descompresión.","Tumores de fosa posterior en el niño: meduloblastoma (vermis) y astrocitoma pilocítico."]]],"pearl":"El cerebelo falla del mismo lado: lesión derecha, dismetría derecha.","quiz":[{"q":"Lesión del hemisferio cerebeloso derecho. Se espera:","a":["Dismetría y temblor de intención en las extremidades derechas","Hemiparesia izquierda","Dismetría izquierda","Afasia"],"ok":0,"why":"Las vías cerebelosas se cruzan dos veces, así que el déficit es ipsilateral."}]},"tronco":{"name":"Tronco encefálico","level":"Mesencéfalo (III, IV) · puente (V–VIII) · bulbo (IX–XII)","sections":[["Anatomía",["Los pares craneales III y IV salen del mesencéfalo; del V al VIII, del puente; del IX al XII, del bulbo.","En el bulbo están los centros respiratorio y cardiovascular y se cruzan las pirámides."]],["Correlación clínica ENARM",["Síndromes alternos: par craneal de un lado y hemiparesia del otro.","Weber (mesencéfalo): parálisis del III par y hemiparesia contralateral.","Wallenberg (arteria cerebelosa posteroinferior, bulbo lateral): pérdida de dolor y temperatura en la cara del mismo lado y en el cuerpo del contrario, disfagia, ronquera, Horner y ataxia; sin debilidad.","Hemorragia del puente: coma con pupilas puntiformes.","Síndrome de enclaustramiento: base del puente, arteria basilar."]]],"pearl":"Par craneal de un lado y hemiparesia del otro = la lesión está en el tronco.","quiz":[{"q":"Vértigo, disfagia, ronquera, Horner derecho y pérdida l.","Asa de Meyer (temporal): cuadrantanopsia superior. Radiación parietal: cuadrantanopsia inferior.","Occipital: hemianopsia homónima con respeto macular."]],["Correlación clínica ENARM",["Reflejo fotomotor: entra por el II par y sale por el III.","Defecto pupilar aferente: neuritis óptica (esclerosis múltiple).","Glaucoma agudo de ángulo cerrado: ojo rojo y doloroso, pupila en midriasis media fija y córnea turbia.","Oclusión de la arteria central de la retina: pérdida súbita e indolora, mancha rojo cereza.","Desprendimiento de retina: destellos, moscas volantes y una cortina."]]],"pearl":"Detrás del quiasma los defectos son homónimos y del lado contrario a la lesión.","quiz":[{"q":"Pérdida súbita e indolora de la visión de un ojo con mancha rojo cereza en la mácula:","a":["Oclusión de la arteria central de la retina","Desprendimiento de retina","Glaucoma agudo","Neuritis óptica"],"ok":0,"why":"La fóvea conserva su color por la coroides mientras el resto de la retina palidece."}]}},"processes":[{"id":"ciclo","title":"Ciclo cardiaco","blurb":"Un latido en cámara lenta, fase por fase.","hue":"#e5484d","glyph":"heart","monitor":true,"vitals":{"hr":72},"base":{"only":["corazon","valvulas","cor-izq","cor-da","cor-cx","cor-der","venas-cardiacas","aorta","vcs","vci"],"focus":"corazon","zoom":7.3,"turn":-0.3},"steps":[{"title":"Llenado ventricular","phase":"llenado","chart":true,"slow":0.3,"text":"Las válvulas mitral y tricúspide están abiertas y la sangre cae de las aurículas a los ventrículos. \u003cb>Tres cuartas partes del llenado son pasivas\u003c/b>: ocurren antes de que la aurícula se contraiga. Fíjate en el plano de las válvulas: sube mientras los ventrículos se relajan.","facts":[["70–80 %","del llenado es pasivo"],["120 mL","volumen al final de la diástole"]],"scene":{"pins":[{"at":"@av","text":"Plano de las válvulas"}]}},{"title":"Sístole auricular","phase":"auricular","chart":true,"slow":0.3,"text":"La onda P dispara las aurículas, que empujan el último 20–30 cor-da","cor-cx","cor-der","venas-cardiacas","aorta","vcs","vci","art-pulmonar"],"ghost":{"art-pulmonar":0.5},"pins":[{"at":"art-pulmonar@0.02","text":"Válvula pulmonar"}]}},{"title":"El gasto cardiaco","chart":true,"slow":0.6,"text":"Gasto cardiaco = frecuencia × volumen sistólico: unos 5 litros por minuto en reposo. El volumen sistólico depende de la \u003cb>precarga\u003c/b> (cuánto se llena), la \u003cb>poscarga\u003c/b> (contra qué presión expulsa) y la \u003cb>contractilidad\u003c/b>. Enciende el sonido del monitor para oír S1 y S2.","facts":[["5 L/min","gasto en reposo"],["Frank-Starling","más llenado, más fuerza"]]}]},{"id":"conduccion","title":"Conducción eléctrica","blurb":"Del nodo sinusal al QRS, sobre el corazón.","hue":"#f5a524","glyph":"flow","monitor":true,"vitals":{"hr":68},"base":{"only":["corazon","cor-izq","cor-da","cor-cx","cor-der","venas-cardiacas","aorta","vcs","vci"],"focus":"corazon","zoom":7.5,"turn":-0.35},"steps":[{"title":"Nodo sinusal","anim":"conduccion","slow":0.2,"text":"El impulso nace en el nodo sinusal, donde la vena cava superior se une a la aurícula derecha. Es el marcapasos porque sus células se despolarizan solas más rápido que las demás.","facts":[["60–100/min","frecuencia propia"],["60 %","lo irriga la coronaria derecha"]],"scene":{"pins":[{"at":"@sa","text":"Nodo sinusal","side":"left"}]}},{"title":"Aurículas: la onda P","anim":"conduccion","slow":0.2,"text":"La onda dorada recorre las aurículas de derecha a izquierda. En el ECG es la onda P; después las aurículas se contraen y terminan de llenar los ventrículos.","facts":[["\u003c 0.12 s","duración de la onda P"]],"scene":{"pins":[{"at":"@sa","text":"Nodo sinusal","side":"left"}]}},{"title":"Nodo AV: la pausa","anim":"conduccion","slow":0.2,"text":"El nodo auriculoventricular retrasa el impulso una décima de segundo. Esa pausa es el segmento PR y da tiempo a que los ventrículos se llenen. También filtra: en la fibrilación auricular impide que pasen 400 impulsos por minuto.","facts":[["0.12–0.20 s","intervalo PR normal"],["80–90 %","lo irriga la coronaria derecha"]],"scene":{"pins":[{"at":"@av","text":"Nodo AV"}]}},{"title":"His y Purkinje: el QRS","anim":"conduccion","slow":0.2,"text":"El haz de His se divide en dos ramas y la red de Purkinje activa los ventrículos en menos de 0.12 s: primero el septum, luego la punta y al final las bases. Por eso la contracción exprime la sangre hacia las válvulas de salida.","facts":[["\u003c 0.12 s","QRS normal"],["Punta → base","orden de activación"]],"scene":{"pins":[{"at":"@apex","text":"Punta del corazón"}]}},{"title":"Repolarización: la onda T","anim":"conduccion","slow":0.2,"text":"Los ventrículos se recargan: es el segmento ST y la onda T (el resplandor azul). El intervalo QT mide toda la actividad eléctrica ventricular; si se alarga, hay riesgo de taquicardia helicoidal.","facts":[["QTc \u003c 450 ms","límite en hombres"],["QTc \u003c 460 ms","límite en mujeres"]]},{"title":"Cuando la conducción falla","slow":0.5,"vitals":{"rhythm":"bav3","hr":38,"sys":98,"dia":56},"text":"\u003cb>Primer grado:\u003c/b> PR mayor de 0.20 s; todas las P conducen. \u003cb>Mobitz I:\u003c/b> el PR se alarga hasta que una P no conduce. \u003cb>Mobitz II:\u003c/b> una P no conduce sin aviso; necesita marcapasos. \u003cb>Tercer grado\u003c/b>, el del monitor: las P y los QRS van cada uno por su lado.","facts":[["Mobitz II y 3.er grado","marcapasos"],["Atropina","primera línea si hay síntomas"]]}]},{"id":"circulacion","title":"Circulación","blurb":"El viaje de la sangre: mayor, menor y porta.","hue":"#3e63dd","glyph":"turn","monitor":true,"base":{"only":["corazon","cor-izq","cor-da","cor-cx","cor-der","venas-cardiacas","aorta","art-pulmonar","ven-pulmonares","vcs","vci","aorta","carotidas","subclavias","tronco-celiaco","mesentericas","art-renales","art-iliacas","vcs","vci","yugulares","ven-renales","ven-iliacas","porta","pulmon-der-sup","pulmon-der-med","pulmon-der-inf","pulmon-izq-sup","pulmon-izq-inf","higado","rinon-der","rinon-izq","bazo"],"ghost":{"pulmon-der-sup":0.3,"pulmon-der-med":0.3,"pulmon-der-inf":0.3,"pulmon-izq-sup":0.3,"pulmon-izq-inf":0.3,"higado":0.45},"focus":[0,0,1170],"zoom":3.6,"turn":-0.2},"steps":[{"title":"Retorno venoso","text":"La sangre que ya dejó su oxígeno en los tejidos regresa por las venas cavas a la aurícula derecha. Las venas guardan dos tercios de toda la sangre: son el reservorio del que el corazón echa mano.","facts":[["65 %","de la sangre está en las venas"],["2–8 mmHg","presión venosa central"]],"scene":{"fx":{"vcs":{"streak":[-170,0.6]},"vci":{"streak":[-170,0.6]},"yugulares":{"streak":[-170,0.6]},"ven-renales":{"streak":[-170,0.6]},"ven-iliacas":{"streak":[-170,0.6]}},"pins":[{"at":"vcs","text":"Cava superior","side":"left"},{"at":"vci@0.5","text":"Cava inferior","side":"left"}]}},{"title":"Al pulmón por la arteria pulmonar","text":"El ventrículo derecho la impulsa por la arteria pulmonar: la única arteria que lleva sangre pobre en oxígeno, por eso es azul. Trabaja a baja presión, una sexta parte de la del lado izquierdo.","facts":[["25/10 mmHg","presión pulmonar"],["5 L/min","igual que el lado izquierdo"]],"scene":{"focus":[0,0,1260],"zoom":4.9,"fx":{"art-pulmonar":{"streak":[230,0.65]}},"pins":[{"at":"art-pulmonar@0.1","text":"Tronco pulmonar"}]}},{"title":"Hematosis y regreso","text":"En los capilares que envuelven a los alvéolos la sangre suelta CO₂ y toma O₂ en un cuarto de segundo. Vuelve roja a la aurícula izquierda por las venas pulmonares.","facts":[["0.25 s","basta para oxigenarla"],["4","venas pulmonares"]],"scene":{"focus":[0,0,1260],"zoom":4.9,"fx":{"ven-pulmonares":{"streak":[-190,0.65]},"pulmon-der-sup":{"tint":["oxigenada",0.16]},"pulmon-der-med":{"tint":["oxigenada",0.16]},"pulmon-der-inf":{"tint":["oxigenada",0.16]},"pulmon-izq-sup":{"tint":["oxigenada",0.16]},"pulmon-izq-inf":{"tint":["oxigenada",0.16]}},"pins":[{"at":"@la","text":"Aurícula izquierda"}]}},{"title":"La aorta reparte","text":"El ventrículo izquierd
