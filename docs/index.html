":{"streak":[-90,0.7]}},"pins":[{"at":"porta@0.1","text":"Hacia la porta"},{"at":"bazo","text":"Bazo"}]}}]},{"id":"respiracion","title":"Respiración","blurb":"Diafragma, aire, alvéolos y quién manda.","hue":"#22a8c9","glyph":"body","monitor":true,"vitals":{"rr":12,"depth":1.5},"base":{"only":["pulmon-der-sup","pulmon-der-med","pulmon-der-inf","pulmon-izq-sup","pulmon-izq-inf","traquea","bronquios","diafragma","laringe","costillas","cartilagos","esternon"],"ghost":{"costillas":0.24,"cartilagos":0.24,"esternon":0.24},"focus":[0,0,1265],"zoom":4.2,"turn":-0.25},"steps":[{"title":"Inspiración","text":"El diafragma se contrae y sus cúpulas bajan; las costillas suben y se abren. El tórax crece, la presión dentro de los alvéolos cae por debajo de la atmosférica y el aire entra. Es trabajo muscular.","facts":[["C3–C5","nervio frénico"],["500 mL","volumen corriente"],["−1 cmH₂O","presión alveolar"]],"scene":{"pins":[{"at":"diafragma","text":"Diafragma"}]}},{"title":"Espiración","text":"En reposo es pasiva: el diafragma se relaja y la elasticidad del pulmón lo regresa a su tamaño. Solo al toser o en el ejercicio empujan los músculos abdominales. En el asma y la EPOC lo difícil es sacar el aire: mira cómo se alarga la salida.","facts":[["Pasiva","en reposo"],["FEV1/FVC \u003c 0.70","obstrucción"]],"vitals":{"pattern":"obstructivo","rr":12,"depth":1.5}},{"title":"El árbol bronquial","text":"La tráquea se divide en la carina, a la altura de T4–T5. Hasta los bronquiolos terminales solo se conduce aire: es el espacio muerto anatómico. El bronquio derecho es más corto, ancho y vertical: ahí caen los cuerpos extraños.","facts":[["150 mL","espacio muerto anatómico"],["23","generaciones de vías aéreas"]],"scene":{"ghost":{"costillas":0.12,"cartilagos":0.12,"esternon":0.12,"pulmon-der-sup":0.22,"pulmon-der-med":0.22,"pulmon-der-inf":0.22,"pulmon-izq-sup":0.22,"pulmon-izq-inf":0.22},"fx":{"traquea":{"streak":[170,0.6]},"bronquios":{"streak":[170,0.6]}},"pins":[{"at":"bronquios@0.03","text":"Carina"}]}},{"title":"Intercambio de gases","text":"Cada alvéolo está envuelto en capilares. El O₂ pasa a la sangre y el CO₂ sale por difusión, a través de una membrana de media micra. La sangre llega azul por la arteria pulmonar y sale roja por las venas pulmonares.","facts":[["80–100 mmHg","PaO₂"],["35–45 mmHg","PaCO₂"],["0.5 µm","membrana alveolocapilar"]],"scene":{"only":["pulmon-der-sup","pulmon-der-med","pulmon-der-inf","pulmon-izq-sup","pulmon-izq-inf","traquea","bronquios","art-pulmonar","ven-pulmonares","corazon"],"ghost":{"pulmon-der-sup":0.26,"pulmon-der-med":0.26,"pulmon-der-inf":0.26,"pulmon-izq-sup":0.26,"pulmon-izq-inf":0.26},"fx":{"art-pulmonar":{"streak":[200,0.6]},"ven-pulmonares":{"streak":[-170,0.6]}},"pins":[{"at":"art-pulmonar@0.5","text":"Llega sin oxígeno"},{"at":"ven-pulmonares@0.4","text":"Sale oxigenada","side":"left"}]}},{"title":"Ventilación y perfusión","text":"De pie, las bases reciben más aire y mucha más sangre que los vértices. Si un alvéolo se perfunde pero no se ventila hay \u003cb>cortocircuito\u003c/b> (neumonía, atelectasia). Si se ventila pero no se perfunde hay \u003cb>espacio muerto\u003c/b> (tromboembolia).","facts":[["V/Q ≈ 3","en los vértices"],["V/Q ≈ 0.6","en las bases"]],"scene":{"only":["pulmon-der-sup","pulmon-der-med","pulmon-der-inf","pulmon-izq-sup","pulmon-izq-inf","traquea","bronquios"],"ghost":{},"fx":{"pulmon-der-inf":{"tint":["desoxigenada",0.3]},"pulmon-izq-inf":{"tint":["desoxigenada",0.3]},"pulmon-der-sup":{"tint":["aire",0.34]},"pulmon-izq-sup":{"tint":["aire",0.34]}},"pins":[{"at":"pulmon-der-sup","text":"Más aire que sangre","side":"left"},{"at":"pulmon-izq-inf","text":"Más sangre que aire"}]}},{"title":"Quién marca el ritmo","text":"El centro respiratorio está en el bulbo. Los quimiorreceptores centrales responden al CO₂, por el pH del líquido cefalorraquídeo; los del cuerpo carotídeo, a la falta de oxígeno cuando la PaO₂ baja de 60 mmHg.","facts":[["CO₂","estímulo principal"],["PaO₂ \u003c 60","despierta al cuerpo carotídeo"]],"scene":{"only":["pulmon-der-sup","pulmon-der-med","pulmon-der-inf","pulmon-izq-sup","pulmon-izq-inf","traquea","bronquios","diafragma","tronco","cerebelo","carotidas","aorta","laringe"],"ghost":{"pulmon-der-sup":0.5,"pulmon-der-med":0.5,"pulmon-der-inf":0.5,"pulmon-izq-sup":0.5,"pulmon-izq-inf":0.5},"focus":[0,0,1400],"zoom":3.9,"pins":[{"at":"tronco","text":"Centro respiratorio"},{"at":"carotidas@0.95","text":"Cuerpo carotídeo","side":"left"}]}}]},{"id":"digestion","title":"Digestión","blurb":"Sigue un bocado desde el esófago hasta el colon.","hue":"#e08a3c","glyph":"pin","monitor":false,"base":{"only":["esofago","estomago","duodeno","yeyuno","ileon","colon","apendice","recto","higado","vesicula","pancreas"],"ghost":{"higado":0.5},"focus":[0,0,1090],"zoom":4.2,"turn":-0.1},"steps":[{"title":"Deglución y esófago","anim":"bolo","bolo":[0,262,5],"text":"Al tragar, una onda peristáltica lleva el bolo por el esófago en unos ocho segundos y el esfínter esofágico inferior se relaja para dejarlo pasar. Si no se relaja es acalasia; si queda flojo, reflujo.","facts":[["25 cm","longitud del esófago"],["T10","hiato esofágico"]],"scene":{"focus":"esofago","zoom":4.8,"ghost":{"higado":0.25}}},{"title":"Estómago","anim":"bolo","bolo":[258,426,7],"text":"El estómago guarda, mezcla y tritura. Las células parietales secretan ácido clorhídrico y factor intrínseco; las principales, pepsinógeno. La gastrina, la histamina y el vago estimulan el ácido.","facts":[["pH 1–2","jugo gástrico"],["2–4 h","vaciamiento de una comida"]],"scene":{"focus":"estomago","zoom":5.8,"ghost":{"higado":0.25},"fx":{"estomago":{"wave":[16,120,2.6,1]}}}},{"title":"Duodeno: bilis y jugo pancreático","anim":"bolo","bolo":[406,610,7],"text":"La grasa y los aminoácidos liberan colecistocinina: la vesícula se contrae y el páncreas vierte sus enzimas. El ácido libera secretina y el páncreas responde con bicarbonato. Todo entra por la ampolla de Vater.","facts":[["CCK","contrae la vesícula"],["Secretina","bicarbonato pancreático"]],"scene":{"focus":"duodeno","zoom":6.1,"ghost":{"higado":0.3,"estomago":0.3},"fx":{"vesicula":{"tint":["bilis",0.45]},"pancreas":{"tint":["alimento",0.3]}},"pins":[{"at":"vesicula","text":"Bilis","side":"left"},{"at":"pancreas","text":"Enzimas y bicarbonato"}]}},{"title":"Yeyuno e íleon: absorción","anim":"bolo","bolo":[580,1105,12],"text":"Seis metros de pliegues y vellosidades absorben casi todo. \u003cb>Hierro en el duodeno, folato en el yeyuno, vitamina B12 y sales biliares en el íleon terminal.\u003c/b>","facts":[["9 L al día","líquido que entra al intestino"],["3–5 h","tránsito del intestino delgado"]],"scene":{"focus":[0,-20,1010],"zoom":5.1,"only":["esofago","estomago","duodeno","yeyuno","ileon","colon","apendice","recto"],"pins":[{"at":"yeyuno","text":"Yeyuno: folato"},{"at":"ileon","text":"Íleon: B12","side":"left"}]}},{"title":"Hígado: el primer paso","text":"Lo absorbido viaja por la vena porta al hígado antes de llegar al resto del cuerpo. Las grasas van por otro camino: entran a los linfáticos como quilomicrones.","facts":[["1.5 kg","peso del hígado"],["Bilis","0.5–1 L al día"]],"scene":{"only":["esofago","estomago","duodeno","yeyuno","ileon","colon","apendice","recto","higado","vesicula","pancreas","porta","bazo"],"ghost":{"estomago":0.35},"focus":"higado","zoom":5.1,"fx":{"porta":{"streak":[-90,0.7]}},"pins":[{"at":"porta@0.1","text":"Vena porta"}]}},{"title":"Colon","anim":"bolo","bolo":[1112,1850,14],"text":"El colon recupera agua y electrolitos y aloja a la microbiota. Lo que llega líquido al ciego sale formado: de litro y medio que entra, se pierden unos 100 mL.","facts":[["12–48 h","tránsito del colon"],["Ángulo esplénico","frontera entre mesentéricas"]],"scene":{"only":["esofago","estomago","duodeno","yeyuno","ileon","colon","apendice","recto"],"ghost":{"yeyuno":0.3,"ileon":0.3},"focus":"colon","zoom":4.4,"pins":[{"at":"colon@0.02","text":"Ciego","side":"left"},{"at":"colon@0.5","text":"Ángulo esplénico"}]}}]},{"id":"orina","title":"Formación de orina","blurb":"Del filtrado glomerular a la micción.","hue":"#c9a227","glyph":"info","monitor":false,"base":{"only":["rinon-der","rinon-izq","suprarrenales","ureteres","vejiga","prostata","aorta","art-renales","vci","ven-renales","art-iliacas","ven-iliacas"],"focus":[0,0,1010],"zoom":4.2,"turn":-0.15},"steps":[{"title":"Los riñones filtran el plasma","text":"Reciben la quinta parte del gasto cardiaco y filtran unos 125 mL de plasma por minuto: 180 litros al día, de los que se orina menos de 1 %.","facts":[["20–25 %","del gasto cardiaco"],["125 mL/min","filtrado glomerular"],["180 L al día","filtrado"]],"scene":{"fx":{"art-renales":{"streak":[200,0.7]},"ven-renales":{"streak":[-150,0.6]}},"pins":[{"at":"art-renales","text":"Arterias renales"}]}},{"title":"La nefrona, tramo por tramo","text":"\u003cb>Glomérulo:\u003c/b> filtra por presión. \u003cb>Túbulo proximal:\u003c/b> recupera dos tercios del sodio y el agua y toda la glucosa. \u003cb>Asa de Henle:\u003c/b> concentra la médula; ahí actúa la furosemida. \u003cb>Túbulo distal:\u003c/b> sitio de las tiazidas. \u003cb>Colector:\u003c/b> la aldosterona ahorra sodio y la ADH abre canales de agua.","facts":[["1 millón","de nefronas por riñón"],["180 mg/dL","umbral renal de la glucosa"]],"scene":{"focus":"rinon-izq","zoom":7.5,"select":"rinon-izq"}},{"title":"Uréteres","anim":"orina","text":"La orina baja por ondas peristálticas, no por gravedad. Hay tres sitios estrechos donde se atoran los cálculos: la unión con la pelvis renal, el cruce sobre los vasos ilíacos y la entrada a la vejiga, que es el más estrecho.","facts":[["25–30 cm","longitud"],["1–5 por minuto","ondas peristálticas"]],"scene":{"fx":{"ureteres":{"tint":["orina",0.4]}},"pins":[{"at":"ureteres@0.04/left ureter","text":"Unión pieloureteral"},{"at":"ureteres@0.62/left ureter","text":"Cruce ilíaco"},{"at":"ureteres@0.97/left ureter","text":"Entrada a la vejiga"}]}},{"title":"Vejiga y micción","text":"La vejiga se llena a baja presión hasta unos 400 mL. Para vaciarla, el parasimpático sacro contrae el detrusor y los esfínteres se relajan. El simpático hace lo contrario: guarda.","facts":[["400–500 mL","capacidad"],["S2–S4","reflejo de la micción"]],"scene":{"focus":"vejiga","zoom":6.8,"fx":{"vejiga":{"swell":4.5,"tint":["orina",0.35]}},"pins":[{"at":"vejiga","text":"Detrusor"}]}},{"title":"Quién regula","text":"Si baja la perfusión renal, la renina activa a la angiotensina II, que cierra la arteriola de salida, y a la aldosterona. Las prostaglandinas mantienen abierta la de entrada. Por eso un antiinflamatorio junto con un IECA y un diurético puede desplomar el filtrado.","facts":[["Renina","la libera el aparato yuxtaglomerular"],["Aldosterona","corteza suprarrenal"]],"scene":{"fx":{"suprarrenales":{"tint":["electrico",0.55]}},"pins":[{"at":"suprarrenales","text":"Aldosterona"}]}}]}],"cases":[{"id":"iam","title":"Dolor torácico opresivo","area":"Cardiología","hue":"#e5484d","glyph":"heart","level":2,"organs":["coronarias","corazon"],"patient":"Hombre de 58 años · diabético, hipertenso y fumador","base":{"only":["corazon","cor-izq","cor-da","cor-cx","cor-der","venas-cardiacas","aorta","vcs","vci"],"focus":"corazon","zoom":7.1,"turn":-0.6},"intro":{"text":"Llega a urgencias con dolor retroesternal opresivo de 40 minutos, irradiado a la mandíbula, con sudoración fría y náusea. El electrocardiograma muestra elevación del ST en DII, DIII y aVF.","exam":["Pálido y diaforético","Ruidos cardiacos rítmicos, sin soplos","Campos pulmonares limpios"],"vitals":{"hr":54,"sys":98,"dia":60,"rr":20,"spo2":95,"st":0.34}},"nodes":[{"q":"¿Qué arteria está ocluida con mayor probabilidad?","options":["Coronaria derecha","Descendente anterior","Circunfleja","Tronco coronario izquierdo"],"ok":0,"why":"La cara inferior depende de la coronaria derecha en más de 80 % de las personas. Esa arteria también irriga los nodos sinusal y AV: por eso está bradicárdico."},{"title":"Qué está pasando","text":"Una placa de ateroma se rompió dentro de la coronaria derecha y sobre ella se formó un trombo que \u003cb>tapó la arteria\u003c/b>. Más allá del trombo ya no hay flujo: la pared inferior del ventrículo deja de contraerse en segundos y empieza a morir en unos 20 minutos. La mancha oscura es el músculo en isquemia.","facts":[["20 min","empieza la necrosis"],["Tiempo = músculo","cada minuto cuenta"]],"scene":{"fx":{"cor-der":{"cut":"cor-der@0.45/trunk of right coronary artery"},"corazon":{"spot":["@inferior",54,"isquemia",0.9]}},"pins":[{"at":"cor-der@0.45/trunk of right coronary artery","text":"Trombo","tone":"bad"},{"at":"@inferior","text":"Músculo en isquemia","side":"left"}],"contract":0.75}},{"q":"El hospital tiene sala de hemodinamia disponible. ¿Cómo lo reperfundes?","options":["Fibrinólisis inmediata aunque la sala esté libre","Intervención coronaria percutánea primaria, con meta puerta-balón de 90 minutos o menos","Esperar las troponinas para confirmar","Prueba de esfuerzo cuando ceda el dolor"],"ok":1,"why":"Con elevación del ST el diagnóstico es electrocardiográfico: no se esperan biomarcadores. La angioplastia primaria es la mejor reperfusión si puede hacerse a tiempo; la fibrinólisis queda para cuando no se alcanza en 120 minutos."},{"q":"Tiene presión de 98/60, ingurgitación yugular y pulmones limpios. Antes de dar nitroglicerina, ¿qué haces?","options":["Nitroglicerina sublingual: es parte del manejo habitual","Furosemida, por la ingurgitación yugular","Tomo derivaciones derechas (V4R): si hay infarto del ventrículo derecho evito los nitratos y doy líquidos","Morfina y betabloqueador intravenoso"],"ok":2,"why":"El infarto inferior alcanza al ventrículo derecho en un tercio de los casos. Ese ventrículo depende de la precarga: los nitratos, los diuréticos y la morfina pueden hundir la presión."},{"title":"Reperfusión","text":"El balón abre la arteria y se coloca un stent. La sangre vuelve a pasar, el ST baja y el dolor cede. El músculo que estaba aturdido pero vivo recupera su movimiento en días.","facts":[["Aspirina + inhibidor P2Y12","doble antiagregación"],["Estatina de alta intensidad","desde el ingreso"]],"scene":{"fx":{"corazon":{"spot":["@inferior",24,"isquemia",0.3]}},"pins":[{"at":"cor-der@0.45/trunk of right coronary artery","text":"Stent","tone":"good"}]},"vitals":{"hr":70,"sys":116,"dia":72,"st":0.03,"spo2":97}}],"pearls":["DII, DIII y aVF: coronaria derecha. V1–V4: descendente anterior. DI, aVL, V5–V6: circunfleja.","Con elevación del ST se reperfunde sin esperar troponinas.","Infarto inferior con hipotensión y pulmones limpios: piensa en el ventrículo derecho y evita los nitratos."]},{"id":"neumotorax","title":"Motociclista que no puede respirar","area":"Urgencias","hue":"#22a8c9","glyph":"body","level":1,"organs":["pulmon-izq","pulmon-der","costillas"],"patient":"Hombre de 24 años · accidente en motocicleta","base":{"only":["pulmon-der-sup","pulmon-der-med","pulmon-der-inf","pulmon-izq-sup","pulmon-izq-inf","traquea","corazon","aorta","vcs","vci","diafragma","costillas","cartilagos","esternon"],"ghost":{"costillas":0.2,"cartilagos":0.2,"esternon":0.2},"focus":[0,0,1265],"zoom":4.2,"turn":-0.1},"intro":{"text":"Lo trae la ambulancia con dificultad respiratoria intensa y dolor en el lado derecho del tórax. Está agitado y cada vez respira peor.","exam":["Ingurgitación yugular","Tráquea desviada hacia la izquierda","Hemitórax derecho hiperresonante y sin ruidos respiratorios"],"vitals":{"hr":132,"sys":82,"dia":50,"rr":34,"spo2":84,"depth":0.6,"perf":0.6},"scene":{"lungs":{"der":0.5}}},"nodes":[{"q":"¿Cuál es el diagnóstico?","options":["Taponamiento cardiaco","Hemotórax masivo derecho","Neumotórax a tensión derecho","Tórax inestable"],"ok":2,"why":"Hiperresonancia sin ruidos respiratorios, tráquea desviada al lado contrario e ingurgitación yugular. El hemotórax es mate a la percusión; en el taponamiento los ruidos respiratorios se conservan."},{"title":"Qué está pasando","text":"La pleura rota funciona como una válvula: en cada inspiración entra aire al espacio pleural y no puede salir. La presión \u003cb>colapsa el pulmón derecho\u003c/b> y empuja el corazón y la tráquea hacia la izquierda. Las venas cavas se acodan, la sangre no regresa al corazón y la presión se desploma: es un choque obstructivo.","facts":[["Choque obstructivo","no llega sangre al corazón"],["Clínico","el diagnóstico no espera imagen"]],"scene":{"lungs":{"der":0.92},"fx":{"corazon":{"push":[24,0,0]},"aorta":{"push":[24,0,0]},"vcs":{"push":[24,0,0]},"vci":{"push":[24,0,0]},"traquea":{"push":[15,0,0]}},"pins":[{"at":"pulmon-der-med","text":"Pulmón colapsado","tone":"bad","side":"left"},{"at":"traquea","text":"Tráquea desviada"},{"at":"vci@0.08","text":"Cava acodada"}]},"vitals":{"hr":142,"sys":70,"dia":44,"spo2":80,"perf":0.45}},{"q":"¿Qué sigue?","options":["Radiografía portátil de tórax para confirmar","Descompresión inmediata, sin esperar estudios","Tomografía de tórax","Intubación y ventilación con presión positiva"],"ok":1,"why":"Esperar una imagen puede costarle la vida, y la presión positiva sin descomprimir mete más aire al espacio pleural."},{"q":"En un adulto, ¿dónde descomprimes según ATLS, 10.ª edición?","options":["Segundo espacio intercostal, línea axilar posterior","Séptimo espacio intercostal, línea escapular","Subxifoideo","Quinto espacio intercostal, por delante de la línea axilar media"],"ok":3,"why":"En adultos la pared es más delgada en el 4.º–5.º espacio, por delante de la línea axilar media. El 2.º espacio en la línea medioclavicular se conserva para niños. Después se coloca una sonda pleural en ese mismo sitio.","after":{"scene":{"lungs":{"der":0.12},"pins":[{"at":"pulmon-der-inf","text":"Sonda pleural","tone":"good","side":"left"}]},"vitals":{"hr":104,"sys":114,"dia":70,"rr":22,"spo2":95,"perf":1,"depth":1}}}],"pearls":["Neumotórax a tensión: se trata con lo que encuentras en la exploración, no con la radiografía.","Adulto: 4.º–5.º espacio intercostal, por delante de la línea axilar media. Niño: 2.º espacio, línea medioclavicular.","La aguja o el dedo solo ganan tiempo: el tratamiento definitivo es la sonda pleural."]},{"id":"tep","title":"Disnea súbita tras una cirugía","area":"Neumología","hue":"#3e63dd","glyph":"flow","level":2,"organs":["pulmonar","cavas"],"patient":"Hombre de 62 años · prótesis de rodilla hace 8 días","base":{"only":["pulmon-der-sup","pulmon-der-med","pulmon-der-inf","pulmon-izq-sup","pulmon-izq-inf","corazon","aorta","art-pulmonar","ven-pulmonares","vcs","vci","ven-iliacas","ven-renales"],"ghost":{"pulmon-der-sup":0.3,"pulmon-der-med":0.3,"pulmon-der-inf":0.3,"pulmon-izq-sup":0.3,"pulmon-izq-inf":0.3},"focus":[0,0,1130],"zoom":3.2,"turn":-0.2},"intro":{"text":"Mientras caminaba en casa empezó con falta de aire súbita y dolor en el costado izquierdo que aumenta al respirar. No se ha puesto la heparina que le indicaron.","exam":["Pierna izquierda aumentada de volumen y dolorosa","Campos pulmonares sin estertores","Segundo ruido pulmonar reforzado"],"labs":[["Taquicardia sinusal","electrocardiograma"],["Normal","radiografía de tórax"]],"vitals":{"hr":118,"sys":108,"dia":68,"rr":26,"spo2":89}},"nodes":[{"q":"La escala de Wells indica probabilidad alta de tromboembolia pulmonar. ¿Qué estudio pides?","options":["Dímero D","Angiotomografía pulmonar","Ecocardiograma y, si es normal, alta","Repetir la radiografía en 6 horas"],"ok":1,"why":"Con probabilidad alta el dímero D no descarta nada: se va directo a la imagen. La radiografía normal en un paciente con disnea e hipoxemia es, de hecho, un dato a favor."},{"title":"Qué está pasando","text":"Un trombo formado en las venas profundas de la pierna se soltó, subió por la vena cava inferior, cruzó el corazón derecho y \u003cb>se atoró en la arteria pulmonar\u003c/b>. Esa parte del pulmón sigue recibiendo aire pero no sangre: es espacio muerto. El ventrículo derecho, de pared delgada, se dilata contra el obstáculo.","facts":[["Virchow","estasis, daño endotelial, hipercoagulabilidad"],["Espacio muerto","ventila pero no perfunde"]],"scene":{"fx":{"ven-iliacas":{"streak":[-150,0.65]},"vci":{"streak":[-170,0.65]},"art-pulmonar":{"cut":"art-pulmonar@0.42"},"pulmon-izq-inf":{"tint":["cianosis",0.55]},"pulmon-der-inf":{"tint":["cianosis",0.4]}},"pins":[{"at":"art-pulmonar@0.42","text":"Trombo","tone":"bad"},{"at":"ven-iliacas","text":"Viene de las venas de la pierna","side":"left"},{"at":"pulmon-izq-inf","text":"Aire sin sangre"}]}},{"q":"La angiotomografía confirma el trombo. Está estable, con presión de 108/68. ¿Tratamiento?","options":["Anticoagulación","Trombólisis sistémica","Filtro de vena cava como primera línea","Antiagregantes plaquetarios"],"ok":0,"why":"La anticoagulación impide que el trombo crezca mientras el organismo lo disuelve. El filtro se reserva para cuando anticoagular está contraindicado."},{"lead":"Una hora después la presión cae a 78/50 y no responde a líquidos.","vitals":{"hr":132,"sys":78,"dia":50,"spo2":85,"perf":0.5},"q":"¿Qué cambia?","options":["Aumento la dosis de heparina","Solo inicio vasopresores","Espero a que la anticoagulación haga efecto","Trombólisis sistémica: ahora es una tromboembolia de alto riesgo"],"ok":3,"why":"La hipotensión sostenida define el alto riesgo. En ese grupo la trombólisis reduce la mortalidad; si está contraindicada, se considera la embolectomía.","after":{"scene":{"fx":{"art-pulmonar":{"streak":[200,0.5]}},"pins":[{"at":"art-pulmonar@0.42","text":"Arteria abierta","tone":"good"}]},"vitals":{"hr":98,"sys":112,"dia":70,"rr":20,"spo2":94,"perf":1}}}],"pearls":["Probabilidad alta: imagen. Probabilidad baja o intermedia: dímero D.","El hallazgo más frecuente en el electrocardiograma es la taquicardia sinusal.","Estable: anticoagular. Hipotensión sostenida: trombolizar."]},{"id":"neumonia","title":"Fiebre y tos con esputo herrumbroso","area":"Neumología","hue":"#30a46c","glyph":"body","level":1,"organs":["pulmon-der","pulmon-izq"],"patient":"Hombre de 67 años · diabético","base":{"only":["pulmon-der-sup","pulmon-der-med","pulmon-der-inf","pulmon-izq-sup","pulmon-izq-inf","traquea","bronquios","diafragma"],"focus":[-40,0,1250],"zoom":4.8,"turn":-0.4},"intro":{"text":"Tres días con fiebre, escalofríos, tos con esputo color óxido y dolor en el costado derecho al respirar.","exam":["Estertores crepitantes y soplo tubario en la base derecha","Matidez a la percusión en la base derecha","Orientado, sin confusión"],"labs":[["52 mg/dL","urea"],["16 200","leucocitos"]],"vitals":{"hr":108,"sys":112,"dia":70,"rr":26,"spo2":90,"temp":39.1}},"nodes":[{"q":"¿Cuál es el agente más frecuente de la neumonía adquirida en la comunidad?","options":["Mycoplasma pneumoniae","Staphylococcus aureus","Pseudomonas aeruginosa","Streptococcus pneumoniae"],"ok":3,"why":"El neumococo es el primero en todos los grupos de adultos. El inicio brusco, el esputo herrumbroso y la consolidación lobar son su cuadro clásico."},{"title":"Qué está pasando","text":"Los alvéolos del lóbulo inferior derecho se llenaron de exudado y neutrófilos: es la \u003cb>consolidación\u003c/b>. Ese lóbulo sigue recibiendo sangre pero ya no tiene aire, así que la sangre pasa sin oxigenarse: un cortocircuito. Por eso la saturación baja y mejora poco con oxígeno.","facts":[["Cortocircuito","perfunde pero no ventila"],["Broncograma aéreo","bronquios con aire entre alvéolos llenos"]],"scene":{"fx":{"pulmon-der-inf":{"tint":["consolidado",0.78]}},"pins":[{"at":"pulmon-der-inf","text":"Consolidación","tone":"bad"}]}},{"q":"Tiene 67 años y urea elevada; no está confundido, respira 26 veces por minuto y su presión es de 112/70. CURB-65 de 2. ¿Dónde lo tratas?","options":["En casa, con cita en una semana","Hospitalizado","En terapia intensiva","En observación dos horas y alta"],"ok":1,"why":"CURB-65 da un punto por confusión, urea alta, frecuencia respiratoria de 30 o más, presión baja y edad de 65 o más. Con 2 puntos se hospitaliza; con 3 o más se valora terapia intensiva."},{"q":"¿Qué esquema empírico inicias en hospitalización general?","options":["Betalactámico más macrólido, o una fluoroquinolona respiratoria sola","Amoxicilina oral sola","Vancomicina más meropenem","Oseltamivir solo"],"ok":0,"why":"Hay que cubrir neumococo y gérmenes atípicos. La cobertura contra Pseudomonas o estafilococo resistente solo se añade si hay factores de riesgo.","after":{"scene":{"fx":{"pulmon-der-inf":{"tint":["consolidado",0.3]}},"pins":[{"at":"pulmon-der-inf","text":"Se resuelve en semanas","tone":"good"}]},"vitals":{"hr":88,"rr":18,"spo2":95,"temp":37.2}}}],"pearls":["Neumococo: el agente más frecuente a cualquier edad adulta.","CURB-65: 0–1 ambulatorio, 2 hospital, 3 o más valorar terapia intensiva.","La radiografía tarda semanas en limpiarse; la mejoría se mide en el paciente."]},{"id":"apendicitis","title":"Dolor que migró a la fosa ilíaca derecha","area":"Cirugía","hue":"#e08a3c","glyph":"pin","level":1,"organs":["colon","intestino"],"patient":"Hombre de 19 años · previamente sano","base":{"only":["colon","apendice","ileon","yeyuno","recto","pelvis","sacro","col-lumbar"],"ghost":{"pelvis":0.24,"sacro":0.24,"col-lumbar":0.24,"yeyuno":0.4,"ileon":0.55},"focus":"apendice","zoom":5.6,"turn":-0.45},"intro":{"text":"Ayer empezó con dolor alrededor del ombligo, sin ganas de comer y con náusea. Hoy el dolor está en la parte baja derecha del abdomen y le duele al caminar.","exam":["Dolor en el punto de McBurney con rebote","Signo de Rovsing positivo","Signo del psoas positivo"],"labs":[["13 800","leucocitos"],["82 %","neutrófilos"]],"vitals":{"hr":98,"sys":118,"dia":74,"rr":18,"spo2":98,"temp":38}},"nodes":[{"q":"¿Por qué el dolor empezó en el ombligo y después se fue a la fosa ilíaca derecha?","options":["Porque el apéndice se desplaza al inflamarse","Primero es dolor visceral referido a T10; después se inflama el peritoneo parietal y el dolor se localiza","Por irritación del nervio frénico","Porque es un dolor de la pared muscular"],"ok":1,"why":"El apéndice comparte inervación con el intestino medio, que refiere al dermatoma T10. Cuando la inflamación toca el peritoneo parietal, que tiene inervación somática, el dolor se vuelve preciso."},{"title":"Qué está pasando","text":"Algo tapa la luz del apéndice: un fecalito en el adulto, tejido linfoide en el joven. El moco se acumula, la pared se distiende y las bacterias proliferan. La presión corta primero el drenaje venoso y después el riego arterial: \u003cb>isquemia, necrosis y perforación\u003c/b> en uno a tres días.","facts":[["24–72 h","hasta la perforación"],["Alvarado ≥ 7","alta probabilidad"]],"scene":{"fx":{"apendice":{"tint":["inflamado",0.88],"swell":2.8},"colon":{"spot":["apendice",36,"inflamado",0.5]}},"pins":[{"at":"apendice","text":"Apéndice inflamado","tone":"bad","side":"left"},{"at":"T10","text":"T10: el dolor referido al ombligo"}]}},{"q":"Su puntaje de Alvarado es de 9. ¿Qué sigue?","options":["Tomografía en todos los casos antes de decidir","Antibiótico oral y revisión en 48 horas","Colonoscopia","Apendicectomía, de preferencia laparoscópica, con antibiótico profiláctico"],"ok":3,"why":"Con cuadro típico y Alvarado alto la cirugía no se retrasa. La imagen es para los casos dudosos: ultrasonido en niños y embarazadas, tomografía en adultos."},{"q":"En la cirugía el apéndice está perforado y hay pus libre. ¿Qué cambia?","options":["Nada: el manejo es igual","Los antibióticos dejan de ser profilácticos y continúan como tratamiento","Se deja el apéndice y se cierra","Se hace una colostomía"],"ok":1,"why":"En la apendicitis no complicada basta una dosis antes de la incisión. En la complicada se continúan hasta que cede la respuesta inflamatoria, por lo general de 3 a 5 días.","after":{"scene":{"fx":{},"hide":["apendice"],"pins":[{"at":"colon@0.02","text":"Muñón apendicular","tone":"good","side":"left"}]},"vitals":{"hr":82,"temp":37.1}}}],"pearls":["Secuencia de Murphy: dolor, después náusea o vómito, después fiebre.","McBurney: unión del tercio externo con los dos tercios internos de la línea de la espina ilíaca al ombligo.","Niños y embarazadas: ultrasonido antes que tomografía."]},{"id":"colangitis","title":"Fiebre, ictericia y dolor","area":"Cirugía","hue":"#5f9150","glyph":"info","level":2,"organs":["vesicula","higado"],"patient":"Hombre de 45 años · cólicos biliares previos","base":{"only":["higado","vesicula","duodeno","pancreas","estomago"],"ghost":{"higado":0.5,"estomago":0.3},"focus":"vesicula","zoom":5.8,"turn":-0.3},"intro":{"text":"Desde ayer tiene dolor en el hipocondrio derecho, fiebre con escalofríos y la piel amarilla. La orina es oscura.","exam":["Ictericia de piel y escleras","Dolor a la palpación del hipocondrio derecho","Temperatura de 39.2 °C"],"labs":[["6.8 mg/dL","bilirrubina total, directa"],["412 U/L","fosfatasa alcalina"],["17 500","leucocitos"]],"vitals":{"hr":112,"sys":96,"dia":58,"rr":22,"spo2":96,"temp":39.2}},"nodes":[{"q":"Fiebre, ictericia y dolor en el hipocondrio derecho. ¿Qué tríada es y qué indica?","options":["Tríada de Beck: taponamiento cardiaco","Tríada de Virchow: trombosis","Tríada de Charcot: colangitis aguda","Tríada de Whipple: hipoglucemia"],"ok":2,"why":"La tríada de Charcot es la presentación clásica de la infección de la vía biliar obstruida."},{"title":"Qué está pasando","text":"Un cálculo salió de la vesícula y se atoró en el colédoco. La bilis ya no puede bajar al duodeno: se estanca, se infecta con bacterias del intestino y la presión la empuja hacia la sangre. Por eso hay \u003cb>fiebre, ictericia y dolor\u003c/b>. La bilirrubina que sube es la directa.","facts":[["E. coli y Klebsiella","gérmenes habituales"],["Bilirrubina directa","patrón obstructivo"]],"scene":{"fx":{"vesicula":{"tint":["bilis",0.45],"swell":2},"higado":{"tint":["bilis",0.42]}},"pins":[{"at":"mid:vesicula,duodeno@0.4","text":"Cálculo en el colédoco","tone":"bad"},{"at":"higado","text":"Bilis estancada","side":"left"}]}},{"q":"¿Cuál es el primer estudio de imagen?","options":["Ultrasonido de hígado y vías biliares","Tomografía contrastada","Colangiorresonancia en todos los casos","Radiografía simple de abdomen"],"ok":0,"why":"El ultrasonido muestra la dilatación de la vía biliar y los cálculos de la vesícula. La colangiorresonancia se usa cuando persiste la duda."},{"q":"¿Cuál es el tratamiento?","options":["Colecistectomía de urgencia como primer paso","Solo antibióticos durante dos semanas","Líquidos, antibióticos y drenaje de la vía biliar por CPRE","Vigilar y repetir los laboratorios"],"ok":2,"why":"El antibiótico no basta mientras la vía siga obstruida. El drenaje endoscópico es el tratamiento; la vesícula se opera después, cuando cede la infección."},{"lead":"Mientras se prepara la CPRE, la presión baja a 80/50 y el paciente deja de reconocer a su familia.","vitals":{"hr":128,"sys":80,"dia":50,"perf":0.6},"q":"¿Qué significa?","options":["Encefalopatía hepática: lactulosa","Efecto de los analgésicos","Síndrome hepatorrenal","Péntada de Reynolds: colangitis grave, el drenaje es urgente"],"ok":3,"why":"Charcot más hipotensión y alteración del estado de alerta es la péntada de Reynolds: sepsis de origen biliar. El drenaje no puede esperar.","after":{"scene":{"fx":{"higado":{"tint":["bilis",0.12]}},"pins":[{"at":"mid:vesicula,duodeno@0.4","text":"Vía biliar drenada","tone":"good"}]},"vitals":{"hr":92,"sys":112,"dia":68,"temp":37.6,"perf":1}}}],"pearls":["Charcot: fiebre, ictericia y dolor. Reynolds: Charcot más hipotensión y confusión.","Colangitis: antibiótico y drenaje. Sin drenaje no hay curación.","Colecistitis: Murphy positivo, sin ictericia importante. Colangitis: ictericia y fiebre."]},{"id":"pancreatitis","title":"Dolor en barra que va a la espalda","area":"Gastroenterología","hue":"#c9a227","glyph":"info","level":2,"organs":["pancreas","vesicula"],"patient":"Hombre de 41 años · litiasis vesicular conocida","base":{"only":["pancreas","duodeno","vesicula","higado","estomago","bazo"],"ghost":{"higado":0.4,"estomago":0.28},"focus":"pancreas","zoom":5.6,"turn":-0.1},"intro":{"text":"Después de una comida abundante empezó con dolor intenso en el epigastrio, en barra, que se va a la espalda y mejora un poco al inclinarse hacia delante. Ha vomitado varias veces.","exam":["Abdomen doloroso en el epigastrio, sin rigidez","Mucosas secas","Ruidos intestinales disminuidos"],"labs":[["1 450 U/L","lipasa (normal hasta 160)"],["Cálculos en la vesícula","ultrasonido"]],"vitals":{"hr":116,"sys":100,"dia":62,"rr":22,"spo2":96,"temp":37.9}},"nodes":[{"q":"¿Cómo se hace el diagnóstico de pancreatitis aguda?","options":["Con lipasa elevada en cualquier cifra","Con tomografía obligatoria al ingreso","Con dos de tres: dolor típico, lipasa o amilasa al triple del límite e imagen compatible","Con amilasa y lipasa elevadas a la vez"],"ok":2,"why":"Este paciente ya cumple dos criterios: no necesita tomografía para el diagnóstico. La tomografía se reserva para la duda o para buscar complicaciones después de 72 horas."},{"title":"Qué está pasando","text":"Un cálculo se atoró en la ampolla de Vater y bloqueó la salida del páncreas. Las enzimas, que deberían activarse en el duodeno, se activan dentro de la glándula y \u003cb>empiezan a digerirla\u003c/b>. El páncreas se inflama y el líquido se fuga de los vasos al retroperitoneo: por eso llega deshidratado y taquicárdico.","facts":[["Litiasis biliar","primera causa"],["Alcohol","segunda causa"]],"scene":{"fx":{"pancreas":{"tint":["inflamado",0.72],"swell":3.4}},"pins":[{"at":"pancreas","text":"Autodigestión"},{"at":"mid:vesicula,duodeno@0.4","text":"Cálculo en la ampolla","tone":"bad","side":"left"}]}},{"q":"¿Cuál es el manejo inicial?","options":["Ayuno prolongado y antibiótico profiláctico","Líquidos intravenosos guiados por metas, analgesia y reiniciar la vía oral en cuanto la tolere","Cirugía de urgencia","CPRE en las primeras 24 horas a todos"],"ok":1,"why":"No se dan antibióticos profilácticos. La CPRE urgente solo está indicada si además hay colangitis. Alimentar pronto reduce las complicaciones."},{"q":"Evoluci decidir la trombólisis. La presión solo se baja si supera 185/110 y se va a trombolizar."},{"title":"Qué está pasando","text":"La fibrilación auricular estanca la sangre en la aurícula izquierda. Un coágulo se desprendió, subió por la carótida y \u003cb>tapó la arteria cerebral media izquierda\u003c/b>. El centro del territorio muere en minutos. Alrededor queda la penumbra: tejido que ya no funciona pero sigue vivo y puede salvarse si la arteria se abre a tiempo.","facts":[["1.9 millones","de neuronas se pierden por minuto"],["Cara y brazo","territorio de la cerebral media"]],"scene":{"fx":{"lob-frontal":{"spot":[[54,4,1592],44,"necrosis",0.8],"spot2":[[54,4,1592],80,"isquemia",0.5]},"giro-precentral":{"spot":[[54,4,1592],44,"necrosis",0.8],"spot2":[[54,4,1592],80,"isquemia",0.5]},"giro-poscentral":{"spot":[[54,4,1592],44,"necrosis",0.8],"spot2":[[54,4,1592],80,"isquemia",0.5]},"lob-parietal":{"spot":[[54,4,1592],44,"necrosis",0.8],"spot2":[[54,4,1592],80,"isquemia",0.5]},"lob-temporal":{"spot":[[54,4,1592],44,"necrosis",0.8],"spot2":[[54,4,1592],80,"isquemia",0.5]},"insula":{"spot":[[54,4,1592],44,"necrosis",0.8],"spot2":[[54,4,1592],80,"isquemia",0.5]},"carotidas":{"streak":[240,0.5]}},"pins":[{"at":[62,2,1594],"text":"Núcleo del infarto","tone":"bad"},{"at":[50,44,1616],"text":"Penumbra","side":"left"}]}},{"q":"La tomografía no muestra hemorragia. Lleva 90 minutos, presión de 168/96 y no tiene contraindicaciones. ¿Qué indicas?","options":["Aspirina y vigilancia","Trombólisis intravenosa con alteplasa","Anticoagulación plena por la fibrilación auricular","Esperar a la resonancia magnética"],"ok":1,"why":"La ventana es de 4.5 horas desde el inicio. La anticoagulación se difiere varios días por el riesgo de que el infarto sangre; la aspirina se inicia 24 horas después de la trombólisis."},{"q":"La angiotomografía confirma la oclusión del primer segmento de la cerebral media. ¿Qué agregas?","options":["Una segunda dosis de alteplasa","Craniectomía descompresiva","Tro ige solo","Repongo potasio primero y la difiero hasta que esté en 3.3 mEq/L o más","Doy bicarbonato para subir el potasio","Suspendo los líquidos"],"ok":1,"why":"La insulina mete potasio a las células; con potasio bajo puede provocar una arritmia mortal. El potasio total del cuerpo está agotado aunque la cifra inicial parezca normal o alta."},{"lead":"Con insulina en infusión la glucosa baja a 210 mg/dL, pero la brecha aniónica sigue abierta.","vitals":{"hr":102,"sys":106,"dia":66,"rr":24,"depth":1.4},"q":"¿Qué sigue?","options":["Suspendo la insulina","Paso a insulina subcutánea y lo doy de alta","Agrego glucosa a los líquidos y mantengo la insulina hasta cerrar la brecha","Aumento la insulina"],"ok":2,"why":"La meta no es la glucosa: es resolver la cetoacidosis, con pH mayor de 7.3, bicarbonato de 15 o más y brecha cerrada. La glucosa permite seguir con la insulina sin causar hipoglucemia.","after":{"scene":{"fx":{},"pins":[{"at":"pancreas","text":"Insulina exógena","tone":"good"}]},"vitals":{"hr":86,"sys":116,"dia":72,"rr":16,"pattern":"normal","depth":1}}}],"pearls":["Orden: líquidos, potasio, insulina.","Potasio menor de 3.3: no inicies la insulina.","La cetoacidosis se resuelve cuando se cierra la brecha, no cuando baja la glucosa."]},{"id":"diseccion","title":"Dolor que desgarra hacia la espalda","area":"Cardiología","hue":"#b5413f","glyph":"heart","level":3,"organs":["aorta","supraaorticos"],"patient":"Hombre de 61 años · hipertenso mal controlado","base":{"only":["aorta","corazon","carotidas","subclavias","tronco-celiaco","mesentericas","art-renales","art-iliacas","col-toracica","col-lumbar"],"ghost":{"col-toracica":0.2,"col-lumbar":0.2},"focus":"aorta@0.14","zoom":5.1,"turn":0.5},"intro":{"text":"Dolor torácico de inicio súbito, el peor de su vida desde el primer segundo, que describe como si algo se rasgara y que se va hacia la espalda.","exam":["Presión de 178/100 en el brazo derecho y 132/80 en el izquierdo","Soplo diastólico aórtico que no tenía","Pulso radial izquierdo disminuido"],"labs":[["Mediastino ensanchado","radiografía de tórax"],["Sin elevación del ST","electrocardiograma"]],"vitals":{"hr":108,"sys":178,"dia":100,"rr":22,"spo2":96}},"nodes":[{"q":"¿Qué sospechas y qué estudio pides?","options":["Infarto: cateterismo inmediato","Disección aórtica: angiotomografía de aorta","Tromboembolia pulmonar: dímero D","Pericarditis: antiinflamatorios"],"ok":1,"why":"Dolor máximo desde el inicio, pulsos y presiones asimétricos y mediastino ancho. Anticoagular o trombolizar una disección por confundirla con un infarto puede ser letal."},{"title":"Qué está pasando","text":"La capa interna de la aorta se desgarró y la sangre, empujada por cada latido, \u003cb>se mete entre las capas de la pared\u003c/b> y abre un segundo canal: la falsa luz. Si avanza hacia el corazón puede dañar la válvula aórtica, tapar una coronaria o romperse al pericardio. Hacia delante puede dejar sin flujo a las ramas del cayado: por eso la presión es distinta en cada brazo.","facts":[["Hipertensión","principal factor de riesgo"],["1–2 % por hora","mortalidad sin tratamiento, tipo A"]],"scene":{"fx":{"aorta":{"bulge":[0,0.2,3.6],"spot":["aorta@0.05",28,"sangre",0.75]},"subclavias":{"tint":["isquemia",0.5]}},"pins":[{"at":"aorta@0.05","text":"Desgarro de la íntima","tone":"bad","side":"left"},{"at":"aorta@0.15","text":"Falsa luz"},{"at":"subclavias","text":"Rama con menos flujo"}]}},{"q":"La tomografía muestra que la disección afecta la aorta ascendente. ¿Clasificación y conducta?","options":["Stanford B: manejo médico","Stanford A: manejo médico","Stanford A: cirugía urgente","Stanford B: cirugía urgente"],"ok":2,"why":"Toda disección que toca la ascendente es tipo A y se opera. La tipo B, que empieza después de la subclavia izquierda, se trata con medicamentos si no hay complicaciones."},{"q":"Mientras llega el cirujano, ¿cómo controlas la hemodinamia?","options":["Vasodilatador solo, para bajar rápido la presión","Betabloqueador intravenoso pr   base=mix(base,base*vec3(.34,.30,.44)+vec3(.03,.02,.06),cut*.85);

  vec3 side=vec3(-uCam.x,uCam.y,0.);
  vec3 L=normalize(side*.55+vec3(0.,0.,.75)+V*.45);
  float ao=mix(1.,vA.x,.92);
  float wrap=clamp((dot(N,L)+uMat.x)/(1.+uMat.x),0.,1.);
  float hemi=.5+.5*N.z;
  vec3 col=base*(uTheme.x*mix(.7,1.,hemi)+uTheme.y*wrap);
  col+=base*vec3(.9,.3,.24)*uMat.x*.1*(1.-wrap);
  col*=mix(.5,1.,ao);
  vec3 H=normalize(L+V);
  float fr=pow(1.-ndv,3.);
  col+=pow(max(dot(N,H),0.),uMat.z)*uMat.y*ao;
  col+=fr*uMat.w*uTheme.z*mix(base,vec3(1.),.5)*ao;
  if(inside)col*=vec3(.56,.42,.44);

  if(uFlow.z>0.){
    float ph=fract((vA.y-uFlow.x*uTime)/uFlow.y);
    float streak=smoothstep(0.,.3,ph)*(1.-smoothstep(.3,.62,ph));
    col+=mix(base,vec3(1.),.35)*streak*uFlow.z*(1.-cut);
  }
  col+=mix(base,vec3(1.),.3)*vA.w*uFlow.w*(1.-cut);
  col+=under*uLevelCol.a*.12*(.5+.5*sin(vM.x*.2+uTime*2.));

  if(uState.y>.5){
    col+=uAccent*(.02+.025*sin(uTime*3.2))+fr*uAccent*.3;
  }
  float luma=dot(col,vec3(.3,.59,.11));
  col=mix(col,mix(vec3(luma),vec3(uTheme.w>.5?.2:.84),.45),uState.z);

  if(uBlend>.5){oColor=vec4(col*alpha,alpha);oId=vec4(0.);return;}
  oColor=vec4(col,1.);
  oId=vec4((uState.w+.5)/255.,(vA.z+.5)/255.,floor(t)/255.,fract(t));
}`;

  const PVS = `#version 300 es
layout(location=0) in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
  const PFS = `#version 300 es
precision highp float;
uniform sampler2D uColorTex,uIdTex;
uniform vec2 uPx;
uniform vec4 uInk;
uniform vec3 uAccent;
uniform vec2 uSel;
uniform float uLine;
out vec4 o;
void main(){
  vec2 uv=gl_FragCoord.xy*uPx;
  vec4 c=texture(uColorTex,uv);
  vec4 i0=texture(uIdTex,uv);
  float z0=i0.b+i0.a/255.;
  float s0=step(abs(i0.r-uSel.x),.4/255.)*uSel.y;
  float eId=0.,eZ=0.,eP=0.,eS=0.;
  for(int k=0;k<8;k++){
    float a=float(k)*.7853982;
    vec2 d=vec2(cos(a),sin(a))*uPx;
    vec4 i=texture(uIdTex,uv+d*uLine);
    float dId=step(.4/255.,abs(i.r-i0.r));
    eId=max(eId,dId);
    eP=max(eP,step(.4/255.,abs(i.g-i0.g))*(1.-dId));
    eZ=max(eZ,smoothstep(.006,.013,abs(i.b+i.a/255.-z0))*(1.-dId)*step(.5/255.,i0.r));
    vec4 j=texture(uIdTex,uv+d*uLine*2.2);
    eS=max(eS,abs(step(abs(j.r-uSel.x),.4/255.)*uSel.y-s0));
  }
  float ink=max(eId,max(eZ*.8,eP*.38))*uInk.a;
  vec3 rgb=c.rgb*(1.-ink)+uInk.rgb*ink;
  float al=c.a*(1.-ink)+ink;
  rgb=rgb*(1.-eS)+uAccent*eS;
  al=al*(1.-eS)+eS;
  o=vec4(rgb,al);
}`;

  // ── structure state ──────────────────────────────────────────────────────
  const FX = { tint: 3, spotA: 3, spotColA: 3, spotB: 3, spotColB: 3, level: 1, levelCol: 3, cut: 1, swell: -1, flow: -1, wave: -1 };
  const ZERO = () => new Float32Array(4);
  function makeState(meta, index) {
    const info = D.structs[meta.id];
    const s = {
      id: meta.id, index, meta, layer: meta.layer, kind: meta.kind, info,
      color: new Float32Array(info.color), mat: new Float32Array(D.mats[info.mat]),
      alpha: 0, show: 0, hiddenBy: 0, dim: 0, dimTo: 0,
      mode: 0, ride: false, shift: new Float32Array(3), explode: new Float32Array(3), pivot: new Float32Array([0, 0, 0, 1]),
      la: ZERO(), lb: ZERO(),
      fx: {}, to: {}, vao: null, count: meta.i[1], offset: 0,
    };
    for (const key of Object.keys(FX)) { s.fx[key] = ZERO(); s.to[key] = ZERO(); }
    s.fx.cut[2] = s.to.cut[2] = -1;
    return s;
  }

  M.structs.forEach((meta, index) => {
    const s = makeState(meta, index + 1);
    S[meta.id] = s;
    LIST.push(s);
  });

  // ── mesh ─────────────────────────────────────────────────────────────────
  // Each structure is stored as byte planes of zigzag deltas (see tools/build_model.py).
  function decode(bytes) {
    const zig = (v) => (v >>> 1) ^ -(v & 1);
    const vertexBytes = new Uint8Array(M.vertices * 12);
    const indexData = new Uint16Array(M.triangles * 3);
    const view = new DataView(vertexBytes.buffer);
    let at = 0, vBase = 0, iBase = 0;
    for (const s of LIST) {
      const nv = s.meta.v[1], ni = s.meta.i[1];
      for (let f = 0; f < 4; f++) {
        let prev = 0;
        const lo = at + f * 2 * nv, hi = lo + nv;
        for (let i = 0; i < nv; i++) {
          prev = (prev + zig(bytes[lo + i] | (bytes[hi + i] << 8))) & 65535;
          view.setUint16((vBase + i) * 12 + f * 2, prev, true);
        }
      }
      for (let f = 0; f < 3; f++) {
        let prev = 0;
        const from = at + 8 * nv + f * nv;
        for (let i = 0; i < nv; i++) {
          prev = (prev + zig(bytes[from + i])) & 255;
          vertexBytes[(vBase + i) * 12 + 8 + f] = prev;
        }
      }
      for (let i = 0; i < nv; i++) vertexBytes[(vBase + i) * 12 + 11] = bytes[at + 11 * nv + i];
      at += 12 * nv;
      let next = 0;
      for (let i = 0; i < ni; i++) {
        const code = bytes[at + i] | (bytes[at + ni + i] << 8);
        indexData[iBase + i] = code === 0 ? next++ : next - code;
      }
      at += 2 * ni;
      s.vBase = vBase;
      s.offset = iBase * 2;
      vBase += nv;
      iBase += ni;
    }
    return { vertexBytes, indexData };
  }

  function compile(vs, fs) {
    const make = (type, source) => {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader) || "shader");
      return shader;
    };
    const program = gl.createProgram();
    gl.attachShader(program, make(gl.VERTEX_SHADER, vs));
    gl.attachShader(program, make(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program) || "link");
    const where = {};
    const count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < count; i++) {
      const name = gl.getActiveUniform(program, i).name.replace(/\[0\]$/, "");
      where[name] = gl.getUniformLocation(program, name);
    }
    return { program, where };
  }

  function init(el) {
    canvas = el;
    try {
      gl = canvas.getContext("webgl2", { alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false, powerPreference: "high-performance" });
      if (!gl) throw new Error("WebGL2 no disponible");
      main = compile(VS, FS);
      post = compile(PVS, PFS);
      Object.assign(U, main.where);
      Object.assign(UP, post.where);
      quad = gl.createVertexArray();
      gl.bindVertexArray(quad);
      const qb = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, qb);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      gl.bindVertexArray(null);
      canvas.addEventListener("webglcontextlost", (e) => { e.preventDefault(); ready = false; });
      canvas.addEventListener("webglcontextrestored", () => location.reload());
    } catch (error) {
      failed = String(error.message || error);
      gl = null;
    }
    return !!gl;
  }

  async function load(onProgress = () => {}) {
    if (!gl) throw new Error(failed || "WebGL2 no disponible");
    const response = await fetch(D.bodyUrl);
    if (!response.ok) throw new Error(`No se pudo descargar el modelo (${response.status})`);
    const total = Number(response.headers.get("content-length")) || D.bodyGz;
    const reader = response.body.getReader();
    const parts = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      parts.push(value);
      got += value.length;
      onProgress(Math.min(0.96, got / total));
    }
    const packed = new Blob(parts);
    // A server may already have unpacked it (Content-Encoding); the first two bytes tell.
    const head = new Uint8Array(await packed.slice(0, 2).arrayBuffer());
    const gz = head[0] === 0x1f && head[1] === 0x8b;
    const raw = gz ? await new Response(packed.stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer() : await packed.arrayBuffer();
    if (raw.byteLength !== M.bytes) throw new Error("El modelo llegó incompleto");
    const { vertexBytes, indexData } = decode(new Uint8Array(raw));
    cpu = new DataView(vertexBytes.buffer);
    vertexBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, vertexBytes, gl.STATIC_DRAW);
    indexBuffer = gl.createBuffer();
    for (const s of LIST) {
      s.vao = gl.createVertexArray();
      gl.bindVertexArray(s.vao);
      gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
      const base = s.vBase * 12;
      for (let i = 0; i < 5; i++) gl.enableVertexAttribArray(i);
      gl.vertexAttribPointer(0, 3, gl.UNSIGNED_SHORT, true, 12, base);
      gl.vertexAttribPointer(1, 1, gl.UNSIGNED_SHORT, false, 12, base + 6);
      gl.vertexAttribPointer(2, 2, gl.BYTE, true, 12, base + 8);
      gl.vertexAttribPointer(3, 1, gl.UNSIGNED_BYTE, true, 12, base + 10);
      gl.vertexAttribPointer(4, 1, gl.UNSIGNED_BYTE, false, 12, base + 11);
    }
    gl.bindVertexArray(LIST[0].vao);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indexData, gl.STATIC_DRAW);
    gl.bindVertexArray(null);
    ready = true;
    onProgress(1);
  }

  // ── view ─────────────────────────────────────────────────────────────────
  const view = {
    turn: -0.42, turnTo: -0.42, spin: 0,
    zoom: 1, zoomTo: 1,
    focus: CAM.home.slice(), focusTo: CAM.home.slice(),
    pan: [0, 0], panTo: [0, 0],
    inset: { top: 0, right: 0, bottom: 0, left: 0 }, insetNow: { top: 0, right: 0, bottom: 0, left: 0 },
    width: 1, height: 1, ratio: 1, scale: 1, tx: 0, ty: 0,
  };
  const TURN0 = Math.PI / 2 + Math.atan2(CAM.cam[0], CAM.cam[1]);
  const turned = ([x, y, z], angle = view.turn) => {
    const c = Math.cos(TURN0 + angle), s = Math.sin(TURN0 + angle);
    return [-x * c - y * s, -x * s + y * c, z];
  };
  const toBox = ([x, y, z]) => {
    const [sa, ca, se, ce] = CAM.cam;
    return [CAM.origin[0] + CAM.k * (x * sa - y * ca), CAM.origin[1] + CAM.k * ((x * ca + y * sa) * se - z * ce)];
  };
  const depthOf = ([x, y, z]) => (x * CAM.cam[1] + y * CAM.cam[0]) * CAM.cam[3] + z * CAM.cam[2];
  /** Model point → CSS pixels inside the canvas. */
  const toScreen = (point) => {
    const b = toBox(turned(point));
    return [b[0] * view.scale + view.tx, b[1] * view.scale + view.ty];
  };
  function place(dt) {
    const k = 1 - Math.exp(-dt / 0.16);
    view.zoom += (view.zoomTo - view.zoom) * k;
    for (let i = 0; i < 3; i++) view.focus[i] += (view.focusTo[i] - view.focus[i]) * k;
    for (let i = 0; i < 2; i++) view.pan[i] += (view.panTo[i] - view.pan[i]) * k;
    for (const side of ["top", "right", "bottom", "left"]) view.insetNow[side] += (view.inset[side] - view.insetNow[side]) * k;
    const free = { w: Math.max(80, view.width - view.insetNow.left - view.insetNow.right), h: Math.max(80, view.height - view.insetNow.top - view.insetNow.bottom) };
    const fit = Math.min(free.h / CAM.fitH, free.w / CAM.fitW);
    view.scale = fit * view.zoom;
    const f = toBox(turned(view.focus));
    view.tx = view.insetNow.left + free.w / 2 - f[0] * view.scale + view.pan[0];
    view.ty = view.insetNow.top + free.h / 2 - f[1] * view.scale + view.pan[1];
  }

  function resize() {
    const box = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    let ratio = Math.min(3, Math.max(dpr, 1.5));
    const budget = 2.3e6;
    if (box.width * box.height * ratio * ratio > budget) ratio = Math.sqrt(budget / (box.width * box.height));
    const w = Math.max(2, Math.round(box.width * ratio)), h = Math.max(2, Math.round(box.height * ratio));
    view.width = box.width;
    view.height = box.height;
    view.ratio = w / Math.max(1, box.width);
    if (canvas.width === w && canvas.height === h && target) return;
    canvas.width = w;
    canvas.height = h;
    if (!gl) return;
    if (target) {
      gl.deleteFramebuffer(target.fbo);
      gl.deleteTexture(target.color);
      gl.deleteTexture(target.id);
      gl.deleteTexture(target.sel);
      gl.deleteFramebuffer(target.selFbo);
      gl.deleteRenderbuffer(target.depth);
    }
    const tex = () => {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, w, h);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return t;
    };
    target = { fbo: gl.createFramebuffer(), color: tex(), id: tex(), depth: gl.createRenderbuffer(), sel: tex(), selFbo: gl.createFramebuffer(), w, h };
    gl.bindRenderbuffer(gl.RENDERBUFFER, target.depth);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, target.color, 0);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, target.id, 0);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, target.depth);
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.selFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, target.sel, 0);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, target.depth);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // ── frame ────────────────────────────────────────────────────────────────
  const look = { selected: null, lens: 0, lensTo: 0, lensAt: [0, 0, 0], lensR: 60, glass: 1, glassTo: 1, explode: 0, explodeTo: 0, dark: false, accent: [1, 0.72, 0.2], ink: [0.1, 0.1, 0.11, 0.62] };
  const heart = { base: [0, 0, 0], axis: [0, 0, -1], length: 100, sys: 0, atr: 0, twist: 0.22, quiver: 0 };
  const beats = { age: new Float32Array([99, 99, 99, 99]), q: new Float32Array(4) };

  function ease(dt) {
    const k = 1 - Math.exp(-dt / 0.22);
    const slow = 1 - Math.exp(-dt / 0.5);
    look.lens += (look.lensTo - look.lens) * k;
    look.glass += (look.glassTo - look.glass) * k;
    look.explode += (look.explodeTo - look.explode) * k;
    for (const s of LIST) {
      s.alpha += ((s.hiddenBy ? 0 : s.show) - s.alpha) * k;
      s.dim += (s.dimTo - s.dim) * k;
      for (const key in FX) {
        const now = s.fx[key], to = s.to[key], gate = FX[key];
        if (gate >= 0 && now[gate] < 0.01) { for (let i = 0; i < 4; i++) if (i !== gate) now[i] = to[i]; }
        for (let i = 0; i < 4; i++) now[i] += (to[i] - now[i]) * (gate === i ? slow : k);
      }
      if (s.fx.cut[1] < 0.01) s.fx.cut[2] = s.to.cut[2];
    }
  }

  function setCommon(time) {
    gl.uniform3fv(U.uLo, M.lo);
    gl.uniform3fv(U.uSize, M.size);
    gl.uniform2f(U.uTurn, Math.cos(TURN0 + view.turn), Math.sin(TURN0 + view.turn));
    gl.uniform4fv(U.uCam, CAM.cam);
    gl.uniform3f(U.uOK, CAM.origin[0], CAM.origin[1], CAM.k);
    const sx = (2 * view.scale) / view.width, sy = (-2 * view.scale) / view.height;
    gl.uniform4f(U.uView, sx, sy, (2 * view.tx) / view.width - 1, 1 - (2 * view.ty) / view.height);
    gl.uniform2f(U.uDepth, DEPTH[0], 1 / (DEPTH[1] - DEPTH[0]));
    gl.uniform1f(U.uTime, time);
    gl.uniform4f(U.uTheme, look.dark ? 0.6 : 0.64, look.dark ? 0.62 : 0.54, look.dark ? 0.5 : 0.3, look.dark ? 1 : 0);
    gl.uniform3fv(U.uAccent, look.accent);
    gl.uniform4f(U.uHA, heart.base[0], heart.base[1], heart.base[2], heart.length);
    gl.uniform4fv(U.uBeats, beats.age);
    gl.uniform4fv(U.uBeatQ, beats.q);
    gl.uniform2f(U.uPx, 1 / target.w, 1 / target.h);
    gl.uniform1i(U.uSelTex, 2);
    gl.uniform1f(U.uPre, 0);
    gl.uniform4f(U.uLens, 0, 0, 0, 0);
  }

  function drawOne(s) {
    const e = look.explode;
    gl.uniform3fv(U.uColor, s.color);
    gl.uniform4fv(U.uMat, s.mat);
    gl.uniform4f(U.uState, s.alpha, look.selected === s.id ? 1 : 0, s.dim, s.index);
    // What rides on the selected structure (the coronaries on the heart) is never cut away from it.
    gl.uniform1f(U.uKeep, look.selected && s.ride && S[look.selected].ride ? 1 : 0);
    gl.uniform1i(U.uMode, s.mode);
    gl.uniform3f(U.uShift, s.shift[0] + s.explode[0] * e, s.shift[1] + s.explode[1] * e, s.shift[2] + s.explode[2] * e);
    gl.uniform4fv(U.uPivot, s.pivot);
    const on = s.ride ? 1 : 0;
    gl.uniform4f(U.uHB, heart.axis[0], heart.axis[1], heart.axis[2], heart.sys);
    gl.uniform4f(U.uHC, heart.atr, heart.twist, heart.quiver, on);
    gl.uniform4fv(U.uLA, s.la);
    gl.uniform4fv(U.uLB, s.lb);
    gl.uniform4fv(U.uWave, s.fx.wave);
    gl.uniform4fv(U.uFlow, s.fx.flow);
    gl.uniform4fv(U.uCut, s.fx.cut);
    gl.uniform4fv(U.uSwell, s.fx.swell);
    gl.uniform4fv(U.uTint, s.fx.tint);
    gl.uniform4fv(U.uSpotA, s.fx.spotA);
    gl.uniform4fv(U.uSpotColA, s.fx.spotColA);
    gl.uniform4fv(U.uSpotB, s.fx.spotB);
    gl.uniform4fv(U.uSpotColB, s.fx.spotColB);
    gl.uniform4fv(U.uLevel, s.fx.level);
    gl.uniform4fv(U.uLevelCol, s.fx.levelCol);
    gl.bindVertexArray(s.vao);
    gl.drawElements(gl.TRIANGLES, s.count, gl.UNSIGNED_SHORT, s.offset);
  }

  let drawn = 0;
  function render(time, dt) {
    if (!gl) return;
    resize();
    place(dt);
    ease(dt);
    if (!ready || !target) return;
    gl.viewport(0, 0, target.w, target.h);
    gl.disable(gl.BLEND);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.depthMask(true);
    gl.colorMask(true, true, true, true);
    gl.clearColor(0, 0, 0, 0);
    gl.clearDepth(1);
    gl.disable(gl.CULL_FACE);
    gl.useProgram(main.program);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, null);
    setCommon(time);
    gl.uniform4f(U.uGlass, 0, 0, 1, 0);
    // The selected structure's depth first: the cutaway is cut against it.
    const cut = look.selected && S[look.selected];
    const cutting = cut && look.lens > 0.01 && cut.alpha > 0.5 && cut.id !== "piel";
    if (cutting) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, target.selFbo);
      gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.uniform1f(U.uPre, 1);
      drawOne(cut);
      gl.uniform1f(U.uPre, 0);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    if (cutting) {
      gl.bindTexture(gl.TEXTURE_2D, target.sel);
      gl.uniform4f(U.uLens, look.lens, 13 * view.ratio, 0, 0);
    }
    drawn = 0;
    const skin = S.piel;
    const glass = look.glass > 0.02;
    const soft = [];
    gl.uniform1f(U.uBlend, 0);
    for (const s of LIST) {
      if (s.alpha < 0.004 || (s === skin && glass)) continue;
      if (s.alpha < 0.985) { soft.push(s); continue; }
      drawOne(s);
      drawn++;
    }
    if (soft.length) {
      // Translucent structures: depth first, so only their nearest surface blends over what is solid.
      gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.NONE]);
      gl.uniform1f(U.uBlend, 1);
      gl.colorMask(false, false, false, false);
      for (const s of soft) drawOne(s);
      gl.colorMask(true, true, true, true);
      gl.depthMask(false);
      gl.depthFunc(gl.EQUAL);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      for (const s of soft) drawOne(s);
      gl.disable(gl.BLEND);
      gl.depthFunc(gl.LEQUAL);
      gl.depthMask(true);
      gl.uniform1f(U.uBlend, 0);
      gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
      drawn += soft.length;
    }
    if (skin.alpha > 0.004 && glass) {
      // Glass shell: depth first so only its nearest surface blends over the body.
      gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.NONE]);
      gl.uniform4f(U.uLens, 0, 0, 0, 0);
      gl.uniform4f(U.uGlass, look.dark ? 0.035 : 0.05, look.dark ? 0.5 : 0.42, 2.2, 1);
      gl.enable(gl.CULL_FACE);
      gl.cullFace(gl.BACK);
      gl.colorMask(false, false, false, false);
      drawOne(skin);
      gl.colorMask(true, true, true, true);
      gl.depthMask(false);
      gl.depthFunc(gl.EQUAL);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      drawOne(skin);
      gl.disable(gl.BLEND);
      gl.depthFunc(gl.LEQUAL);
      gl.depthMask(true);
      gl.disable(gl.CULL_FACE);
      gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.disable(gl.DEPTH_TEST);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(post.program);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, target.color);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, target.id);
    gl.uniform1i(UP.uColorTex, 0);
    gl.uniform1i(UP.uIdTex, 1);
    gl.uniform2f(UP.uPx, 1 / target.w, 1 / target.h);
    gl.uniform4fv(UP.uInk, look.ink);
    gl.uniform3fv(UP.uAccent, look.accent);
    const sel = look.selected && S[look.selected];
    gl.uniform2f(UP.uSel, sel ? (sel.index + 0.5) / 255 : 0, sel ? 1 : 0);
    gl.uniform1f(UP.uLine, Math.max(1, view.ratio * 0.55));

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
  }

  /** The structure under a point in CSS pixels: the commonest id in a small disc around it. */
  function pick(x, y, reach = 7) {
    if (!ready || !target) return null;
    const r = Math.max(1, Math.round(reach * view.ratio));
    const cx = Math.round(x * view.ratio), cy = Math.round((view.height - y) * view.ratio);
    const x0 = Math.max(0, cx - r), y0 = Math.max(0, cy - r);
    const w = Math.min(target.w - x0, 2 * r + 1), h = Math.min(target.h - y0, 2 * r + 1);
    if (w <= 0 || h <= 0) return null;
    const px = new Uint8Array(w * h * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    gl.readBuffer(gl.COLOR_ATTACHMENT1);
    gl.readPixels(x0, y0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const votes = new Map();
    let best = null;
    for (let j = 0; j < h; j++) {
      for (let i = 0; i < w; i++) {
        const id = px[(j * w + i) * 4];
        if (!id) continue;
        const d2 = (i + x0 - cx) ** 2 + (j + y0 - cy) ** 2;
        if (d2 > r * r) continue;
        const key = id * 256 + px[(j * w + i) * 4 + 1];
        const score = (votes.get(key) || 0) + 1 / (1 + d2 / (r * r * 0.25));
        votes.set(key, score);
        if (!best || score > best.score) best = { key, score };
      }
    }
    if (!best) return null;
    const s = LIST[(best.key >> 8) - 1];
    return s ? { id: s.id, part: best.key & 255 } : null;
  }

  /** The middle of a structure's cross-section at a fraction of its flow range (0 = where flow enters). */
  function along(id, fraction, part = -1) {
    const s = S[id];
    if (!cpu || !s) return s ? s.meta.c : [0, 0, 1000];
    // With a part, the fraction runs along that part alone.
    const [lo, hi] = part >= 0 ? s.meta.parts[part].flow : s.meta.flow;
    const want = (lo + (hi - lo) * fraction) * 8;
    let reach = Math.max(24, (hi - lo) * 8 * 0.02);
    for (let attempt = 0; attempt < 6; attempt++, reach *= 2.2) {
      let n = 0, x = 0, y = 0, z = 0;
      for (let i = 0; i < s.meta.v[1]; i++) {
        const at = (s.vBase + i) * 12;
        if (Math.abs(cpu.getUint16(at + 6, true) - want) > reach || (part >= 0 && cpu.getUint8(at + 11) !== part)) continue;
        x += cpu.getUint16(at, true); y += cpu.getUint16(at + 2, true); z += cpu.getUint16(at + 4, true);
        n++;
      }
      if (n > 2) return [M.lo[0] + (x / n / 65535) * M.size[0], M.lo[1] + (y / n / 65535) * M.size[1], M.lo[2] + (z / n / 65535) * M.size[2]];
    }
    return s.meta.c;
  }

  /** Run the easing to rest at once (tests and reduced motion). */
  function settle() { for (let i = 0; i < 80; i++) { place(0.05); ease(0.05); } }

  return {
    S, LIST, view, look, heart, beats, settle, init, load, render, pick, toScreen, turned, depthOf, toBox, along,
    get ready() { return ready; }, get failed() { return failed; }, get drawn() { return drawn; }, get gl() { return gl; },
  };
})();

// ── Physio: one model drives the trace, the numbers and the motion of the body ──
// The ECG is a train of events (P, QRS, T…) scheduled by the rhythm; the heart's mechanics,
// the pulse wave and the pleth follow each QRS; breathing has its own rate, depth and pattern.
const Physio = (() => {
  const g = (x, mu, s) => Math.exp(-((x - mu) * (x - mu)) / (2 * s * s));
  const bump = (t, dur) => (t < 0 || t > dur ? 0 : Math.pow(Math.sin((Math.PI * t) / dur), 2));
  const TPL = {
    P: (t) => 0.13 * g(t, 0.05, 0.022),
    N: (t) => -0.1 * g(t, -0.02, 0.007) + 1.0 * g(t, 0, 0.01) - 0.24 * g(t, 0.022, 0.008),
    T: (t) => 0.3 * g(t, 0, 0.055),
    W: (t) => 0.95 * g(t, 0, 0.032) - 0.55 * g(t, 0.07, 0.03),
    U: (t) => -0.32 * g(t, 0, 0.07),
    // ST segment lifted off the baseline, merging into the T wave.
    S: (t) => smooth(0.025, 0.07, t) * (1 - smooth(0.2, 0.34, t)),
  };

  const NORMAL = { rhythm: "sinusal", hr: 72, rr: 14, spo2: 98, sys: 118, dia: 76, temp: 36.6, st: 0, depth: 1, pattern: "normal", perf: 1 };
  const now = { ...NORMAL };
  const to = { ...NORMAL };
  const ecg = { events: [], next: 0, nextP: 0, nextV: 0, seed: 7 };
  let clock = 0;
  let breathPhase = 0;
  let breath = 0;
  const rnd = () => ((ecg.seed = (ecg.seed * 16807) % 2147483647) / 2147483647);

  function sinus(t, hr, p = true) {
    const rr = 60 / hr;
    if (p) ecg.events.push({ t, k: "P" });
    ecg.events.push({ t: t + 0.16, k: "N", q: 1 });
    if (now.st > 0.01) ecg.events.push({ t: t + 0.16, k: "S", amp: now.st });
    ecg.events.push({ t: t + 0.16 + 0.27 * Math.sqrt(Math.min(rr, 1.2)), k: "T", amp: 1 + now.st * 1.4 });
    return rr;
  }
  function schedule(until) {
    const r = now.rhythm;
    if (r === "bav3") {
      while (ecg.nextP < until) { ecg.events.push({ t: ecg.nextP, k: "P" }); ecg.nextP += 0.75; }
      while (ecg.nextV < until) { ecg.events.push({ t: ecg.nextV, k: "W", q: 1 }, { t: ecg.nextV + 0.36, k: "U" }); ecg.nextV += 60 / clamp(now.hr, 25, 50); }
      return;
    }
    while (ecg.next < until) {
      const t = ecg.next;
      const hr = clamp(now.hr, 20, 240);
      if (r === "sinusal") ecg.next += sinus(t, hr);
      else if (r === "tsv") ecg.next += sinus(t, clamp(hr, 150, 240), false);
      else if (r === "fa") {
        const rr = (60 / hr) * (0.62 + rnd() * 0.76);
        ecg.events.push({ t, k: "N", q: clamp(0.45 + rr * 0.9, 0.4, 1) }, { t: t + 0.26, k: "T" });
        ecg.next += rr;
      } else if (r === "flutter") { ecg.events.push({ t, k: "N", q: 1 }, { t: t + 0.23, k: "T" }); ecg.next += 0.4; }
      else if (r === "tv") { ecg.events.push({ t, k: "W", q: 0.5 }, { t: t + 0.17, k: "U" }); ecg.next += 60 / clamp(hr, 140, 240); }
      else ecg.next += 0.5;
    }
  }
  function baseline(t) {
    const r = now.rhythm;
    if (r === "fa") return 0.035 * Math.sin(2 * Math.PI * 5.7 * t) + 0.025 * Math.sin(2 * Math.PI * 8.3 * t + 1.3) + 0.018 * Math.sin(2 * Math.PI * 11.1 * t + 0.4);
    if (r === "flutter") { const f = (t * 5) % 1; return -0.17 * (f < 0.78 ? f / 0.78 : 1 - (f - 0.78) / 0.22) + 0.085; }
    if (r === "fv") return 0.42 * Math.sin(2 * Math.PI * 5.1 * t + 0.9 * Math.sin(0.7 * t)) * (0.6 + 0.4 * Math.sin(2 * Math.PI * 0.43 * t)) + 0.2 * Math.sin(2 * Math.PI * 7.3 * t + 2 * Math.sin(1.1 * t));

  }
  function ecgAt(t) {

  }
  function mechanics(t) {

    for (const e of ecg.events) {

      if (e.k === "P") atr += bump(d - 0.06, 0.12);
      else if (e.q) {
        sys = Math.max(sys, bump(d - 0.03, now.rhythm === "tv" ? 0.24 : 0.34) * e.q);
        const pd = d - 0.22;
        if (pd > 0) pleth += e.q * ((pd / 0.11) * Math.exp(1 - pd / 0.11) + 0.16 * g(pd, 0.36, 0.04));

  }
  const pulseless = () => now.rhythm === "fv" || now.rhythm === "asistolia";

  /** Seconds since each of the last four beats reached the aortic root, and their strength. */
  function beats(t, age, q) {
    let n = 0;
    for (let i = ecg.events.length - 1; i >= 0 && n < 4; i--) {
      const e = ecg.events[i];
      if (!e.q || e.t + 0.06 > t) continue;
      age[n] = t - e.t - 0.06;
      q[n] = e.q * now.perf;
      n++;
    }
    for (; n < 4; n++) { age[n] = 99; q[n] = 0; }
  }
  function measuredRate(t) {
    const qs = ecg.events.filter((e) => e.q && e.t <= t).slice(-4);
    if (pulseless() || qs.length < 2) return null;
    return Math.round((60 * (qs.length - 1)) / (qs[qs.length - 1].t - qs[0].t));
  }

  /** Where the current beat is: seconds since its P wave began, the beat's start time and length. */
  function cycle(t) {
    let start = null, next = null;
    for (let i = ecg.events.length - 1; i >= 0; i--) {
      const e = ecg.events[i];
      if (!e.q) continue;
      if (e.t - 0.16 <= t) { start = e.t - 0.16; break; }
      next = e.t - 0.16;
    }
    if (start === null) return { pos: 0, start: t, rr: 60 / Math.max(30, now.hr) };
    return { pos: t - start, start, rr: next !== null ? next - start : 60 / Math.max(30, now.hr) };
  }

  const BREATH = {
    normal: (ph) => (ph < 0.4 ? smooth(0, 0.4, ph) : 1 - smooth(0.4, 1, ph)),
    // Obstructed airway: a quick breath in and a long way out.
    obstructivo: (ph) => (ph < 0.26 ? smooth(0, 0.26, ph) : 1 - smooth(0.26, 1, ph) ** 0.8),
    kussmaul: (ph) => (ph < 0.46 ? smooth(0, 0.46, ph) : 1 - smooth(0.46, 0.96, ph)),
  };

  function set(values, { instant = false } = {}) {
    const changed = values.rhythm && values.rhythm !== now.rhythm;
    Object.assign(to, values);
    if (values.rhythm) now.rhythm = values.rhythm;
    if (values.pattern) now.pattern = values.pattern;
    if (instant) for (const key of Object.keys(to)) now[key] = to[key];
    if (changed) {
      ecg.events = ecg.events.filter((e) => e.t < clock);
      const lastQ = ecg.events.filter((e) => e.q).reduce((m, e) => Math.max(m, e.t), -9);
      ecg.next = ecg.nextP = ecg.nextV = Math.max(clock + 0.05, lastQ + 0.4);
    }
    bus.emit("vitals");
  }
  const reset = (options) => set({ ...NORMAL }, options);

  function tick(dt) {
    clock += dt;
    const k = 1 - Math.exp(-dt / 1.1);
    for (const key of ["hr", "rr", "spo2", "sys", "dia", "temp", "st", "depth", "perf"]) now[key] += (to[key] - now[key]) * k;
    schedule(clock + 2);
    if (ecg.events.length > 500) ecg.events = ecg.events.filter((e) => e.t > clock - 6);
    const arrest = pulseless();
    const rate = arrest ? 0 : now.rr;
    breathPhase = (breathPhase + (dt * rate) / 60) % 1;
    const shape = (BREATH[now.pattern] || BREATH.normal)(breathPhase);
    const target = arrest ? 0 : shape * now.depth;
    breath += (target - breath) * (1 - Math.exp(-dt / 0.08));
    return clock;
  }

  return {
    now, to, NORMAL, set, reset, tick, ecgAt, mechanics, beats, measuredRate, pulseless, cycle, speed: 1,
    get clock() { return clock; },
    get breath() { return breath; },
  };
})();

// ── Monitor: the bedside strip (ECG and pleth drawn by a shader) and its numbers ──
const Monitor = (() => {
  const N = 512;
  const SWEEP = 4;
  const ecgBuf = new Float32Array(N).fill(0.316);
  const plBuf = new Float32Array(N).fill(0);
  const bytes = new Uint8Array(N * 4);
  let root, canvas, gl = null, prog = null, tex = null, ctx2d = null;
  const uni = {};
  let lastIdx = -1, shown = false, vitalsAt = 0, soundOn = false, audio = null, lastBeat = -1;
  const el = {};

  const FRAG = `precision highp float;
uniform sampler2D uTex;uniform vec2 uRes;uniform float uHead;uniform float uDpr;uniform vec3 uTrace;
const float N=${N}.0;
vec2 sampleAt(float i){vec4 c=texture2D(uTex,vec2((mod(i,N)+.5)/N,.5));return vec2((c.r*65280.+c.g*255.)/65535.,c.b);}
float seg(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/max(dot(ba,ba),1e-4),0.,1.);return length(pa-ba*h);}
void main(){
  vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y);
  float u=p.x/uRes.x;
  float fi=u*N;
  float y0=uRes.y*.20,y1=uRes.y*.70,q0=uRes.y*.76,q1=uRes.y*.95;
  float dE=1e4,dP=1e4;
  for(int k=-3;k<=3;k++){
    float i=floor(fi)+float(k);
    vec2 s0=sampleAt(i),s1=sampleAt(i+1.);
    vec2 a=vec2(i/N*uRes.x,mix(y1,y0,s0.x)),b=vec2((i+1.)/N*uRes.x,mix(y1,y0,s1.x));
    dE=min(dE,seg(p,a,b));
    vec2 c=vec2(i/N*uRes.x,mix(q1,q0,s0.y)),d=vec2((i+1.)/N*uRes.x,mix(q1,q0,s1.y));
    dP=min(dP,seg(p,c,d));
  }
  float age=fract(uHead-u);
  float alive=1.-smoothstep(.955,.985,age);
  float persist=mix(1.,.42,smoothstep(0.,.9,age))*alive;
  float w=.85*uDpr;
  float eC=exp(-(dE*dE)/(w*w))+.42*exp(-dE/(3.2*uDpr));
  float pC=exp(-(dP*dP)/(w*w*.8))+.3*exp(-dP/(3.*uDpr));
  vec3 bg=vec3(.027,.066,.047);
  float gx=abs(fract(u*20.)-.5)*uRes.x/20.;
  float gy=abs(fract(p.y/(uRes.y/5.))-.5)*uRes.y/5.;
  float grid=(1.-smoothstep(0.,.7*uDpr,gx))*.05+(1.-smoothstep(0.,.7*uDpr,gy))*.035;
  vec3 col=bg+vec3(.06,.18,.11)*grid;
  col+=uTrace*eC*persist*1.05;
  col+=vec3(.35,.84,1.)*pC*persist*.8;
  float head=exp(-pow(length(p-vec2(uHead*uRes.x,mix(y1,y0,sampleAt(floor(uHead*N)-1.).x)))/(2.2*uDpr),2.));
  col+=vec3(.75,1.,.85)*head*.9;
  col=1.-exp(-col*1.25);
  float n=(fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453)-.5)/255.;
  gl_FragColor=vec4(col+n,1.);
}`;

  function initGL() {
    try {
      gl = canvas.getContext("webgl", { antialias: false, premultipliedAlpha: false, alpha: false });
    } catch {
      gl = null;
    }
    if (!gl) return false;
    const sh = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);

  const norm01 = (v) => clamp((v + 0.6) / 1.9);

    const dpr = Math.min(2.5, window.devicePixelRatio || 1);
    const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
    if (w && h && (canvas.width !== w || canvas.height !== h)) { canvas.width = w; canvas.height = h; }

    const head = Math.floor(((t / SWEEP) % 1) * N);

    let i = lastIdx, guard = 0;
    while (i !== head && guard++ < N) {

      const back = ((head - i + N) % N) * (SWEEP / N);
      ecgBuf[i] = norm01(Physio.ecgAt(t - back));
      plBuf[i] = Math.min(1, Physio.mechanics(t - back).pleth / 1.2);
    }
    lastIdx = head;
    return (t / SWEEP) % 1;
  }
  function draw(headU) {
    const dpr = fit();
    const danger = Physio.pulseless() || Physio.now.rhythm === "tv";
    if (gl) {
      for (let i = 0; i < N; i++) {

        bytes[i * 4] = q >> 8; bytes[i * 4 + 1] = q & 255; bytes[i * 4 + 2] = Math.round(plBuf[i] * 255); bytes[i * 4 + 3] = 255;
      }
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.bindTexture(gl.TEXTURE_2D, tex);

      gl.uniform1f(uni.uHead, headU);
      gl.uniform1f(uni.uDpr, dpr);
      gl.uniform3f(uni.uTrace, danger ? 1 : 0.36, danger ? 0.45 : 1, danger ? 0.4 : 0.6);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      return;
    }
    const c = ctx2d, W = canvas.width, H = canvas.height;
    c.fillStyle = "#07110c"; c.fillRect(0, 0, W, H);
    const line = (buf, y0, y1, color) => {
      c.strokeStyle = color; c.lineWidth = 1.4 * dpr; c.beginPath();
      let started = false;
      for (let i = 0; i < N; i++) {
        if ((headU - i / N + 1) % 1 > 0.96) { started = false; continue; }
        const x = (i / N) * W, y = y1 + (y0 - y1) * buf[i];
        if (!started) { c.moveTo(x, y); started = true; } else c.lineTo(x, y);
      }
      c.stroke();

// ── Sheet: the bottom panel with three heights, the tab bar and the toast ──
const Sheet = (() => {
  const app = $(".app"), sheet = $(".sheet"), grab = $(".grab"), scroll = $(".sheet-scroll"), view = $(".view"), toastEl = $(".toast");
  const root = document.documentElement;
  const ORDER = ["peek", "mid", "full"];
  let snap = "peek", peek = 168, height = 168, safeT = 0, safeB = 0, drag = null, toastTimer = 0;

  function measure() {

    document.body.appendChild(probe);
    const cs = getComputedStyle(probe);
    safeT = parseFloat(cs.height) || 0;
    safeB = parseFloat(cs.paddingBottom) || 0;
    probe.remove();
  }

  function layout() {
    const mon = Monitor.shown ? 70 : 0;
    root.style.setProperty("--sheet-h", height + "px");
    root.style.setProperty("--mon-h", mon + "px");
    const cover = Math.min(height, innerHeight * 0.47);
    Body.view.inset = wide()
      ? { top: safeT + 40, right: 432, bottom: 20, left: 60 }
      : { top: safeT + 38, right: 58, bottom: tabH() + cover + mon + 30, left: 10 };
  }
  function set(name, { peekHeight } = {}) {
    if (peekHeight) peek = peekHeight;
    snap = name;
    height = heights()[snap];
    sheet.dataset.snap = snap;
    layout();
  }
  /** At least this tall (never shrinks a sheet the reader opened wider). */
  function atLeast(name) {
    if (ORDER.indexOf(snap) < ORDER.indexOf(name)) set(name);
  }

  function bindDrag(target) {
    target.addEventListener("pointerdown", (e) => {
      // The handle always drags; the content drags by its header, or anywhere while the sheet is at its lowest.
      if (target !== grab && (e.target.closest("button,input,a,canvas") || !(snap === "peek" || e.target.closest(".head")))) return;
      drag = { y: e.clientY, h: height, t: performance.now(), moved: 0, id: e.pointerId, last: e.clientY, v: 0 };
    });
  }
  window.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dy = e.clientY - drag.y;
    drag.moved = Math.max(drag.moved, Math.abs(dy));
    if (drag.moved < 5) return;
    app.setAttribute("data-dragging", "");
    const h = heights();
    drag.v = e.clientY - drag.last;
    drag.last = e.clientY;
    height = clamp(drag.h - dy, h.peek - 30, h.full + 20);

    layout();
  });

    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    app.removeAttribute("data-dragging");
    const h = heights();
    if (d.moved < 5) {
      if (e.target.closest(".grab")) set(ORDER[(ORDER.indexOf(snap) + 1) % 3]);
      return;
    }
    const aim = height - d.v * 14;
    let best = "peek";
    for (const name of ORDER) if (Math.abs(h[name] - aim) < Math.abs(h[best] - aim)) best = name;

  };

  window.addEventListener("pointercancel", release);

  function html(markup, { top = true } = {}) {
    view.innerHTML = markup;
    if (top) scroll.scrollTop = 0;
  }
  function toast(text, tone = "") {
    toastEl.textContent = text;
    toastEl.dataset.tone = tone;
    toastEl.setAttribute("data-on", "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.removeAttribute("data-on"), 1900);
  }

  function init() {
    measure();
    bindDrag(grab);
    bindDrag(view);
    window.addEventListener("resize", () => { measure(); set(snap); });
    bus.on("layout", layout);
    set("peek");
  }
  return { init, set, atLeast, html, toast, layout, view, scroll, get snap() { return snap; }, get safeT() { return safeT; } };
})();
