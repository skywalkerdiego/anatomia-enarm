  }

  // Heart sounds: two short low thumps per beat, S1 at the QRS and S2 as systole ends.
  function thump(when, freq, gain, length) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(freq * 1.5, when);
    o.frequency.exponentialRampToValueAtTime(freq, when + length);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(gain, when + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, when + length);
    o.connect(g).connect(audio.destination);
    o.start(when);
    o.stop(when + length + 0.02);
  }
  function sounds() {
    if (!soundOn || !audio) return;
    const age = Body.beats.age[0];
    const stamp = Math.round((Physio.clock - age) * 20);
    if (age < 0.2 && stamp !== lastBeat && Body.beats.q[0] > 0.1) {
      lastBeat = stamp;
      const t = audio.currentTime + 0.01;
      thump(t, 58, 0.5 * Body.beats.q[0], 0.11);
      thump(t + clamp(0.3 * Math.sqrt(60 / Math.max(40, Physio.now.hr)), 0.16, 0.36), 82, 0.34 * Body.beats.q[0], 0.07);
    }
  }
  function setSound(on) {
    soundOn = on;
    if (on && !audio) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audio = new Ctx();
    }
    if (on && audio && audio.state === "suspended") audio.resume();
    el.sound.innerHTML = icon(on ? "sound" : "mute");
    el.sound.setAttribute("aria-pressed", String(on));
  }

  const RHYTHM_NAME = { sinusal: "Ritmo sinusal", tsv: "Taquicardia supraventricular", fa: "Fibrilación auricular", flutter: "Flutter auricular 2:1", bav3: "BAV de tercer grado", tv: "Taquicardia ventricular", fv: "Fibrilación ventricular", asistolia: "Asistolia" };
  function label() {
    const p = Physio.now;
    if (p.rhythm !== "sinusal") return RHYTHM_NAME[p.rhythm];
    if (p.st > 0.12) return "Sinusal · elevación del ST";
    return p.hr > 100 ? "Taquicardia sinusal" : p.hr < 60 ? "Bradicardia sinusal" : "Ritmo sinusal";
  }
  function numbers(t) {
    const p = Physio.now;
    const arrest = Physio.pulseless();
    const rate = Physio.measuredRate(t);
    el.hr.textContent = arrest ? "---" : rate ?? "--";
    el.sp.textContent = arrest ? "--" : Math.round(p.spo2);
    el.rr.textContent = arrest ? "0" : Math.round(p.rr);
    el.bp.textContent = arrest ? "--/--" : `${Math.round(p.sys)}/${Math.round(p.dia)}`;
    el.rhythm.textContent = label();
    root.toggleAttribute("data-alarm", arrest || p.spo2 < 90 || p.sys < 90 || (rate ?? 80) > 150 || (rate ?? 80) < 40);
    el.sp.parentElement.toggleAttribute("data-low", !arrest && p.spo2 < 92);
    el.bp.parentElement.toggleAttribute("data-low", !arrest && p.sys < 90);
  }

  function init() {
    root = $(".monitor");
    canvas = $(".ecg", root);
    for (const key of ["hr", "sp", "rr", "bp", "rhythm"]) el[key] = $(`[data-${key}]`, root);
    el.sound = $(".mon-sound", root);
    if (!initGL()) ctx2d = canvas.getContext("2d");
    el.sound.addEventListener("click", (e) => { e.stopPropagation(); setSound(!soundOn); });
    root.addEventListener("click", () => bus.emit("monitor-tap"));
    setSound(false);
  }
  function show(on) {
    shown = on;
    root.toggleAttribute("data-on", on);
    bus.emit("layout");
  }
  function frame(t) {
    sounds();
    if (!shown) return;
    if (still.matches) {
      for (let i = 0; i < N; i++) { const at = t - SWEEP + ((i + 1) * SWEEP) / N; ecgBuf[i] = norm01(Physio.ecgAt(at)); plBuf[i] = Math.min(1, Physio.mechanics(at).pleth / 1.2); }

    } else draw(sweep(t));
    if (t - vitalsAt > 0.4 || t < vitalsAt) { vitalsAt = t; numbers(t); }
  }
  return { init, show, frame, setSound, label, get shown() { return shown; }, get sound() { return soundOn; } };
})();

// ── Stage: what the body shows and how it moves ──
// Layers, selection with its cutaway, the camera, touch gestures, the stand's moving parts,
// labels pinned to 3D points, and the scenes that processes and cases play on the model.
const Stage = (() => {
  const B = Body;
  const S = B.S;
  const CAM = D.cam;
  const el = {};
  const layers = Object.assign({ piel: true, hueso: true, organo: true, vaso: true, nervio: true }, store.get("layers", {}));
  let selected = null, part = -1, touched = false, idleClock = 0, sceneOn = false;
  const hidden = new Set();
  const ghosts = {};
  const only = { on: false, ids: new Set() };
  const lungs = { der: { collapse: 0, to: 0 }, izq: { collapse: 0, to: 0 } };
  const drive = { contract: 1, contractTo: 1, breathScale: 1 };
  const pins = [];

  const RIDERS = ["corazon", "valvulas", "cor-izq", "cor-da", "cor-cx", "cor-der", "venas-cardiacas"];
  const LUNG = { "pulmon-der-sup": "der", "pulmon-der-med": "der", "pulmon-der-inf": "der", "pulmon-izq-sup": "izq", "pulmon-izq-inf": "izq" };
  const GUT = ["esofago", "estomago", "duodeno", "yeyuno", "ileon", "colon", "apendice", "recto"];
  const PULSE = { aorta: 1.5, "art-pulmonar": 1.1, carotidas: 0.9, subclavias: 0.9, "tronco-celiaco": 0.7, mesentericas: 0.6, "art-renales": 0.6, "art-iliacas": 0.9, "cor-izq": 0.4, "cor-da": 0.4, "cor-cx": 0.4, "cor-der": 0.4 };
  const VEINS = ["vcs", "vci", "yugulares", "ven-renales", "ven-iliacas", "porta", "venas-cardiacas", "ven-pulmonares"];
  // How far each organ under the diaphragm follows it down in a quiet breath (mm).
  const SINK = { higado: 13, vesicula: 13, estomago: 11, bazo: 11, pancreas: 5, duodeno: 5, "rinon-der": 8, "rinon-izq": 8, suprarrenales: 8, colon: 3, yeyuno: 3 };
  const QUIET = new Set(["ganglios"]);
  const CAGE = ["costillas", "cartilagos", "esternon", "m-intercostales", "m-pectorales", "mamas", "n-intercostales", "art-tronco", "ven-tronco"];
  const base = {};

  // ── vertebral levels from the model's own vertebrae ─────────────────────
  const ORD = { first: 1, second: 2, third: 3, fourth: 4, fifth: 5, sixth: 6, seventh: 7, eighth: 8, ninth: 9, tenth: 10, eleventh: 11, twelfth: 12 };
  const LEVELS = [];
  for (const [id, letter] of [["col-cervical", "C"], ["col-toracica", "T"], ["col-lumbar", "L"]]) {
    for (const p of S[id].meta.parts) {
      const word = p.n.split(" ")[0];
      const n = p.n === "atlas" ? 1 : p.n === "axis" ? 2 : ORD[word];
      LEVELS.push({ name: letter + n, z: p.c[2], lo: p.lo[2], hi: p.hi[2] });
    }
  }
  LEVELS.push({ name: "S", z: S.sacro.meta.c[2], lo: S.sacro.meta.lo[2], hi: S.sacro.meta.hi[2] });
  LEVELS.sort((a, b) => b.z - a.z);
  function levelAt(z) {
    if (z > LEVELS[0].hi + 12 || z < LEVELS[LEVELS.length - 1].lo - 12) return null;
    let best = LEVELS[0];
    for (const l of LEVELS) if (Math.abs(l.z - z) < Math.abs(best.z - z)) best = l;
    return best.name;
  }
  function levelSpan(lo, hi) {
    const a = levelAt(hi), b = levelAt(lo);
    if (!a && !b) return "";
    if (!a || !b || a === b) return a || b;
    return `${a}–${b}`;
  }
  const vertebra = (name) => LEVELS.find((l) => l.name === name);

  // ── anchors: "id", "id@0.3" (along its flow), "id#part name", "T10" (a level), [x, y, z] ──
  const NAMED = {
    "@sa": () => B.along("vcs", 0),
    "@la": () => B.along("ven-pulmonares", 0.03),
    "@ra": () => { const a = B.along("vcs", 0), b = B.along("vci", 0); return [(a[0] + b[0]) / 2 - 6, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2]; },
    "@apex": () => B.heart.base.map((v, i) => v + B.heart.axis[i] * B.heart.length * 0.95),
    "@av": () => B.heart.base.map((v, i) => v + B.heart.axis[i] * B.heart.length * 0.37),
    "@lv": () => B.heart.base.map((v, i) => v + B.heart.axis[i] * B.heart.length * 0.7 + [12, 6, 0][i]),

    }

    if (level) return [0, 55, level.z];

  // ── setup ────────────────────────────────────────────────────────────────
  function setup() {
    const lungBox = { der: { lo: [9e9, 9e9, 9e9], hi: [-9e9, -9e9, -9e9] }, izq: { lo: [9e9, 9e9, 9e9], hi: [-9e9, -9e9, -9e9] } };

      } else if (VEINS.includes(s.id)) {
        s.mode = 3;
        base[s.id] = { wave: [1, 0, 0, 0], flow: [-64, 36, 0.13, 0] };
      } else if (GUT.includes(s.id)) {
        s.mode = 3;
        base[s.id] = { wave: [s.id === "esofago" ? 30 : 16, 150, s.id === "esofago" ? 0.4 : 1.2, 1], flow: [0, 60, 0, 0] };
      } else if (s.id === "ureteres") {
        s.mode = 3;
        base[s.id] = { wave: [24, 110, 0.5, 1], flow: [0, 60, 0, 0] };
      } else if (s.kind === "nerve") {
        // Impulses: bright packets running out along every nerve.
        s.mode = 3;
        base[s.id] = { wave: [520, 340, 0, 2], flow: [0, 60, 0, 1.5] };
      } else if (s.kind === "art") {
        s.mode = 3;
        base[s.id] = { wave: [1100, 0, 0.35, 0], flow: [0, 60, 0, 0.28] };
      } else if (s.kind === "ven") {
        s.mode = 3;
        base[s.id] = { wave: [1, 0, 0, 0], flow: [-60, 36, 0.12, 0] };

  // ── layers and visibility ────────────────────────────────────────────────
  function applyLayers() {

// ── Sheet: the bottom panel with three heights, the tab bar and the toast ──
const Sheet = (() => {

    const NAMES = { "frontal bone": "Hueso frontal", "occipital bone": "Hueso occipital", "sphenoid bone": "Esfenoides", ethmoid: "Etmoides", vomer: "Vómer", manubrium: "Manubrio", "body of sternum": "Cuerpo del esternón", "xiphoid process": "Apófisis xifoides", "ascending aorta": "Aorta ascendente", "arch of aorta": "Cayado aórtico", "descending aorta": "Aorta descendente", "celiac artery": "Tronco celiaco", "common hepatic artery": "Arteria hepática común", "splenic artery": "Arteria esplénica", "left gastric artery": "Arteria gástrica izquierda", "superior mesenteric artery": "Mesentérica superior", "inferior mesenteric artery": "Mesentérica inferior", "superior vena cava": "Vena cava superior", "splenic vein": "Vena esplénica", "superior mesenteric vein": "Vena mesentérica superior", "mitral valve": "Válvula mitral", "tricuspid valve": "Válvula tricúspide", "pulmonary valve": "Válvula pulmonar", "thyroid cartilage": "Cartílago tiroides", "hyoid bone": "Hueso hioides", pons: "Puente", "medulla oblongata": "Bulbo raquídeo", "midbrain, nsn": "Mesencéfalo", "peduncle of midbrain": "Pedúnculos cerebrales", "third ventricle": "Tercer ventrículo", "fourth ventricle": "Cuarto ventrículo", "cerebral aqueduct": "Acueducto de Silvio", "optic chiasm": "Quiasma óptico", eyeball: "Globos oculares", "corpus callosum": "Cuerpo calloso", prostate: "Próstata", urethra: "Uretra", "glans penis": "Glande", "brachiocephalic artery, nsn": "Tronco braquiocefálico", "pancreatic duct": "Conducto de Wirsung", "stem of left coronary artery": "Tronco coronario izquierdo", "coronary sinus": "Seno coronario", "great cardiac vein": "Vena cardiaca magna", "middle cardiac vein": "Vena cardiaca media" };
    if (NAMES[n]) return NAMES[n];
    const BONES = { parietal: "Parietal", temporal: "Temporal", zygomatic: "Cigomático", nasal: "Hueso nasal", lacrimal: "Lagrimal", palatine: "Palatino", maxilla: "Maxilar", clavicle: "Clavícula", scapula: "Escápula", humerus: "Húmero", radius: "Radio", ulna: "Cúbito", femur: "Fémur", patella: "Rótula", tibia: "Tibia", fibula: "Peroné", "hip bone": "Coxal", talus: "Astrágalo", calcaneus: "Calcáneo", scaphoid: "Escafoides", lunate: "Semilunar", kidney: "Riñón", ureter: "Uréter", "adrenal gland": "Suprarrenal", testis: "Testículo", "common carotid artery": "Carótida común", "subclavian artery": "Arteria subclavia", "renal artery": "Arteria renal", "renal vein": "Vena renal", "internal jugular vein": "Yugular interna", "subclavian vein": "Vena subclavia", "brachiocephalic vein": "Vena braquiocefálica", "common iliac artery": "Ilíaca común", "external iliac artery": "Ilíaca externa", "internal iliac artery": "Ilíaca interna", "common iliac vein": "Vena ilíaca común", "external iliac vein": "Vena ilíaca externa", "internal iliac vein": "Vena ilíaca interna", thalamus: "Tálamo", putamen: "Putamen", "caudate nucleus": "Núcleo caudado", "globus pallidus": "Globo pálido", hippocampus: "Hipocampo", amygdala: "Amígdala", "lateral ventricle": "Ventrículo lateral", "optic nerve": "Nervio óptico", "optic tract": "Cintilla óptica", "precentral gyrus": "Giro precentral", "postcentral gyrus": "Giro poscentral", "occipital lobe": "Lóbulo occipital", insula: "Ínsula", "cingulate gyrus": "Giro del cíngulo" };
    for (const [key, name] of Object.entries(BONES)) if (n.endsWith(key)) return side ? `${name} ${/a$/.test(name.split(" ")[0]) ? side.replace(/o$/, "a") : side}` : name;
    return "";
  }

  const visible = () => {
    const q = norm(state.query.trim());
    return Body.LIST.filter((s) => s.id !== "piel" && (!state.sys || s.info.sys === state.sys) && (!q || norm(`${s.info.name} ${s.info.short} ${D.cards[s.info.card]?.name || ""}`).includes(q)));
  };
  const rowOf = (s) => {
    const span = Stage.levelSpan(s.meta.lo[2], s.meta.hi[2]);
    const card = D.cards[s.info.card];
    return `<button class="row" data-pick="${s.id}"><i class="dot" style="--dot:${s.info.hex}"></i><span><b>${esc(s.info.name)}</b><small>${esc(span ? `Nivel ${span}` : card ? card.level : "")}</small></span>${icon("next").replace('class="ic"', 'class="ic go"')}</button>`;
  };
  function listHtml() {
    const chips = [`<button class="chip" data-sys="" aria-pressed="${!state.sys}">Todo</button>`, ...D.systems.map((s) => `<button class="chip" data-sys="${s.id}" aria-pressed="${state.sys === s.id}">${esc(s.name)}</button>`)].join("");
    const list = visible();
    let rows;
    if (!list.length) rows = `<p class="muted" style="padding:14px 8px">Nada coincide con «${esc(state.query)}».</p>`;
    else if (state.query || state.sys) rows = list.map(rowOf).join("");
    else rows = D.systems.map((sys) => `<h3 style="padding:0 8px">${esc(sys.name)}</h3>` + list.filter((s) => s.info.sys === sys.id).map(rowOf).join("")).join("");
    const fact = D.facts[Math.floor(Date.now() / 60000) % D.facts.length];
    return `<div class="head"><label class="search">${icon("search")}<input type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Buscar: bazo, T10, coronaria…" value="${esc(state.query)}" aria-label="Buscar estructura"></label></div><div class="chips" role="group" aria-label="Sistemas">${chips}</div><div class="pearl" style="margin-top:12px"><b>Dato curioso</b>${esc(fact)}</div><div class="rows">${rows}</div><p class="foot">Modelos: BodyParts3D © The Database Center for Life Science (CC BY-SA 2.1 JP) y Z-Anatomy (CC BY-SA 4.0), procesados con Blender. El cuerpo femenino parte del masculino, con órganos modelados a partir de medidas de referencia. Material de estudio: confirma siempre con tu bibliografía y las guías vigentes.</p><p class="foot"><a href="torso.html" style="color:inherit">Maqueta isométrica del torso (versión anterior)</a></p>`;
  }
  function cardHtml(id) {
    const s = Body.S[id];
    const card = D.cards[s.info.card];
    const sys = D.systems.find((x) => x.id === s.info.sys);
    const span = Stage.levelSpan(s.meta.lo[2], s.meta.hi[2]);
    const piece = partName(id, Stage.part);
    const tags = [span && `<span class="tag" data-tone="accent">Nivel ${span}</span>`, piece && `<span class="tag">${esc(piece)}</span>`, card && `<span class="tag">${esc(card.level)}</span>`].filter(Boolean).join("");
    const head = `<div class="head"><button class="round" data-act="back" aria-label="Volver a la lista">${icon("back")}</button><h2><span class="sub">${esc(sys ? sys.name : "")}</span>${esc(s.info.name)}</h2><button class="round" data-act="isolate" aria-pressed="${state.isolated}" aria-label="Aislar esta estructura" title="Aislar">${icon("layers")}</button></div>`;
    if (!card) return head + `<div class="tagline">${tags}</div>`;
    const also = card.name !== s.info.name ? `<p class="muted" style="font-size:13px">Ficha: ${esc(card.name)}</p>` : "";
    const related = D.cases.filter((c) => (c.organs || []).includes(s.info.card)).map((c) => `<button class="chip" data-case="${c.id}">${icon("cases")}${esc(c.title)}</button>`).join("");
    return `${head}<div class="tagline">${tags}</div>${also}${card.sections.map(([h, items]) => `<h3>${esc(h)}</h3><ul>${items.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`).join("")}<div class="pearl"><b>Perla ENARM</b>${esc(card.pearl)}</div>${related ? `<h3>Casos para practicar</h3><div class="chips" style="margin-top:0">${related}</div>` : ""}<div class="actions">${card.quiz?.length ? `<button class="btn" data-act="quiz" data-card="${s.info.card}">Preguntas (${card.quiz.length})</button>` : ""}<button class="btn ghost" data-act="back">Lista</button></div>`;
  }

  function render({ keepInput = false } = {}) {
    const id = Stage.selected;
    if (id && id !== "piel") {
      Sheet.html(cardHtml(id));
      Sheet.atLeast("mid");
      $("[data-hint]").textContent = "Toca fuera para soltar";
      return;
    }
    if (keepInput) {
      $(".rows", Sheet.view).innerHTML = (() => { const tmp = document.createElement("div"); tmp.innerHTML = listHtml(); return $(".rows", tmp).innerHTML; })();
      $$(".chip[data-sys]", Sheet.view).forEach((c) => c.setAttribute("aria-pressed", String((c.dataset.sys || "") === state.sys)));
    } else Sheet.html(listHtml());
    $("[data-hint]").textContent = "Arrastra para girar · toca un órgano";
  }
  function isolate(on) {
    state.isolated = on;
    const id = Stage.selected;
    if (on && id) Stage.scene({ only: [id], select: id, reset: false });
    else { const keep = Stage.selected; Stage.endScene(); if (keep) Stage.select(keep, { quiet: true, focus: false }); }

  }

  function bind() {
    Sheet.view.addEventListener("input", (e) => {
      if (Tabs.now !== "explorar" || !e.target.matches(".search input")) return;
      state.query = e.target.value;
      render({ keepInput: true });
      if (state.query) Sheet.atLeast("mid");
    });
    Sheet.view.addEventListener("focusin", (e) => { if (Tabs.now === "explorar" && e.target.matches(".search input")) Sheet.atLeast("mid"); });
    Sheet.view.addEventListener("click", (e) => {
      if (Tabs.now !== "explorar") return;
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.sys !== undefined) { state.sys = b.dataset.sys; render({ keepInput: true }); Sheet.atLeast("mid"); }
      else if (b.dataset.pick) { Stage.touch(); Stage.select(b.dataset.pick); }
      else if (b.dataset.act === "back") { if (state.isolated) isolate(false); Stage.select(null); Stage.home(); Sheet.set("mid"); }
      else if (b.dataset.act === "isolate") isolate(!state.isolated);
      else if (b.dataset.act === "quiz") { Quiz.startCard(b.dataset.card); }
      else if (b.dataset.case) Cases.open(b.dataset.case);
    });
    bus.on("tap", ({ hit }) => {
      if (Tabs.now !== "explorar") return;
      if (state.isolated && (!hit || hit.id !== Stage.selected)) isolate(false);
      if (!hit || hit.id === "piel") { Stage.select(null); if (Sheet.snap !== "peek") Sheet.set("peek", { peekHeight: PEEK }); return; }
      Stage.select(hit.id, { partIndex: hit.part });
    });
    bus.on("select", () => { if (Tabs.now === "explorar") render(); });
  }
  function enter() {
    Monitor.show(false);
    Sheet.set(Stage.selected ? "mid" : "peek", { peekHeight: PEEK });
    render();
  }
  function leave() {
    if (state.isolated) isolate(false);
    Stage.select(null, { quiet: true });
  }
  function root() {
    if (state.isolated) isolate(false);
    Stage.select(null);
    Stage.home();
    state.query = "";
    state.sys = "";
    Sheet.set("peek", { peekHeight: PEEK });
    render();
  }
  /** Open the card from another mode: go to the explorer with its first structure selected. */
  function openCard(card) {
    const s = Body.LIST.find((x) => x.info.card === card);
    Tabs.set("explorar", { silent: true });
    Monitor.show(false);
    Sheet.set("mid", { peekHeight: PEEK });

  }

})();

// ── Processes: physiology played step by step on the body ──
// Each step sets a scene (what shows, what flows, where the camera looks), the vital signs and
// the clock's speed; some steps add a live animation or the Wiggers chart, both read from Physio.
const Processes = (() => {
  const state = { id: null, step: 0, auto: false, autoAt: 0, rhythm: false };
  const seen = store.get("processes", {});
  let chart = null;

  // ── the cardiac cycle as curves over one beat at 72 bpm (seconds from the P wave) ──
  const W = { ivc: 0.19, open: 0.24, close: 0.46, mitral: 0.54, end: 0.833 };
  const hump = (x) => (x <= 0 || x >= 1 ? 0 : Math.sin(Math.PI * x) ** 2);
  const lvp = (t) => {
    if (t < W.ivc) return 7 + 3 * hump((t - 0.05) / 0.13);
    if (t < W.open) return mix(9, 80, smooth(W.ivc, W.open, t));
    if (t < W.close) return 80 + 40 * Math.sin(Math.PI * ((t - W.open) / (W.close - W.open)) * 0.86);
    if (t < W.mitral) return mix(97, 6, smooth(W.close, W.mitral, t));
    return mix(5, 7, (t - W.mitral) / (W.end - W.mitral));
  };
  const aop = (t) => {
    if (t >= W.open && t < W.close) return lvp(t) - 3;
    const s = t >= W.close ? t - W.close : t + W.end - W.close;
    return 78 + 17 * Math.exp(-s / 0.42) + 5 * hump((s - 0.012) / 0.07);
  };
  const lap = (t) => 5 + 4 * hump((t - 0.04) / 0.14) + 2.4 * hump((t - 0.18) / 0.07) + (t > 0.27 && t < W.mitral ? 7 * smooth(0.27, W.mitral, t) - 2 * (1 - smooth(0.27, 0.34, t)) : 0) + (t >= W.mitral ? 7 * (1 - smooth(W.mitral, 0.64, t)) : 0) - (t > 0.2 && t <= 0.27 ? 2 * smooth(0.2, 0.27, t) : 0);
  const volume = (t) => {
    if (t < 0.06) return 108;
    if (t < W.ivc) return 108 + 14 * smooth(0.06, 0.17, t);
    if (t < W.open) return 122;
    if (t < W.close) return mix(122, 52, smooth(W.open, W.close, t) ** 0.8);
    if (t < W.mitral) return 52;
    return 52 + 50 * (1 - Math.exp(-(t - W.mitral) / 0.07)) + 6 * ((t - W.mitral) / (W.end - W.mitral));
  };
  const PHASES = [
    { id: "llenado", from: W.mitral - W.end, to: 0.04, name: "Llenado" },
    { id: "auricular", from: 0.04, to: W.ivc, name: "Sístole auricular" },
    { id: "isovol", from: W.ivc, to: W.open, name: "Contracción isovolumétrica" },
    { id: "eyeccion", from: W.open, to: W.close, name: "Eyección" },
    { id: "relajacion", from: W.close, to: W.mitral, name: "Relajación isovolumétrica" },
    { id: "llenado", from: W.mitral, to: W.end, name: "Llenado" },
  ];

  function drawWiggers(t) {
    if (!chart || !chart.isConnected) return;
    const step = current();
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const cw = chart.clientWidth, ch = chart.clientHeight;
    if (chart.width !== Math.round(cw * dpr)) { chart.width = Math.round(cw * dpr); chart.height = Math.round(ch * dpr); }
    const c = chart.getContext("2d");
    const css = getComputedStyle(document.body);
    const ink = css.getPropertyValue("--anatomy-strong").trim(), soft = css.getPropertyValue("--anatomy-muted").trim(), accent = css.getPropertyValue("--accent").trim();
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, cw, ch);
    const L = 34, R = cw - 8, x = (s) => L + ((R - L) * s) / W.end;
    const rows = { p: [10, ch * 0.5], v: [ch * 0.56, ch * 0.76], e: [ch * 0.8, ch - 6] };
    const yp = (mm) => rows.p[1] - ((rows.p[1] - rows.p[0]) * mm) / 130;
    const yv = (ml) => rows.v[1] - ((rows.v[1] - rows.v[0]) * (ml - 40)) / 90;
    // The phase this step explains, as a band.
    for (const ph of PHASES) {
      if (ph.id !== step.phase) continue;
      c.fillStyle = accent;
      c.globalAlpha = 0.14;
      c.fillRect(x(Math.max(0, ph.from)), 4, x(ph.to) - x(Math.max(0, ph.from)), ch - 8);
      c.globalAlpha = 1;
    }
    c.strokeStyle = soft;
    c.globalAlpha = 0.28;
    c.lineWidth = 1;
    c.setLineDash([2, 3]);
    for (const s of [W.ivc, W.open, W.close, W.mitral]) { c.beginPath(); c.moveTo(x(s), 4); c.lineTo(x(s), ch - 4); c.stroke(); }
    c.setLineDash([]);
    c.globalAlpha = 1;
    const plot = (fn, y, colour, width = 1.6) => {
      c.strokeStyle = colour;
      c.lineWidth = width;
      c.beginPath();
      for (let i = 0; i <= 160; i++) { const s = (W.end * i) / 160; i ? c.lineTo(x(s), y(fn(s))) : c.moveTo(x(s), y(fn(s))); }
      c.stroke();
    };
    plot(aop, yp, "#f08a3c");
    plot(lap, yp, "#4f8df0");
    plot(lvp, yp, "#e5484d", 2);
    plot(volume, yv, "#30a46c", 1.8);
    const beat = Physio.cycle(t);
    c.strokeStyle = ink;
    c.lineWidth = 1.3;
    c.beginPath();
    for (let i = 0; i <= 200; i++) {
      const s = (W.end * i) / 200;
      const v = Physio.ecgAt(beat.start + s);
      const y = rows.e[1] - (rows.e[1] - rows.e[0]) * clamp((v + 0.25) / 1.3);
      i ? c.lineTo(x(s), y) : c.moveTo(x(s), y);
    }
    c.stroke();
    c.font = `600 9px ${css.getPropertyValue("--anatomy-mono")}`;
    c.fillStyle = soft;
    c.textAlign = "left";
    c.fillText("120", 2, yp(120) + 3);
    c.fillText("80", 2, yp(80) + 3);
    c.fillText("mL", 2, rows.v[0] + 8);
    c.fillText("ECG", 2, rows.e[0] + 10);
    c.fillStyle = "#e5484d"; c.fillText("VI", x(0.33), yp(124) + 1);
    c.fillStyle = "#f08a3c"; c.fillText("Aorta", x(0.6), yp(96));
    c.fillStyle = "#4f8df0"; c.fillText("AI", x(0.66), yp(17));
    c.fillStyle = "#30a46c"; c.fillText("Volumen VI", x(0.6), rows.v[0] + 2);
    c.fillStyle = soft; c.fillText("mmHg", x(0.7), 14);
    c.fillStyle = soft;
    c.textAlign = "center";
    c.fillText("S1", x(W.ivc), ch - 2);
    c.fillText("S2", x(W.close), ch - 2);
    // Where the heart is now.
    const pos = clamp(beat.pos, 0, W.end);
    c.strokeStyle = accent;
    c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(x(pos), 4); c.lineTo(x(pos), ch - 10); c.stroke();
    c.fillStyle = accent;
    c.beginPath(); c.arc(x(pos), yp(lvp(pos)), 3.2, 0, 7); c.fill();
    c.beginPath(); c.arc(x(pos), yv(volume(pos)), 3.2, 0, 7); c.fill();
  }

  // ── live animations ──────────────────────────────────────────────────────
  const direct = (id, key, values) => { const s = Body.S[id]; s.fx[key].set(values); s.to[key].set(values); };
  const ANIM = {
    // The wave of depolarisation, from the sinus node to the last of the ventricles.
    conduccion(t) {
      const { pos } = Physio.cycle(t);
      const gold = Stage.COLORS.electrico;
      const sa = Stage.anchor("@sa"), av = Stage.anchor("@av"), apex = Stage.anchor("@apex"), lv = Stage.anchor("@lv");
      const atria = smooth(0.0, 0.1, pos) * (1 - smooth(0.12, 0.2, pos));
      const node = smooth(0.06, 0.1, pos) * (1 - smooth(0.17, 0.22, pos));
      const vent = smooth(0.15, 0.2, pos) * (1 - smooth(0.26, 0.4, pos));
      if (atria > node && atria > vent) {
        direct("corazon", "spotA", [...sa, 12 + 62 * smooth(0, 0.1, pos)]);
        direct("corazon", "spotColA", [...gold, 0.85 * atria]);
      } else {
        const grow = smooth(0.15, 0.24, pos);
        const from = vent > 0.02 ? apex.map((v, i) => mix(v, lv[i], grow * 0.6)) : av;
        direct("corazon", "spotA", [...from, vent > 0.02 ? 16 + 74 * grow : 15]);
        direct("corazon", "spotColA", [...gold, vent > 0.02 ? 0.9 * vent : 0.95 * node]);
      }
      const repol = smooth(0.34, 0.42, pos) * (1 - smooth(0.46, 0.58, pos));
      direct("corazon", "spotB", [...lv, 80]);
      direct("corazon", "spotColB", [0.55, 0.75, 1, 0.35 * repol]);
    },
    // A bolus travelling along the gut between two points of its length (mm from the mouth of the oesophagus).
    bolo(t, step) {
      const [from, to, seconds] = step.bolo;
      const f = mix(from, to, (t / seconds) % 1);
      for (const id of ["esofago", "estomago", "duodeno", "yeyuno", "ileon", "colon", "recto"]) {
        const s = Body.S[id];
        const [lo, hi] = s.meta.flow;
        const inside = f > lo - 20 && f < hi + 20;
        direct(id, "swell", [0, f - 22, f + 22, inside ? 4.2 : 0]);
        direct(id, "spotColA", [...Stage.COLORS.alimento, 0]);
      }
    },
    // Drops of urine down the ureters.
    orina(t) {
      const s = Body.S.ureteres;
      const [lo, hi] = s.meta.flow;
      const f = mix(lo, hi, (t / 4) % 1);
      direct("ureteres", "swell", [0, f - 14, f + 14, 2.2]);
    },
  };

  // ── views ────────────────────────────────────────────────────────────────
  const current = () => D.processes.find((p) => p.id === state.id)?.steps[state.step] || {};
  function listHtml() {
    const cards = D.processes.filter((p) => !p.model || p.model === D.model).map((p) => `<button class="card" data-open="${p.id}" style="--hue:${p.hue}"><span class="glyph">${icon(p.glyph)}</span><b>${esc(p.title)}</b><small>${esc(p.blurb)}</small><span class="meta">${p.steps.length} pasos${seen[p.id] ? ` · ${icon("check").replace('class="ic"', 'class="ic" style="width:12px;height:12px"')} visto` : ""}</span></button>`).join("");
    return `<div class="head"><h2><span class="sub">Fisiología en movimiento</span>Procesos</h2></div><p class="muted" style="font-size:13.5px">Cada proceso se reproduce sobre el cuerpo: lo que ves moverse sale del mismo modelo que dibuja el monitor.</p><div class="grid">${cards}<button class="card" data-rhythms style="--hue:#30a46c"><span class="glyph">${icon("flow")}</span><b>Ritmos del monitor</b><small>Ocho trazos: cómo se ven y qué hacer.</small><span class="meta">ECG en vivo</span></button></div>`;
  }
  function stepHtml() {
    const p = D.processes.find((x) => x.id === state.id);
    const s = p.steps[state.step];
    const n = p.steps.length;
    const facts = s.facts ? `<div class="keyfacts">${s.facts.map(([v, l]) => `<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("")}</div>` : "";
    const slow = s.slow ? `<label class="speed">Cámara lenta<input type="range" min="0.1" max="1" step="0.05" value="${Physio.speed}" aria-label="Velocidad"><span data-speed>${Math.round(Physio.speed * 100)} %</span></label>` : "";
    return `<div class="head"><button class="round" data-act="list" aria-label="Volver a los procesos">${icon("back")}</button><h2><span class="sub">${esc(p.title)} · ${state.step + 1} de ${n}</span>${esc(s.title)}</h2><button class="round" data-act="auto" aria-pressed="${state.auto}" aria-label="Reproducir todos los pasos">${icon(state.auto ? "pause" : "play")}</button></div><div class="steps">${p.steps.map((_, i) => `<i ${i < state.step ? "data-done" : i === state.step ? "data-now" : ""}></i>`).join("")}</div>${s.chart ? '<canvas class="chart" aria-hidden="true"></canvas>' : ""}<p class="step-text">${s.text}</p>${facts}${slow}<div class="nav"><button class="btn ghost" data-act="prev" ${state.step ? "" : "disabled"} aria-label="Paso anterior">${icon("back")}</button><button class="btn" data-act="next">${state.step === n - 1 ? "Terminar" : "Siguiente"}${icon("next")}</button></div>`;
  }
  function rhythmsHtml() {
    return `<div class="head"><button class="round" data-act="list" aria-label="Volver a los procesos">${icon("back")}</button><h2><span class="sub">ECG en vivo</span>Ritmos del monitor</h2></div><p class="muted" style="font-size:13.5px">Elige un ritmo: cambian el trazo, la frecuencia y cómo late el corazón. La curva azul es la pletismografía: sin contracción eficaz no hay pulso.</p><div class="rh">${D.rhythms.map((r) => `<button data-rh="${r.id}" aria-pressed="${state.rhythmId === r.id}"><b>${esc(r.name)}<span>${esc(r.rate)}</span></b><p>${esc(r.text)}</p></button>`).join("")}</div><p class="foot">Dosis y algoritmos según ACLS/AHA; confirma con tu guía vigente.</p>`;
  }

  function applyStep() {
    const p = D.processes.find((x) => x.id === state.id);
    const s = p.steps[state.step];
    Stage.scene({ ...(p.base || {}), ...(s.scene || {}), fx: { ...(p.base?.fx || {}), ...(s.scene?.fx || {}) }, title: p.title });
    Physio.set({ ...Physio.NORMAL, ...(p.vitals || {}), ...(s.vitals || {}) });
    Physio.speed = s.slow || 1;
    Monitor.show(p.monitor !== false);
    Sheet.html(stepHtml());
    Sheet.atLeast("mid");
    chart = $(".chart", Sheet.view);
    state.autoAt = performance.now();
    $("[data-hint]").textContent = s.hint || "Gira el cuerpo para verlo desde otro lado";
  }
  function open(id) {
    state.id = id;
    state.step = 0;
    state.rhythm = false;
    applyStep();
  }
  function showList() {
    state.id = null;
    state.rhythm = false;
    state.auto = false;
    chart = null;
    Physio.speed = 1;
    Physio.reset();
    Stage.endScene();
    Stage.home();
    Monitor.show(false);
    Sheet.html(listHtml());
    Sheet.set("mid");
    $("[data-hint]").textContent = "Elige un proceso";
  }
  function showRhythms() {
    state.id = null;
    state.rhythm = true;
    state.rhythmId = "sinusal";
    Stage.scene({ only: ["corazon", "cor-izq", "cor-da", "cor-cx", "cor-der", "venas-cardiacas", "aorta", "vcs", "vci", "carotidas", "subclavias"], focus: "corazon", zoom: 6.4, turn: -0.3, title: "Ritmos del monitor" });
    Monitor.show(true);
    Sheet.html(rhythmsHtml());
    Sheet.set("mid");
    $("[data-hint]").textContent = "Mira cómo late con cada ritmo";
  }
  const RHYTHM_SET = { sinusal: { rhythm: "sinusal", hr: 72 }, taqui: { rhythm: "sinusal", hr: 125 }, bradi: { rhythm: "sinusal", hr: 45 }, fa: { rhythm: "fa", hr: 110, spo2: 96 }, flutter: { rhythm: "flutter", hr: 150 }, bav3: { rhythm: "bav3", hr: 38, sys: 96, dia: 54 }, tv: { rhythm: "tv", hr: 180, sys: 84, dia: 50, spo2: 88, perf: 0.5 }, fv: { rhythm: "fv", hr: 0, sys: 0, dia: 0, spo2: 0, perf: 0 } };

  function step(by) {
    const p = D.processes.find((x) => x.id === state.id);
    const next = state.step + by;
    if (next >= p.steps.length) {
      seen[p.id] = 1;
      store.set("processes", seen);
      Sheet.toast("Proceso completado", "good");
      showList();
      return;
    }
    state.step = clamp(next, 0, p.steps.length - 1);
    applyStep();
  }

  function bind() {
    Sheet.view.addEventListener("click", (e) => {
      if (Tabs.now !== "procesos") return;
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.open) open(b.dataset.open);
      else if (b.dataset.rhythms !== undefined) showRhythms();
      else if (b.dataset.act === "list") showList();
      else if (b.dataset.act === "next") { state.auto = false; step(1); }
      else if (b.dataset.act === "prev") { state.auto = false; step(-1); }
      else if (b.dataset.act === "auto") { state.auto = !state.auto; state.autoAt = performance.now(); Sheet.html(stepHtml(), { top: false }); chart = $(".chart", Sheet.view); }
      else if (b.dataset.rh) {
        state.rhythmId = b.dataset.rh;
        Physio.set({ ...Physio.NORMAL, ...RHYTHM_SET[b.dataset.rh] });
        Sheet.html(rhythmsHtml(), { top: false });
      }
    });
    Sheet.view.addEventListener("input", (e) => {
      if (Tabs.now !== "procesos" || !e.target.matches(".speed input")) return;
      Physio.speed = Number(e.target.value);
      $("[data-speed]", Sheet.view).textContent = `${Math.round(Physio.speed * 100)} %`;
    });
    bus.on("tap", ({ hit }) => {
      if (Tabs.now !== "procesos" || !hit || hit.id === "piel") return;
      Sheet.toast(Body.S[hit.id].info.name);
    });
    bus.emit("frame-hook", (t) => {
      if (Tabs.now !== "procesos" || !state.id) return;
      const s = current();
      if (s.chart) drawWiggers(t);
      if (s.anim && ANIM[s.anim] && !still.matches) ANIM[s.anim](t, s);
      if (state.auto && performance.now() - state.autoAt > (s.seconds || 9) * 1000) step(1);
    });
  }
  return { bind, enter: showList, leave() { Physio.speed = 1; chart = null; state.id = null; state.auto = false; }, root: showList, open(id) { Tabs.set("procesos", { silent: true }); open(id); } };
})();

// ── Cases: a patient on the stand ──
// A case is a vignette, then a chain of nodes: questions (a decision with feedback) and frames
// that show on the body what the disease is doing. The monitor and the model follow every node.
const Cases = (() => {
  const state = { id: null, node: -1, picked: null, order: [], right: 0, asked: 0, area: "" };
  const done = store.get("cases", {});
  const stars = (n, cls = "stars") => `<span class="${cls}" aria-label="${n} de 3 estrellas">${[1, 2, 3].map((i) => icon("star").replace('class="ic"', `class="ic"${i <= n ? " data-on" : ""}`)).join("")}</span>`;
  // Cases written for one body only appear with it.
  const CASES = D.cases.filter((c) => !c.model || c.model === D.model);
  const theCase = () => CASES.find((c) => c.id === state.id);

  function listHtml() {
    const areas = [...new Set(CASES.map((c) => c.area))];
    const solved = CASES.filter((c) => done[c.id]).length;
    const total = CASES.reduce((n, c) => n + (done[c.id]?.stars || 0), 0);
    const chips = [`<button class="chip" data-area="" aria-pressed="${!state.area}">Todos</button>`, ...areas.map((a) => `<button class="chip" data-area="${esc(a)}" aria-pressed="${state.area === a}">${esc(a)}</button>`)].join("");
    const rows = CASES.filter((c) => !state.area || c.area === state.area).map((c) => `<button class="case-row" data-open="${c.id}" style="--hue:${c.hue}"><span class="glyph">${icon(c.glyph || "cases")}</span><span><b>${esc(c.title)}</b><small>${esc(c.area)} · ${"●".repeat(c.level)}${"○".repeat(3 - c.level)} · ${c.nodes.filter((n) => n.q).length} decisiones</small></span>${done[c.id] ? stars(done[c.id].stars) : ""}</button>`).join("");
    return `<div class="head"><h2><span class="sub">Simulador</span>Casos clínicos</h2></div><div class="score"><div><b>${solved}/${CASES.length}</b><span>casos resueltos</span></div><div><b>${total}/${CASES.length * 3}</b><span>estrellas</span></div></div><div class="chips" role="group" aria-label="Especialidad">${chips}</div>${rows}<p class="foot">Los casos son escenarios de estudio. Las conductas siguen las guías de práctica clínica y los cursos ATLS y ACLS; confirma dosis y tiempos con la versión vigente.</p>`;
  }
  const headHtml = (c, sub, title) => `<div class="head"><button class="round" data-act="list" aria-label="Salir del caso">${icon("close")}</button><h2><span class="sub">${esc(sub)}</span>${esc(title)}</h2></div>`;
  const dots = (c) => `<div class="steps">${c.nodes.map((_, i) => `<i ${i < state.node ? "data-done" : i === state.node ? "data-now" : ""}></i>`).join("")}</div>`;
  function introHtml(c) {
    const exam = c.intro.exam ? `<h3>Exploración</h3><ul>${c.intro.exam.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
    const labs = c.intro.labs ? `<div class="keyfacts">${c.intro.labs.map(([v, l]) => `<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("")}</div>` : "";
    return `${headHtml(c, c.area, c.title)}<div class="tagline"><span class="tag" data-tone="accent">${esc(c.patient)}</span></div><p class="vignette">${esc(c.intro.text)}</p>${exam}${labs}<div class="nav"><button class="btn" data-act="go">Atender al paciente${icon("next")}</button></div>`;
  }
  function nodeHtml(c) {
    const n = c.nodes[state.node];
    const head = headHtml(c, `${c.title} · ${state.node + 1} de ${c.nodes.length}`, n.q ? "¿Qué haces?" : n.title) + dots(c);
    if (!n.q) {
      const facts = n.facts ? `<div class="keyfacts">${n.facts.map(([v, l]) => `<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("")}</div>` : "";
      return `${head}<p class="step-text">${n.text}</p>${facts}<div class="nav"><button class="btn" data-act="next">Continuar${icon("next")}</button></div>`;
    }
    const answered = state.picked !== null;
    const opts = state.order.map((i) => {
      const mark = answered ? (i === n.ok ? "ok" : i === state.picked ? "bad" : "") : "";
      return `<button class="opt" data-opt="${i}" ${answered ? "disabled" : ""} ${mark ? `data-state="${mark}"` : ""}>${esc(n.options[i])}</button>`;
    }).join("");
    const why = answered ? `<div class="why" ${state.picked === n.ok ? "data-ok" : "data-bad"}><b>${state.picked === n.ok ? "Correcto" : "No era esa"}</b>${esc(n.why)}</div><div class="nav"><button class="btn" data-act="next">Continuar${icon("next")}</button></div>` : "";
    const lead = n.lead ? `<p class="step-text">${n.lead}</p>` : "";
    return `${head}${lead}<p class="q">${esc(n.q)}</p><div class="opts">${opts}</div>${why}`;
  }
  function summaryHtml(c) {
    const score = state.asked ? state.right / state.asked : 1;
    const got = score === 1 ? 3 : score >= 0.6 ? 2 : 1;
    const cards = (c.organs || []).map((id) => `<button class="chip" data-card="${id}">${icon("body")}${esc(D.cards[id].name)}</button>`).join("");
    return `${headHtml(c, c.area, c.title)}${stars(got, "bigstars")}<div class="score"><div><b>${state.right}/${state.asked}</b><span>decisiones correctas al primer intento</span></div></div><h3>Para llevarte</h3><ul>${c.pearls.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>${cards ? `<h3>Repasa la anatomía</h3><div class="chips" style="margin-top:0">${cards}</div>` : ""}<div class="actions"><button class="btn" data-act="list">Otro caso</button><button class="btn ghost" data-act="again">Repetir</button></div>`;
  }

  function show() {
    const c = theCase();
    const n = state.node < 0 ? c.intro : state.node >= c.nodes.length ? null : c.nodes[state.node];
    if (n) {
      // A question keeps the scene before it; its `after` plays once it is answered.
      if (n.scene) Stage.scene({ ...(c.base || {}), ...n.scene, fx: { ...(c.base?.fx || {}), ...(n.scene.fx || {}) }, title: c.title });
      if (n.vitals) Physio.set(n.vitals);
    }
    Sheet.html(state.node < 0 ? introHtml(c) : n ? nodeHtml(c) : summaryHtml(c));
    Sheet.atLeast("mid");
  }
  function open(id) {
    const c = CASES.find((x) => x.id === id);
    if (!c) return;
    Object.assign(state, { id, node: -1, picked: null, right: 0, asked: 0 });
    Physio.set({ ...Physio.NORMAL, ...c.intro.vitals }, { instant: true });
    Stage.scene({ ...(c.base || {}), ...(c.intro.scene || {}), title: c.title });
    Monitor.show(true);
    show();
    $("[data-hint]").textContent = c.patient;
  }
  function advance() {
    const c = theCase();
    state.node++;
    state.picked = null;
    const n = c.nodes[state.node];
    if (n?.q) state.order = n.options.map((_, i) => i).sort(() => Math.random() - 0.5);
    if (state.node >= c.nodes.length) {
      const score = state.asked ? state.right / state.asked : 1;
      const got = score === 1 ? 3 : score >= 0.6 ? 2 : 1;
      done[c.id] = { stars: Math.max(got, done[c.id]?.stars || 0) };
      store.set("cases", done);
    }
    show();
  }
  function pick(index) {
    const c = theCase();
    const n = c.nodes[state.node];
    state.picked = index;
    state.asked++;
    const ok = index === n.ok;
    if (ok) state.right++;
    Sheet.toast(ok ? "Correcto" : "Revisa la explicación", ok ? "good" : "bad");
    if (n.after) {
      if (n.after.scene) Stage.scene({ ...(c.base || {}), ...n.after.scene, fx: { ...(c.base?.fx || {}), ...(n.after.scene.fx || {}) }, title: c.title });
      if (n.after.vitals) Physio.set(n.after.vitals);
    }
    Sheet.html(nodeHtml(c), { top: false });
    requestAnimationFrame(() => $(".why", Sheet.view)?.scrollIntoView({ block: "nearest", behavior: still.matches ? "auto" : "smooth" }));
  }
  function showList() {
    state.id = null;
    Physio.reset();
    Stage.endScene();
    Stage.home();
    Monitor.show(false);
    Sheet.html(listHtml());
    Sheet.set("mid");
    $("[data-hint]").textContent = "Elige un paciente";
  }

  function bind() {
    Sheet.view.addEventListener("click", (e) => {
      if (Tabs.now !== "casos") return;
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.open) open(b.dataset.open);
      else if (b.dataset.area !== undefined) { state.area = b.dataset.area; Sheet.html(listHtml(), { top: false }); }
      else if (b.dataset.act === "list") showList();
      else if (b.dataset.act === "go" || b.dataset.act === "next") advance();
      else if (b.dataset.act === "again") open(state.id);
      else if (b.dataset.opt !== undefined && state.picked === null) pick(Number(b.dataset.opt));
      else if (b.dataset.card) Explore.openCard(b.dataset.card);
    });
    bus.on("tap", ({ hit }) => {
      if (Tabs.now !== "casos" || !hit || hit.id === "piel") return;
      Sheet.toast(Body.S[hit.id].info.name);
    });
  }
  return { bind, enter: showList, leave() { state.id = null; }, root: showList, open(id) { Tabs.set("casos", { silent: true }); open(id); } };
})();

// ── Review: exam-style questions, and "find it on the body" ──
const Quiz = (() => {
  const ALL = [];
  for (const [id, card] of Object.entries(D.cards)) (card.quiz || []).forEach((q, i) => ALL.push({ ...q, id: `${id}:${i}`, card: id }));
  const stats = store.get("stats", {});
  const state = { mode: store.get("review", "preguntas"), filter: "todo", card: null, q: null, picked: null, session: { ok: 0, n: 0 }, find: null, misses: 0, streak: 0, best: store.get("streak", 0), found: false };
  const structOf = (card) => Body.LIST.find((s) => s.info.card === card);
  const sysOfCard = (card) => structOf(card)?.info.sys;
  // Structures that can be reached by turning the body and switching layers.
  const FINDABLE = ["corazon", "pulmon-der-sup", "pulmon-der-med", "pulmon-der-inf", "pulmon-izq-sup", "pulmon-izq-inf", "traquea", "diafragma", "timo", "higado", "vesicula", "estomago", "bazo", "colon", "yeyuno", "ileon", "vejiga", "rinon-der", "rinon-izq", "aorta", "vci", "carotidas", "yugulares", "art-iliacas", "art-pulmonar", "craneo", "mandibula", "laringe", "claviculas", "escapulas", "humeros", "radios", "cubitos", "manos", "esternon", "costillas", "cartilagos", "col-cervical", "col-toracica", "col-lumbar", "sacro", "pelvis", "femures", "rotulas", "tibias", "perones", "pies", "cerebelo", "tronco", "lob-frontal", "lob-parietal", "lob-temporal", "lob-occipital", "giro-precentral", "giro-poscentral", "ojos", "genitales", "suprarrenales"];

  function pool() {
    if (state.filter === "falladas") return ALL.filter((q) => stats[q.id] && stats[q.id].last === 0);
    if (state.filter === "ficha") return ALL.filter((q) => q.card === state.card);
    if (state.filter === "todo") return ALL;
    return ALL.filter((q) => sysOfCard(q.card) === state.filter);
  }
  function nextQuestion() {
    const list = pool();
    state.picked = null;
    if (!list.length) { state.q = null; return; }
    const weight = (q) => { const s = stats[q.id]; return !s ? 3 : s.last === 0 ? 4 : 1; };
    let roll = list.reduce((a, q) => a + weight(q), 0) * Math.random();
    let q = list[0];
    for (const c of list) { roll -= weight(c); if (roll <= 0) { q = c; break; } }
    if (state.q && list.length > 1 && q.id === state.q.id) q = list[(list.indexOf(q) + 1) % list.length];
    state.q = { ...q, order: q.a.map((_, i) => i).sort(() => Math.random() - 0.5) };
    Stage.select(null, { quiet: true });
  }
  const head = () => `<div class="head"><h2><span class="sub">Repaso</span>${state.mode === "preguntas" ? "Preguntas tipo ENARM" : "Localiza en el cuerpo"}</h2></div><div class="seg" role="group" aria-label="Modo de repaso"><button data-mode="preguntas" aria-pressed="${state.mode === "preguntas"}">Preguntas</button><button data-mode="localiza" aria-pressed="${state.mode === "localiza"}">Localiza</button></div>`;
  function questionsHtml() {
    const mastered = ALL.filter((q) => stats[q.id]?.last === 1).length;
    const failed = ALL.filter((q) => stats[q.id]?.last === 0).length;
    const filters = [["todo", "Todo"], ...D.systems.map((s) => [s.id, s.name]), ["falladas", `Falladas (${failed})`]];
    if (state.card) filters.unshift(["ficha", D.cards[state.card].name]);
    const chips = filters.map(([id, name]) => `<button class="chip" data-filter="${id}" aria-pressed="${state.filter === id}">${esc(name)}</button>`).join("");
    const top = `${head()}<div class="score"><div><b>${state.session.ok}/${state.session.n}</b><span>esta sesión</span></div><div><b>${mastered}/${ALL.length}</b><span>dominadas</span></div></div><div class="chips" role="group" aria-label="Filtro">${chips}</div>`;
    const q = state.q;
    if (!q) return top + `<p class="muted">${state.filter === "falladas" ? "No tienes preguntas falladas." : "No hay preguntas con este filtro."}</p>`;
    const answered = state.picked !== null;
    const opts = q.order.map((i) => `<button class="opt" data-opt="${i}" ${answered ? "disabled" : ""} ${answered && i === q.ok ? 'data-state="ok"' : answered && i === state.picked ? 'data-state="bad"' : ""}>${esc(q.a[i])}</button>`).join("");
    const why = answered ? `<div class="why" ${state.picked === q.ok ? "data-ok" : "data-bad"}><b>${state.picked === q.ok ? "Correcto" : "Incorrecto"} · ${esc(D.cards[q.card].name)}</b>${esc(q.why)}</div><div class="actions"><button class="btn" data-act="next">Siguiente${icon("next")}</button><button class="btn ghost" data-act="card" data-card="${q.card}">Ver ficha</button></div>` : "";
    return `${top}<p class="q">${esc(q.q)}</p><div class="opts">${opts}</div>${why}`;
  }

  function nextFind() {
    const list = FINDABLE.filter((id) => !state.find || id !== state.find);
    state.find = list[Math.floor(Math.random() * list.length)];
    state.misses = 0;
    state.found = false;
    Stage.select(null, { quiet: true });
    Stage.home();
  }
  function findHtml() {
    const s = Body.S[state.find];
    const card = D.cards[s.info.card];
    const sys = D.systems.find((x) => x.id === s.info.sys);
    const span = Stage.levelSpan(s.meta.lo[2], s.meta.hi[2]);
    const hint = state.misses > 0 && !state.found ? `<p class="muted">Pista: ${esc(sys.name)}${span ? ` · nivel ${span}` : ""}. ${state.misses > 1 ? "Prueba a quitar capas con los botones de la derecha." : ""}</p>` : "";
    const after = state.found ? `<div class="pearl" style="text-align:left"><b>${esc(card ? card.name : s.info.name)}</b>${esc(card ? card.pearl : "")}</div>` : "";
    const buttons = state.found ? `<button class="btn" data-act="find-next">Siguiente${icon("next")}</button><button class="btn ghost" data-act="card" data-card="${s.info.card}">Ver ficha</button>` : `<button class="btn ghost" data-act="reveal">Mostrar</button><button class="btn ghost" data-act="find-next">Saltar</button>`;
    return `${head()}<div class="find"><span class="tag" data-tone="accent" style="float:right">Racha ${state.streak} · mejor ${state.best}</span><small>${state.found ? "Aquí está" : "Toca en el cuerpo"}</small><b>${esc(s.info.name)}</b>${hint}${after}</div><div class="actions">${buttons}</div>`;
  }
  function render({ top = true } = {}) {
    Sheet.html(state.mode === "preguntas" ? questionsHtml() : findHtml(), { top });
    $("[data-hint]").textContent = state.mode === "localiza" ? "Gira, acerca y quita capas para encontrarlo" : "El órgano de cada pregunta se ilumina al responder";
  }
  function setMode(mode) {
    state.mode = mode;
    store.set("review", mode);
    Stage.endScene();
    if (mode === "preguntas") { if (!state.q) nextQuestion(); Sheet.set("mid"); }
    else { if (!state.find) nextFind(); Sheet.set("peek", { peekHeight: 318 }); }
    render();
  }
  function reveal(found) {
    state.found = true;
    if (found) { state.streak++; if (state.streak > state.best) { state.best = state.streak; store.set("streak", state.best); } }
    else state.streak = 0;
    Stage.touch();
    Stage.select(state.find, { quiet: true });
    render();
  }

  function bind() {
    Sheet.view.addEventListener("click", (e) => {
      if (Tabs.now !== "repaso") return;
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.mode) setMode(b.dataset.mode);
      else if (b.dataset.filter) { state.filter = b.dataset.filter; nextQuestion(); render({ top: false }); }
      else if (b.dataset.act === "next") { nextQuestion(); render(); }
      else if (b.dataset.act === "card") Explore.openCard(b.dataset.card);
      else if (b.dataset.act === "find-next") { if (!state.found) state.streak = 0; nextFind(); render(); }
      else if (b.dataset.act === "reveal") reveal(false);
      else if (b.dataset.opt !== undefined && state.q && state.picked === null) {
        const q = state.q;
        state.picked = Number(b.dataset.opt);
        const ok = state.picked === q.ok ? 1 : 0;
        state.session.n++;
        state.session.ok += ok;
        const s = stats[q.id] || { n: 0, ok: 0 };
        s.n++; s.ok += ok; s.last = ok;
        stats[q.id] = s;
        store.set("stats", stats);
        const target = structOf(q.card);
        if (target) { Stage.touch(); Stage.select(target.id, { quiet: true }); }
        render({ top: false });
        requestAnimationFrame(() => $(".why", Sheet.view)?.scrollIntoView({ block: "nearest", behavior: still.matches ? "auto" : "smooth" }));
      }
    });
    bus.on("tap", ({ hit }) => {
      if (Tabs.now !== "repaso") return;
      if (state.mode !== "localiza") { if (hit && hit.id !== "piel") Sheet.toast(Body.S[hit.id].info.name); return; }
      if (state.found || !hit || hit.id === "piel") return;
      if (hit.id === state.find) { Sheet.toast("¡Correcto!", "good"); reveal(true); return; }
      state.misses++;
      state.streak = 0;
      Sheet.toast(`Eso es: ${Body.S[hit.id].info.name}`, "bad");
      render({ top: false });
    });
  }
  function enter() {
    Monitor.show(false);
    setMode(state.mode);
  }
  function startCard(card) {
    Tabs.set("repaso", { silent: true });
    Monitor.show(false);
    state.card = card;
    state.filter = "ficha";
    state.mode = "preguntas";
    nextQuestion();
    Sheet.set("mid");
    render();
  }
  return { bind, enter, leave() {}, root() { setMode(state.mode); }, startCard, get total() { return ALL.length; } };
})();

// ── Main: tabs, theme, the stage's buttons, start-up and the frame loop ──
const Tabs = (() => {
  const modes = { explorar: Explore, procesos: Processes, casos: Cases, repaso: Quiz };
  const buttons = $$(".tabbar button");
  let now = "explorar";
  function set(name, { silent = false } = {}) {
    if (name === now) { modes[now].root?.(); return; }
    modes[now].leave?.();
    Stage.endScene();
    Physio.reset();
    now = name;
    for (const b of buttons) b.setAttribute("aria-selected", String(b.dataset.tab === name));
    $("[data-fig]").textContent = `Fig ${Object.keys(modes).indexOf(name) + 1}`;
    if (!silent) modes[now].enter();
  }
  for (const b of buttons) b.addEventListener("click", () => set(b.dataset.tab));
  return { set, modes, get now() { return now; } };
})();

const Theme = (() => {
  let theme = store.get("theme", null) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  function apply() {
    const dark = theme === "dark";
    document.body.dataset.theme = theme;
    Body.look.dark = dark;
    Body.look.accent = dark ? [1, 0.62, 0.16] : [0.95, 0.5, 0.05];
    Body.setStudio(dark);
    $('meta[name="theme-color"]').content = dark ? "#0b0b0b" : "#f2f2ef";
  }
  function toggle() {
    theme = theme === "dark" ? "light" : "dark";
    store.set("theme", theme);
    apply();
  }
  return { apply, toggle };
})();

(function start() {
  const app = $(".app");
  const loading = $(".loading");
  const bar = $(".loading u");
  const note = $("[data-loading]");
  const hooks = [];
  bus.on("frame-hook", (fn) => hooks.push(fn));

  note.textContent = D.model === "mujer" ? "Cargando el cuerpo femenino…" : "Cargando el cuerpo masculino…";
  Sheet.init();
  Monitor.init();
  const ok = Body.init($(".gl"));
  Theme.apply();

  // Layer switches and view tools.
  const DOT = { piel: "#E7B99C", musculo: "#A93C33", hueso: "#E8DFCA", organo: "#C9706B", vaso: "#3E62C6", nervio: "#F3D57A" };
  $(".rail").innerHTML = D.layers.map((l) => `<button type="button" data-layer="${l.id}" aria-pressed="true" aria-label="Capa: ${l.name}"><i style="--dot:${DOT[l.id]}"></i>${l.short}</button>`).join("");
  $(".tools").innerHTML = [["home", "home", "Ver el cuerpo completo"], ["flip", "turn", "Girar media vuelta"], ["explode", "explode", "Separar las piezas"], ["theme", "theme", "Tema claro u oscuro"]]
    .map(([act, glyph, label]) => `<button type="button" data-tool="${act}" aria-label="${label}" title="${label}">${icon(glyph)}</button>`).join("");
  // The two bodies: switching loads the other model (it stays cached for next time).
  const sexes = $(".sex");
  sexes.innerHTML = [["mujer", "Mujer"], ["hombre", "Hombre"]].map(([id, name]) => `<button type="button" data-model="${id}" aria-pressed="${D.model === id}">${name}</button>`).join("");
  sexes.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-model]");
    if (!b || b.dataset.model === D.model) return;
    store.set("modelo", b.dataset.model);
    const url = new URL(location.href);
    url.searchParams.delete("modelo");
    $(".loading").removeAttribute("data-done");
    $("[data-loading]").textContent = b.dataset.model === "mujer" ? "Cargando el cuerpo femenino…" : "Cargando el cuerpo masculino…";
    setTimeout(() => location.replace(url), 60);
  });
  $(".rail").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-layer]");
    if (b) Stage.setLayer(b.dataset.layer, b.getAttribute("aria-pressed") !== "true");
  });
  $(".tools").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-tool]");
    if (!b) return;
    Stage.touch();
    if (b.dataset.tool === "home") { Stage.home(); }
    else if (b.dataset.tool === "flip") Body.view.turnTo += Math.PI;
    else if (b.dataset.tool === "theme") Theme.toggle();
    else if (b.dataset.tool === "explode") {
      const on = Body.look.explodeTo < 0.5;
      Body.look.explodeTo = on ? 1 : 0;
      b.setAttribute("aria-pressed", String(on));
      if (on) Body.view.zoomTo = Math.min(Body.view.zoomTo, 0.82);
      else if (Body.view.zoomTo < 1) Body.view.zoomTo = 1;
    }
  });

  if (!ok) {
    note.innerHTML = `Este navegador no puede dibujar el modelo 3D (${esc(Body.failed)}).<br><a href="torso.html" style="color:inherit">Abrir la maqueta del torso en su lugar</a>`;
    return;
  }
  Stage.init();
  for (const mode of Object.values(Tabs.modes)) mode.bind?.();
  Tabs.modes.explorar.enter();

  let last = 0, frame = 0;
  function tick(ms) {
    const dt = last ? Math.min(0.05, (ms - last) / 1000) : 1 / 60;
    last = ms;
    const t = Physio.tick(dt * Physio.speed);
    Stage.frame(t, dt);
    Body.render(t, dt);
    Monitor.frame(t);
    for (const fn of hooks) fn(t, dt);
    frame = document.hidden ? 0 : requestAnimationFrame(tick);
  }
  const kick = () => { if (!frame && !document.hidden) { last = 0; frame = requestAnimationFrame(tick); } };
  document.addEventListener("visibilitychange", kick);
  kick();

  Body.load((p) => { bar.style.width = `${Math.round(p * 100)}%`; })
    .then(() => { Body.settle(); loading.setAttribute("data-done", ""); app.removeAttribute("data-busy"); })
    .catch((error) => { note.innerHTML = `${esc(error.message || error)}<br><button class="btn" style="margin-top:12px" onclick="location.reload()">Reintentar</button>`; });

  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");
  window.__app = { Body, Stage, Physio, Tabs, Sheet, Monitor, Cases, Processes };
})();

})();</script>
